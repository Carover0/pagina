<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FIRO · Masternodos en Vivo</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
        min-height: 100vh;
        background: #0a080c;
        background-image:
            radial-gradient(ellipse at 30% 40%, rgba(155, 28, 46, 0.08) 0%, transparent 60%),
            radial-gradient(ellipse at 70% 80%, rgba(155, 28, 46, 0.05) 0%, transparent 50%),
            linear-gradient(160deg, #0a080c 0%, #161114 50%, #0d0b10 100%);
        font-family: 'Lucida Console', 'Courier New', monospace;
        color: #ece8e0;
        padding: 20px;
        display: flex;
        justify-content: center;
    }

    .app { width: 100%; max-width: 1200px; }

    .stat-item .value.green { color: #31db72; }

    .header {
        display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between;
        gap: 12px 20px;
        padding: 16px 24px;
        background: rgba(255,255,255,0.02);
        border-radius: 14px;
        border: 1px solid rgba(155, 28, 46, 0.2);
        backdrop-filter: blur(8px);
        margin-bottom: 24px;
    }
    .brand { display: flex; align-items: center; gap: 14px; }
    .brand img {
        width: 38px; height: 38px;
        filter: drop-shadow(0 0 16px rgba(155, 28, 46, 0.3));
        transition: filter 0.3s;
    }
    .brand img:hover { filter: drop-shadow(0 0 24px rgba(155, 28, 46, 0.5)); }
    .brand h1 { font-size: 21px; font-weight: 400; color: #f5e6c8; }
    .brand h1 small { font-size: 12px; color: #6a6255; }

    .nav-links {
        display: flex; flex-wrap: wrap; gap: 4px 18px;
        font-size: 13px; letter-spacing: 0.3px;
        justify-content: center; flex: 1;
    }
    .nav-links a {
        color: #6a6255; text-decoration: none;
        transition: all 0.25s; padding: 4px 0;
        border-bottom: 2px solid transparent;
    }
    .nav-links a:hover { color: #ff7b87; border-bottom-color: #ff7b87; }

    .lang-switcher {
        display: inline-flex; align-items: center;
        gap: 4px; margin-inline-start: auto;
    }
    .lang-switcher button {
        background: transparent;
        border: 1px solid rgba(155, 28, 46, 0.15);
        color: #6a6255;
        font-family: 'Lucida Console', monospace;
        font-size: 10px; letter-spacing: 0.5px;
        padding: 4px 10px; border-radius: 12px;
        cursor: pointer; transition: all 0.25s;
    }
    .lang-switcher button:hover {
        color: #ff7b87; border-color: rgba(155, 28, 46, 0.35);
    }
    .lang-switcher button.active {
        color: #ff7b87;
        background: rgba(155, 28, 46, 0.12);
        border-color: rgba(155, 28, 46, 0.4);
    }

    .stats-panel {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
        gap: 14px;
        padding: 16px 20px;
        background: rgba(255,255,255,0.015);
        border-radius: 14px;
        border: 1px solid rgba(155, 28, 46, 0.08);
        margin-bottom: 24px;
    }
    .stat-item .label {
        font-size: 10px; text-transform: uppercase;
        color: #4a443a;
    }
    .stat-item .value {
        font-size: 15px; font-weight: 500; color: #f5ede4;
    }
    .stat-item .value.firo { color: #ff7b87; }
    .stat-item .sub { font-size: 12px; color: #5a5348; }

    .section-title {
        font-size: 13px; letter-spacing: 1px;
        padding: 0 4px 10px 4px;
        margin-bottom: 4px;
        border-bottom: 1px solid rgba(155, 28, 46, 0.08);
    }
    .section-title.next { color: #dd9d34; margin-top: 8px; }
    .section-title.past { color: #31db72; margin-top: 28px; }

    .cards-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
        gap: 20px;
        margin-bottom: 8px;
        min-height: 120px;
    }

    .block-card {
        background: rgba(255,255,255,0.02);
        border-radius: 16px;
        padding: 18px 20px 16px;
        border: 1px solid rgba(155, 28, 46, 0.08);
        backdrop-filter: blur(4px);
        transition: all 0.3s ease;
        box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        cursor: pointer;
        text-decoration: none;
        color: inherit;
        display: block;
    }
    .block-card:hover {
        border-color: rgba(155, 28, 46, 0.3);
        transform: translateY(-4px);
        box-shadow: 0 8px 40px rgba(155, 28, 46, 0.15);
        background: rgba(255,255,255,0.05);
    }
    .block-card.futuro { border-left: 2px solid rgba(221, 157, 52, 0.4); }
    .block-card.pasado { border-left: 2px solid rgba(49, 219, 114, 0.3); }
    .block-card.mi-nodo {
        border-color: rgba(255, 123, 135, 0.4);
        background: rgba(155, 28, 46, 0.05);
    }
    .block-card.mi-nodo:hover {
        background: rgba(155, 28, 46, 0.08);
        border-color: rgba(255, 123, 135, 0.6);
    }

    .block-top {
        display: flex; justify-content: space-between; align-items: baseline;
        border-bottom: 1px solid rgba(155, 28, 46, 0.06);
        padding-bottom: 8px; margin-bottom: 10px;
    }
    .block-height { font-size: 18px; font-weight: 600; color: #f5ede4; }
    .block-time {
        font-size: 11px; color: #6a6255;
        background: rgba(255,255,255,0.03);
        padding: 2px 12px; border-radius: 20px;
        border: 1px solid rgba(155, 28, 46, 0.06);
    }
    .block-row {
        display: flex; justify-content: space-between; align-items: center;
        padding: 4px 0; font-size: 12px;
    }
    .block-row .label {
        color: #4a443a; font-size: 11px; text-transform: uppercase;
    }
    .block-row .value { color: #ece8e0; font-weight: 500; }
    .block-row .value.firo { color: #ff7b87; }
    .block-row .value.mono {
        font-size: 10px; color: #8a8275; word-break: break-all;
        text-align: right; max-width: 65%;
    }
    .block-footer {
        margin-top: 10px; padding-top: 8px;
        border-top: 1px solid rgba(155, 28, 46, 0.06);
        display: flex; flex-wrap: wrap; justify-content: space-between;
        align-items: center; gap: 6px;
    }
    .block-hint { font-size: 9px; color: #4a443a; }
    .block-hint.firo { color: #ff7b87; }

    .error-msg {
        color: #ff756f; padding: 20px; text-align: center;
        background: rgba(255,0,0,0.05); border-radius: 12px;
        border: 1px solid rgba(255,0,0,0.1);
        grid-column: 1 / -1;
    }

    .coin {
        width: 14px; height: 14px;
        vertical-align: -3px; margin-right: 3px;
        display: inline-block;
        filter: drop-shadow(0 0 6px rgba(155, 28, 46, 0.4));
    }

    .footer {
        display: flex; flex-wrap: wrap; justify-content: flex-end;
        padding-top: 14px;
        border-top: 1px solid rgba(155, 28, 46, 0.08);
        font-size: 10px; color: #4a443a;
        margin-top: 18px;
    }
    .footer a {
        color: #6a6255; text-decoration: none;
        border-bottom: 1px solid transparent;
        transition: 0.2s; cursor: pointer;
    }
    .footer a:hover {
        color: #ff7b87;
        border-bottom-color: rgba(155, 28, 46, 0.15);
    }

    .modal-overlay {
        display: none;
        position: fixed; inset: 0;
        background: rgba(10, 8, 12, 0.1);
        backdrop-filter: blur(1.5px);
        z-index: 1000;
        justify-content: center; align-items: center;
        padding: 20px;
    }
    .modal-overlay.activo { display: flex; }

    .modal-content {
        background: #161114;
        border: 1px solid rgba(155,28,46,0.3);
        border-radius: 18px;
        padding: 28px 32px;
        max-width: 560px; width: 100%;
        max-height: 90vh; overflow-y: auto;
        position: relative;
        box-shadow: 0 20px 60px rgba(0,0,0,0.6);
        animation: modalIn 0.3s cubic-bezier(0.16,1,0.3,1);
    }
    @keyframes modalIn {
        0% { transform: scale(0.95); opacity: 0; }
        100% { transform: scale(1); opacity: 1; }
    }
    .modal-close {
        position: absolute; top: 14px; right: 18px;
        background: rgba(255,255,255,0.05);
        border: 1px solid rgba(155,28,46,0.2);
        color: #ff7b87; font-size: 16px;
        width: 32px; height: 32px; border-radius: 50%;
        cursor: pointer; transition: all 0.2s;
    }
    .modal-close:hover { background: rgba(155,28,46,0.2); }

    .modal-header {
        display: flex; align-items: center; gap: 16px;
        padding-bottom: 16px; margin-bottom: 18px;
        border-bottom: 1px solid rgba(155,28,46,0.15);
    }
    .modal-logo {
        width: 64px; height: 64px;
        filter: drop-shadow(0 0 20px rgba(155,28,46,0.4));
    }
    .modal-header h2 {
        font-size: 18px; font-weight: 400; color: #f5e6c8;
    }

    .modal-body .fila {
        display: flex; justify-content: space-between;
        align-items: flex-start; gap: 12px;
        padding: 8px 0; font-size: 12px;
        border-bottom: 1px solid rgba(155,28,46,0.06);
    }
    .modal-body .fila:last-child { border-bottom: none; }
    .modal-body .fila .label {
        color: #4a443a; font-size: 10px;
        text-transform: uppercase;
        flex-shrink: 0; min-width: 90px;
    }
    .modal-body .fila .valor {
        color: #ece8e0; font-weight: 500;
        text-align: right; word-break: break-all;
    }
    .modal-body .fila .valor.firo { color: #ff7b87; }
    .modal-body .fila .valor.mono {
        font-size: 10px; color: #8a8275;
    }

    [dir="rtl"] .block-row .value,
    [dir="rtl"] .stat-item .value,
    [dir="rtl"] .modal-body .fila .valor {
        direction: ltr;
        unicode-bidi: embed;
    }
    [dir="rtl"] .nav-links { flex-direction: row-reverse; }

    @media (max-width: 700px) {
        .header { flex-direction: column; align-items: stretch; gap: 10px; }
        .cards-grid { grid-template-columns: 1fr; }
        .stats-panel { grid-template-columns: 1fr 1fr; }
        .nav-links { font-size: 11px; gap: 2px 14px; justify-content: center; }
        .lang-switcher { margin-inline-start: 0; justify-content: center; }
    }
    @media (max-width: 450px) {
        .stats-panel { grid-template-columns: 1fr; }
        .block-top { flex-direction: column; align-items: flex-start; gap: 6px; }
        .block-time { align-self: flex-start; }
        .modal-content { padding: 20px 18px; }
        .modal-header { gap: 12px; }
        .modal-logo { width: 48px; height: 48px; }
    }
</style>
</head>
<body>
<div class="app">
  <header class="header">
    <div class="brand">
      <img src="assets/firo.png" alt="FIRO" onerror="this.style.display='none'">
      <h1>FIRO <small data-i18n="masternodos.title_short">masternodos en vivo</small></h1>
    </div>
    <nav class="nav-links">
      <a href="https://carover0.github.io/pagina/firo-nodo.html" data-i18n="common.nav.node">[NODO]</a>
      <a href="https://carover0.github.io/pagina/firo-explorer.html" data-i18n="common.nav.explorer">[EXPLORADOR]</a>
      <a href="https://carover0.github.io/pagina/firo-consola.html" data-i18n="common.nav.console">[CONSOLA]</a>
      <a href="https://carover0.github.io/pagina/" data-i18n="common.nav.home">[INICIO]</a>
    </nav>

    <div class="lang-switcher" role="group" aria-label="Language">
      <button type="button" data-lang="es" class="active">ES</button>
      <button type="button" data-lang="en">EN</button>
      <button type="button" data-lang="ar">AR</button>
    </div>
  </header>

  <div class="stats-panel">
    <div class="stat-item">
      <div class="label" data-i18n="masternodos.stats.ready">🟢 Nodos activos</div>
      <div class="value firo" id="statReady">—</div>
      <div class="sub" id="statReadyPct">—</div>
    </div>
    <div class="stat-item">
      <div class="label" data-i18n="masternodos.stats.total">📊 Total en red</div>
      <div class="value" id="statTotal">—</div>
      <div class="sub" id="statBanned">—</div>
    </div>
    <div class="stat-item">
      <div class="label" data-i18n="masternodos.stats.height">🔗 Altura actual</div>
      <div class="value" id="statHeight">—</div>
      <div class="sub" id="statUpdated">—</div>
    </div>
<div class="stat-item">
  <div class="label" data-i18n="masternodos.stats.payment">⏱️ Pago estimado</div>
  <div class="value green" id="statCycle">—</div>
</div>
</div>

  <div class="section-title next" data-i18n="masternodos.section.winners">⏳ Próximos ganadores</div>
  <div class="cards-grid" id="winnersContainer">
    <div class="error-msg" data-i18n="masternodos.loading">⏳ Cargando...</div>
  </div>

  <div class="section-title past" data-i18n="masternodos.section.recent">✓ Bloques recientes · masternodo ganador</div>
  <div class="cards-grid" id="blocksContainer">
    <div class="error-msg" data-i18n="masternodos.loading">⏳ Cargando...</div>
  </div>

  <footer class="footer">
    <a href="#" onclick="cargar(); return false;" id="refreshLink" data-i18n="common.btn.update">↻ Actualizar</a>
  </footer>
</div>

<div id="modal" class="modal-overlay" onclick="cerrarModal(event)">
  <div class="modal-content" onclick="event.stopPropagation()">
    <button class="modal-close" onclick="cerrarModal()">✕</button>
    <div class="modal-header">
      <img src="assets/firo.png" alt="FIRO" class="modal-logo" onerror="this.style.display='none'">
      <h2 id="modalTitle" data-i18n="nodo.card.masternode">Masternodo</h2>
    </div>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>
<script src="js/i18n.js"></script>
<script>
const API = "https://carover0.xyz/api/firo/masternode-live.php?limit=6";
const MI_NODO  = "45.67.217.147:8168";
const MI_PAYEE = "a7dkMS3D4gv6Vvcu31uCSRXQEgHTLgFjos";

const REWARD_FIRO     = 4.375;
const BLOCK_TIME_SEC  = 150;

const t = (key) => FiroI18n.t(key);

function formatDuration(days) {
  if (days < 1) {
    const hours = days * 24;
    return '~' + hours.toFixed(1) + ' h';
  }
  if (days < 365) {
    return '~' + days.toFixed(1) + ' días';
  }
  const years = days / 365;
  return '~' + years.toFixed(1) + ' años';
}

function calcCycle(enabled) {
  const seconds = enabled * BLOCK_TIME_SEC;
  const days    = seconds / 86400;
  return { days };
}

const COIN_HTML = '<img src="assets/firo.png" alt="FIRO" class="coin" onerror="this.style.display=\'none\'">';

function renderWinners(winners, cycle) {
  const cont = document.getElementById('winnersContainer');
  if (!winners || winners.length === 0) {
    cont.innerHTML = '<div class="error-msg">' + t('masternodos.no_data') + '</div>';
    return;
  }
  cont.innerHTML = '';
  winners.slice(0, 6).forEach(w => {
    const esMio = w.payee === MI_PAYEE;
    const card = document.createElement('div');
    card.className = 'block-card futuro' + (esMio ? ' mi-nodo' : '');
    card.style.cursor = 'pointer';
    card.onclick = () => abrirModal({
      titulo: t('masternodos.modal.next') + ' #' + w.height.toLocaleString(),
      filas: [
        { label: t('masternodos.modal.height'), valor: '#' + w.height.toLocaleString(), clase: 'firo' },
        { label: t('masternodos.modal.payee'),  valor: w.payee, clase: 'mono' },
        { label: t('masternodos.modal.reward'), valor: COIN_HTML + REWARD_FIRO + ' FIRO', clase: 'firo' },
        { label: t('masternodos.modal.cycle'),  valor: formatDuration(cycle.days), clase: 'mono' },
        { label: t('masternodos.modal.status'),
          valor: esMio ? t('masternodos.modal.my_node') : t('masternodos.modal.scheduled'),
          clase: esMio ? 'firo' : '' }
      ]
    });
    card.innerHTML = `
      <div class="block-top">
        <span class="block-height">#${w.height.toLocaleString()} ${esMio ? '❤️' : ''}</span>
        <span class="block-time">⏳ ${t('masternodos.next')}</span>
      </div>
      <div class="block-row">
        <span class="label">${t('masternodos.pay_to')}</span>
        <span class="value mono">${w.payee}</span>
      </div>
    `;
    cont.appendChild(card);
  });
}

function renderBlocks(blocks) {
  const cont = document.getElementById('blocksContainer');
  if (!blocks || blocks.length === 0) {
    cont.innerHTML = '<div class="error-msg">' + t('masternodos.no_data') + '</div>';
    return;
  }
  cont.innerHTML = '';
  blocks.forEach(b => {
    const mn = b.masternode;
    const esMio = mn && mn.service === MI_NODO;
    const card = document.createElement('div');
    card.className = 'block-card pasado' + (esMio ? ' mi-nodo' : '');
    card.style.cursor = 'pointer';
    card.onclick = () => abrirModal({
      titulo: t('masternodos.modal.block') + ' #' + b.height.toLocaleString(),
      filas: [
        { label: t('masternodos.modal.height'), valor: '#' + b.height.toLocaleString(), clase: 'firo' },
        { label: t('masternodos.modal.time'), valor: b.time },
        { label: t('masternodos.modal.masternode'), valor: mn ? mn.payee : '—', clase: 'mono firo' },
        { label: t('masternodos.modal.reward'), valor: mn ? (COIN_HTML + mn.monto) : '—', clase: 'firo' },
        { label: t('masternodos.modal.service'), valor: mn && mn.service ? mn.service : '—', clase: 'mono' },
        { label: t('masternodos.modal.protx'), valor: mn && mn.proTxHash ? mn.proTxHash : '—', clase: 'mono' },
        { label: t('masternodos.modal.txs'), valor: b.tx_count },
        { label: t('masternodos.modal.size'), valor: Math.round(b.size/1024) + ' KB' },
        { label: t('masternodos.modal.hash'), valor: b.hash, clase: 'mono' }
      ]
    });
    card.innerHTML = `
      <div class="block-top">
        <span class="block-height">#${b.height.toLocaleString()} ${esMio ? '❤️' : ''}</span>
        <span class="block-time">✓ ${b.time}</span>
      </div>
      <div class="block-row">
        <span class="label">${t('masternodos.masternode')}</span>
        <span class="value mono">${mn ? mn.payee : '—'}</span>
      </div>
      <div class="block-row">
        <span class="label">${t('masternodos.reward')}</span>
        <span class="value firo">${mn ? (COIN_HTML + mn.monto) : '—'}</span>
      </div>
      <div class="block-footer">
        <span class="block-hint">${mn && mn.service ? mn.service : '—'} · ${b.tx_count} TXs · ${Math.round(b.size/1024)} KB</span>
      </div>
    `;
    cont.appendChild(card);
  });
}

async function cargar() {
  const link = document.getElementById('refreshLink');
  if (link) link.textContent = t('common.btn.updating');

  try {
    const res = await fetch(API, { cache: 'no-store' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();

    let cycle = { days: 0 };

    if (data.stats) {
      document.getElementById('statReady').textContent = data.stats.ready.toLocaleString();
      const pct = data.stats.total > 0
        ? ((data.stats.ready / data.stats.total) * 100).toFixed(1)
        : '0';
      document.getElementById('statReadyPct').textContent = pct + '% ' + t('masternodos.of_network');
      document.getElementById('statTotal').textContent  = data.stats.total.toLocaleString();
      document.getElementById('statBanned').textContent = data.stats.banned.toLocaleString() + ' ' + t('masternodos.banned');
      document.getElementById('statHeight').textContent = '#' + data.stats.height.toLocaleString();
      document.getElementById('statUpdated').textContent = t('masternodos.updated') + ' ' + new Date().toLocaleTimeString();

      cycle = calcCycle(data.stats.ready);
      document.getElementById('statCycle').textContent = formatDuration(cycle.days);
    }

    renderWinners(data.winners, cycle);
    renderBlocks(data.recent);
  } catch (e) {
    console.warn('Error cargando datos:', e);
    const wc = document.getElementById('winnersContainer');
    const bc = document.getElementById('blocksContainer');
    if (!wc.querySelector('.block-card')) {
      wc.innerHTML = '<div class="error-msg">⚠️ ' + e.message + '</div>';
    }
    if (!bc.querySelector('.block-card')) {
      bc.innerHTML = '';
    }
  } finally {
    if (link) link.textContent = t('common.btn.update');
  }
}

function abrirModal(datos) {
  const modal = document.getElementById('modal');
  const body = document.getElementById('modalBody');
  const title = document.getElementById('modalTitle');

  title.textContent = datos.titulo || t('nodo.card.masternode');

  let html = '';
  datos.filas.forEach(f => {
    html += `
      <div class="fila">
        <span class="label">${f.label}</span>
        <span class="valor ${f.clase || ''}">${f.valor}</span>
      </div>
    `;
  });
  body.innerHTML = html;
  modal.classList.add('activo');
}

function cerrarModal(e) {
  if (e && e.target !== e.currentTarget && e.type === 'click') return;
  document.getElementById('modal').classList.remove('activo');
}

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') cerrarModal();
});

window.onLangChange = function () {
  cargar();
};

(async () => {
  await FiroI18n.init();
  cargar();
  setInterval(cargar, 10000);
})();
</script>
</body>
</html>
