<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>cΔrovΣr0 · Precios</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --violet: #4f46e5;
            --violet-soft: #818cf8;
            --violet-neon: #4338ca;
            --green: #31db72;
            --red: #ff756f;
            --gold: #ffb530;
            --line: rgba(160, 68, 255, .48);
            --panel: rgba(6, 2, 13, .91);
            --ui-scale: .9;
        }

        body {
            min-height: 100vh;
            background: #0a080c;
            background-image:
                radial-gradient(ellipse at 30% 40%, rgba(79, 70, 229, 0.08) 0%, transparent 60%),
                radial-gradient(ellipse at 70% 80%, rgba(79, 70, 229, 0.05) 0%, transparent 50%),
                linear-gradient(160deg, #0a080c 0%, #0d0b14 50%, #0a080c 100%);
            font-family: 'Lucida Console', 'Courier New', monospace;
            color: #ece8e0;
            padding: 0;
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .app {
            width: 100%;
            max-width: 1400px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            gap: 18px;
            padding: 20px 28px;
        }

        .header {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 12px 20px;
            padding: 16px 24px;
            background: rgba(255, 255, 255, 0.02);
            border-radius: 14px;
            border: 1px solid rgba(79, 70, 229, 0.2);
            backdrop-filter: blur(8px);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .brand .logo-text {
            color: var(--violet-soft);
            font-size: 23px;
            font-weight: 400;
            letter-spacing: 2px;
            text-shadow: 0 0 30px rgba(79, 70, 229, 0.15);
        }

        .brand .logo-text small {
            font-size: 13px;
            color: #6a6255;
            letter-spacing: 2px;
            font-weight: 300;
        }

        .nav-links {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 4px 18px;
            font-size: 13px;
            letter-spacing: 0.3px;
        }

        .nav-links a {
            color: #6a6255;
            text-decoration: none;
            transition: all 0.25s;
            padding: 4px 0;
            border-bottom: 2px solid transparent;
            cursor: pointer;
        }

        .nav-links a:hover {
            color: var(--violet-soft);
            border-bottom-color: var(--violet-soft);
        }

        .panel {
            background: rgba(255, 255, 255, 0.02);
            border-radius: 14px;
            border: 1px solid rgba(79, 70, 229, 0.06);
            padding: 24px 28px;
            backdrop-filter: blur(8px);
            transition: border-color 0.3s, max-width 0.4s ease;
            flex: 1;
            display: flex;
            flex-direction: column;
            max-width: 820px;
            margin: 0 auto;
            width: 100%;
        }

        .panel:hover {
            border-color: rgba(79, 70, 229, 0.12);
        }

        .panel.small {
            max-width: 520px;
        }

        .panel-title {
            color: var(--violet-soft);
            font-size: 18px;
            letter-spacing: 1px;
            margin-bottom: 18px;
            padding-bottom: 12px;
            border-bottom: 1px solid rgba(79, 70, 229, 0.06);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .panel-title .icon {
            font-size: 20px;
        }

        .panel-title .tools {
            margin-left: auto;
            display: flex;
            gap: 8px;
        }

        .panel-title .tools .btn-copy-text {
            background: rgba(79, 70, 229, 0.06);
            border: 1px solid rgba(79, 70, 229, 0.12);
            color: var(--violet-soft);
            font-family: 'Lucida Console', monospace;
            font-size: 11px;
            padding: 4px 14px;
            border-radius: 16px;
            cursor: pointer;
            transition: all 0.25s;
            display: none;
            align-items: center;
            gap: 6px;
        }

        .panel-title .tools .btn-copy-text:hover {
            background: rgba(79, 70, 229, 0.12);
            border-color: rgba(79, 70, 229, 0.25);
        }

        .panel-title .tools .btn-copy-text.show {
            display: inline-flex;
        }

        .panel-title .tools .btn-copy-text:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .search-section {
            display: flex;
            gap: 10px;
            align-items: center;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 12px;
            padding: 2px 2px 2px 18px;
            border: 1px solid rgba(79, 70, 229, 0.12);
            transition: all 0.3s ease;
            margin-bottom: 16px;
        }

        .search-section:focus-within {
            border-color: rgba(79, 70, 229, 0.4);
            box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.06);
            background: rgba(255, 255, 255, 0.04);
        }

        .search-section input {
            flex: 1;
            background: transparent;
            border: none;
            padding: 12px 6px 12px 2px;
            font-family: 'Lucida Console', 'Courier New', monospace;
            font-size: 14px;
            color: #f5ede4;
            outline: none;
            min-width: 0;
        }

        .search-section input::placeholder {
            color: #3d3830;
            letter-spacing: 0.3px;
        }

        .search-section .btn {
            background: rgba(79, 70, 229, 0.08);
            border: 1px solid rgba(79, 70, 229, 0.12);
            color: var(--violet-soft);
            font-family: 'Lucida Console', monospace;
            font-size: 12px;
            padding: 7px 18px;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.25s;
            white-space: nowrap;
        }

        .search-section .btn:hover {
            background: rgba(79, 70, 229, 0.15);
            border-color: rgba(79, 70, 229, 0.3);
        }

        .search-section .btn-inicio {
            background: transparent;
            border: 1px solid rgba(79, 70, 229, 0.06);
            color: #5a5348;
            font-family: 'Lucida Console', monospace;
            font-size: 12px;
            padding: 7px 14px;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.25s;
            text-decoration: none;
            white-space: nowrap;
        }

        .search-section .btn-inicio:hover {
            color: var(--violet-soft);
            border-color: rgba(79, 70, 229, 0.15);
        }

        /* ─── RESULT ─── */
        .result-box {
            min-height: 120px;
        }

        .result-box .empty {
            color: #4a443a;
            text-align: center;
            padding: 30px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        .result-box .empty .icon {
            font-size: 40px;
            opacity: 0.2;
        }

        .result-box .empty .hint {
            color: #3d3830;
            font-size: 12px;
        }

        .result-box .loading {
            text-align: center;
            padding: 30px 20px;
            color: #5a5348;
            font-size: 13px;
        }

        .result-box .loading::after {
            content: '...';
            animation: dots 1.5s steps(4) infinite;
        }

        @keyframes dots {
            0% { content: ''; }
            25% { content: '.'; }
            50% { content: '..'; }
            75% { content: '...'; }
        }

        .result-box .error {
            color: var(--red);
            padding: 12px 16px;
            border: 1px solid rgba(255, 117, 111, 0.15);
            background: rgba(255, 117, 111, 0.03);
            border-radius: 8px;
            font-size: 13px;
        }

        .result-box .error small {
            color: #5a5348;
            display: block;
            margin-top: 4px;
        }

        /* ─── PRICE CARD ─── */
        .price-card {
            padding: 4px 0 8px 0;
        }

        .coin-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 10px;
        }

        .coin-icon {
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.03);
            overflow: hidden;
            border: 1px solid rgba(79, 70, 229, 0.06);
        }

        .coin-icon img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            padding: 4px;
        }

        .coin-name {
            color: #f5ede4;
            font-size: 18px;
            font-weight: 600;
        }

        .coin-symbol {
            color: #5a5348;
            font-size: 14px;
            margin-left: 4px;
        }

        .main-price {
            font-size: 28px;
            color: #f5ede4;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .price-change {
            font-size: 14px;
            margin-top: 2px;
        }

        .price-change .source {
            color: #4a443a;
            font-size: 11px;
            margin-left: 8px;
        }

        .price-change.positive {
            color: var(--green);
        }

        .price-change.negative {
            color: var(--red);
        }

        .data-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2px 20px;
            font-size: 13px;
            line-height: 1.8;
            padding-top: 10px;
            border-top: 1px solid rgba(79, 70, 229, 0.04);
            margin-top: 10px;
        }

        .data-grid .label {
            color: #5a5348;
            font-size: 12px;
        }

        .data-grid .value {
            color: #f5ede4;
            text-align: right;
            font-size: 13px;
        }

        .data-grid .value.positive {
            color: var(--green);
        }

        .data-grid .value.negative {
            color: var(--red);
        }

        .data-grid .value.gold {
            color: var(--gold);
        }

        /* ─── BRUTUS CARD ─── */
        .brutus-card {
            margin-top: 14px;
            padding-top: 14px;
            border-top: 1px solid rgba(79, 70, 229, 0.04);
        }

        .brutus-content {
            background: rgba(79, 70, 229, 0.04);
            border: 1px solid rgba(79, 70, 229, 0.06);
            border-radius: 10px;
            padding: 14px 18px;
            text-align: center;
        }

        .brutus-text {
            color: #8a8275;
            font-size: 13px;
            line-height: 1.5;
        }

        .brutus-text .highlight {
            color: var(--violet-soft);
            font-weight: 600;
        }

        .brutus-link {
            display: inline-block;
            margin-top: 8px;
            color: var(--violet-soft);
            text-decoration: none;
            font-size: 13px;
            border: 1px solid rgba(79, 70, 229, 0.15);
            padding: 4px 18px;
            border-radius: 20px;
            transition: all 0.3s;
        }

        .brutus-link:hover {
            background: rgba(79, 70, 229, 0.06);
            border-color: rgba(79, 70, 229, 0.3);
        }

        /* ─── FOOTER ─── */
        .footer {
            padding-top: 14px;
            border-top: 1px solid rgba(79, 70, 229, 0.06);
            font-size: 11px;
            color: #4a443a;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            margin-top: 6px;
        }

        .footer a {
            color: #6a6255;
            text-decoration: none;
            transition: color 0.2s;
            cursor: pointer;
        }

        .footer a:hover {
            color: var(--violet-soft);
        }

        .footer .heart {
            color: var(--violet-soft);
        }

        .footer .update-time {
            color: #3d3830;
            font-size: 10px;
        }

        /* ─── TOAST ─── */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(80px);
            background: rgba(79, 70, 229, 0.08);
            backdrop-filter: blur(12px);
            color: #f5ede4;
            padding: 10px 32px;
            border-radius: 40px;
            border: 1px solid rgba(79, 70, 229, 0.12);
            font-family: 'Lucida Console', monospace;
            font-size: 12px;
            opacity: 0;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            pointer-events: none;
            z-index: 1000;
            letter-spacing: 0.3px;
            box-shadow: 0 8px 40px rgba(0, 0, 0, 0.3);
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        /* ─── RESPONSIVE ─── */
        @media (max-width: 768px) {
            .app {
                padding: 12px 14px;
                gap: 12px;
            }

            .header {
                flex-direction: column;
                align-items: stretch;
                gap: 10px;
                padding: 14px 18px;
            }

            .brand .logo-text {
                font-size: 19px;
            }

            .nav-links {
                font-size: 12px;
                gap: 2px 14px;
            }

            .panel {
                padding: 18px 16px;
            }

            .panel-title {
                font-size: 16px;
                flex-wrap: wrap;
            }

            .panel-title .tools {
                margin-left: 0;
                width: 100%;
            }

            .panel-title .tools .btn-copy-text {
                font-size: 10px;
                padding: 3px 12px;
            }

            .search-section {
                padding: 2px 2px 2px 14px;
                flex-wrap: wrap;
                gap: 6px;
            }

            .search-section input {
                font-size: 13px;
                padding: 10px 4px;
                flex: 1 1 100%;
            }

            .search-section .btn,
            .search-section .btn-inicio {
                font-size: 11px;
                padding: 5px 14px;
            }

            .data-grid {
                grid-template-columns: 1fr;
                gap: 0;
            }

            .data-grid .value {
                text-align: left;
            }

            .main-price {
                font-size: 22px;
            }

            .coin-name {
                font-size: 16px;
            }

            .coin-icon {
                width: 34px;
                height: 34px;
            }
        }

        @media (max-width: 480px) {
            .app {
                padding: 8px 10px;
                gap: 10px;
            }

            .header {
                padding: 10px 14px;
            }

            .brand .logo-text {
                font-size: 16px;
            }

            .brand .logo-text small {
                font-size: 11px;
            }

            .panel {
                padding: 14px 12px;
                border-radius: 10px;
            }

            .panel-title {
                font-size: 14px;
                margin-bottom: 14px;
                padding-bottom: 10px;
            }

            .panel-title .tools .btn-copy-text {
                font-size: 9px;
                padding: 2px 10px;
            }

            .search-section {
                padding: 2px 2px 2px 12px;
                flex-direction: column;
                gap: 4px;
            }

            .search-section input {
                font-size: 12px;
                padding: 8px 4px;
                flex: 1 1 auto;
                width: 100%;
            }

            .search-section .btn,
            .search-section .btn-inicio {
                font-size: 10px;
                padding: 4px 12px;
                width: 100%;
                text-align: center;
            }

            .main-price {
                font-size: 19px;
            }

            .coin-name {
                font-size: 14px;
            }

            .coin-symbol {
                font-size: 12px;
            }

            .coin-icon {
                width: 30px;
                height: 30px;
            }

            .result-box .empty .icon {
                font-size: 30px;
            }

            .data-grid {
                font-size: 12px;
            }

            .brutus-content {
                padding: 10px 12px;
            }

            .brutus-text {
                font-size: 12px;
            }

            .footer {
                font-size: 10px;
                flex-direction: column;
                text-align: center;
            }
        }

        @media (min-width: 1920px) {
            .app {
                max-width: 1600px;
                padding: 24px 40px;
            }

            .panel {
                max-width: 900px;
            }
        }
    </style>
</head>
<body>

    <div class="app">

        <header class="header">
            <div class="brand">
                <span class="logo-text">cΔrovΣr0 <small>precios</small></span>
            </div>
            <nav class="nav-links">
                <a href="https://carover0.github.io/pagina/">[INICIO]</a>
            </nav>
        </header>

        <div class="panel" id="pricePanel">
            <div class="panel-title">
                <span class="icon">⟡</span> CONSULTA DE PRECIOS
                <span class="tools">
                    <button class="btn-copy-text" id="copyTextBtn" onclick="copyPanelAsText()">📋 copiar texto</button>
                </span>
            </div>

            <div class="search-section">
                <input type="text" id="cryptoInput" placeholder="BTC · ETH · TRX · ADA · SOL" spellcheck="false">
                <button class="btn" id="searchBtn">BUSCAR</button>
                <a href="https://carover0.github.io/pagina/" class="btn-inicio">⌂ INICIO</a>
            </div>

            <div class="result-box" id="resultContainer">
                <div class="empty">
                    <span class="icon">⌨️</span>
                    <div>Ingresa un símbolo para consultar</div>
                    <div class="hint">Ej: BTC, ETH, TRX, ADA, SOL...</div>
                </div>
            </div>

            <footer class="footer">
                <span>cΔrovΣr0 · <span class="heart">♥</span></span>
                <span class="update-time" id="lastUpdate">—</span>
            </footer>
        </div>

    </div>

    <div class="toast" id="toast"></div>

    <script>
        // ─── CONFIG ──────────────────────────────────────────────────────
        const $ = id => document.getElementById(id);

        const cache = {};
        const CACHE_DURATION = 60000;
        const SMALL_TOKENS = ['BTT', 'XEC', 'PEPE', 'SHIB', 'FLOKI', 'BONK', 'DOGE'];
        const TRON_TOKENS = ['TRX', 'JST', 'WIN', 'SUN'];

        const COINGECKO_IDS = {
            'BTC': 'bitcoin',
            'ETH': 'ethereum',
            'TRX': 'tron',
            'ADA': 'cardano',
            'SOL': 'solana',
            'DOGE': 'dogecoin',
            'XRP': 'ripple',
            'DOT': 'polkadot',
            'LINK': 'chainlink',
            'MATIC': 'polygon',
            'UNI': 'uniswap',
            'ATOM': 'cosmos',
            'LTC': 'litecoin',
            'BCH': 'bitcoin-cash',
            'XLM': 'stellar',
            'VET': 'vechain',
            'FIL': 'filecoin',
            'ICP': 'internet-computer',
            'ETC': 'ethereum-classic',
            'XMR': 'monero',
            'ZEC': 'zcash',
            'EOS': 'eos',
            'AAVE': 'aave',
            'MKR': 'maker',
            'COMP': 'compound',
            'YFI': 'yearn-finance',
            'SNX': 'synthetix',
            'CRV': 'curve-dao-token',
            '1INCH': '1inch',
            'BTT': 'bittorrent',
            'JST': 'just',
            'WIN': 'wink',
            'SUN': 'sun',
            'SHIB': 'shiba-inu',
            'PEPE': 'pepe',
            'FLOKI': 'floki',
            'BONK': 'bonk',
            'XEC': 'ecash'
        };

        // ─── HELPERS ────────────────────────────────────────────────────
        function formatPrice(num, symbol) {
            if (num === undefined || num === null || isNaN(num)) return '—';
            const isSmall = SMALL_TOKENS.includes(symbol.toUpperCase());
            if (isSmall) return '$' + num.toFixed(10);
            if (num < 0.00001) return '$' + num.toFixed(12);
            if (num < 0.0001) return '$' + num.toFixed(10);
            if (num < 0.001) return '$' + num.toFixed(8);
            if (num < 0.01) return '$' + num.toFixed(7);
            if (num < 0.1) return '$' + num.toFixed(6);
            if (num < 1) return '$' + num.toFixed(5);
            if (num < 10) return '$' + num.toFixed(4);
            if (num < 1000) return '$' + num.toFixed(2);
            return '$' + num.toFixed(2);
        }

        function formatNumber(num) {
            if (num === undefined || num === null || isNaN(num)) return '—';
            if (num >= 1e12) return '$' + (num / 1e12).toFixed(2) + 'T';
            if (num >= 1e9) return '$' + (num / 1e9).toFixed(2) + 'B';
            if (num >= 1e6) return '$' + (num / 1e6).toFixed(2) + 'M';
            if (num >= 1e3) return '$' + (num / 1e3).toFixed(2) + 'K';
            return '$' + num.toFixed(2);
        }

        function getCryptoIcon(symbol) {
            return `https://raw.githubusercontent.com/spothq/cryptocurrency-icons/master/128/color/${symbol.toLowerCase()}.png`;
        }

        function isTronToken(symbol) {
            return TRON_TOKENS.includes(symbol.toUpperCase());
        }

        function showToast(msg) {
            const el = document.getElementById('toast');
            el.textContent = msg;
            el.classList.add('show');
            clearTimeout(el._timer);
            el._timer = setTimeout(() => el.classList.remove('show'), 2500);
        }

        // ─── COPIAR TEXTO ──────────────────────────────────────────────
        function copyPanelAsText() {
            const btn = document.getElementById('copyTextBtn');
            const originalText = btn.textContent;

            const resultContainer = document.getElementById('resultContainer');
            const priceCard = resultContainer.querySelector('.price-card');

            if (!priceCard) {
                showToast('❌ No hay datos para copiar');
                return;
            }

            const coinNameEl = priceCard.querySelector('.coin-name');
            const coinSymbolEl = priceCard.querySelector('.coin-symbol');
            const mainPriceEl = priceCard.querySelector('.main-price');
            const priceChangeEl = priceCard.querySelector('.price-change');
            const labels = priceCard.querySelectorAll('.data-grid .label');
            const values = priceCard.querySelectorAll('.data-grid .value');

            const coinName = coinNameEl ? coinNameEl.textContent : '—';
            const coinSymbol = coinSymbolEl ? coinSymbolEl.textContent : '—';
            const price = mainPriceEl ? mainPriceEl.textContent : '—';
            const change = priceChangeEl ? priceChangeEl.textContent.trim() : '—';

            let text = '═══════════════════════════════════════\n';
            text += `  ${coinName} (${coinSymbol})\n`;
            text += `  ${price}\n`;
            text += `  ${change}\n`;
            text += '─────────────────────────────────────────\n';

            let dataLines = [];
            labels.forEach((label, i) => {
                if (values[i]) {
                    dataLines.push(`${label.textContent}: ${values[i].textContent}`);
                }
            });

            if (dataLines.length > 0) {
                text += dataLines.join('\n') + '\n';
            }

            const updateTime = document.getElementById('lastUpdate');
            if (updateTime && updateTime.textContent !== '—') {
                text += '─────────────────────────────────────────\n';
                text += `  ${updateTime.textContent}\n`;
            }

            text += '═══════════════════════════════════════\n';
            text += '  cΔrovΣr0 · ♥\n';
            text += '  https://carover0.github.io/pagina/\n';
            text += '═══════════════════════════════════════';

            btn.textContent = '⏳ copiando...';
            btn.disabled = true;

            navigator.clipboard.writeText(text).then(() => {
                btn.textContent = '✅ copiado!';
                showToast('✓ Datos copiados al portapapeles');
                setTimeout(() => {
                    btn.textContent = originalText;
                    btn.disabled = false;
                }, 1500);
            }).catch(() => {
                try {
                    const ta = document.createElement('textarea');
                    ta.value = text;
                    document.body.appendChild(ta);
                    ta.select();
                    document.execCommand('copy');
                    document.body.removeChild(ta);
                    btn.textContent = '✅ copiado!';
                    showToast('✓ Datos copiados al portapapeles');
                    setTimeout(() => {
                        btn.textContent = originalText;
                        btn.disabled = false;
                    }, 1500);
                } catch (e) {
                    btn.textContent = '❌ error';
                    showToast('❌ Error al copiar');
                    setTimeout(() => {
                        btn.textContent = originalText;
                        btn.disabled = false;
                    }, 1500);
                }
            });
        }

        // ─── API ────────────────────────────────────────────────────────
        async function getCoinGeckoData(symbol) {
            try {
                const upperSymbol = symbol.toUpperCase();
                let coinId = COINGECKO_IDS[upperSymbol];

                if (!coinId) {
                    const searchUrl = `https://api.coingecko.com/api/v3/search?query=${upperSymbol}`;
                    const searchResp = await fetch(searchUrl);
                    if (!searchResp.ok) throw new Error(`Search error: ${searchResp.status}`);
                    const searchData = await searchResp.json();
                    const coins = searchData.coins || [];
                    for (const coin of coins) {
                        if (coin.symbol.toUpperCase() === upperSymbol) {
                            coinId = coin.id;
                            break;
                        }
                    }
                    if (!coinId && coins.length > 0) coinId = coins[0].id;
                }

                if (!coinId) return null;

                const detailUrl =
                    `https://api.coingecko.com/api/v3/coins/${coinId}?localization=false&tickers=false&market_data=true&community_data=false&developer_data=false&sparkline=false`;
                const detailResp = await fetch(detailUrl);
                if (!detailResp.ok) throw new Error(`Detail error: ${detailResp.status}`);
                const detail = await detailResp.json();

                return {
                    nombre: detail.name || symbol,
                    ticker: detail.symbol?.toUpperCase() || symbol,
                    precio: detail.market_data?.current_price?.usd || 0,
                    market_cap: detail.market_data?.market_cap?.usd || 0,
                    cambio_24h: detail.market_data?.price_change_percentage_24h || 0,
                    volumen_24h: detail.market_data?.total_volume?.usd || 0,
                    ranking: detail.market_cap_rank || 'N/A',
                    icono: detail.image?.large || getCryptoIcon(symbol),
                    high_24h: detail.market_data?.high_24h?.usd || 0,
                    low_24h: detail.market_data?.low_24h?.usd || 0,
                    ath: detail.market_data?.ath?.usd || 0,
                    atl: detail.market_data?.atl?.usd || 0,
                    price_change_24h: detail.market_data?.price_change_24h || 0,
                };
            } catch (e) {
                console.error('CoinGecko error:', e);
                return null;
            }
        }

        // ─── QUERY ──────────────────────────────────────────────────────
        async function queryPrice(symbol) {
            const upperSymbol = symbol.toUpperCase().trim();
            if (!upperSymbol) {
                renderEmpty();
                return;
            }

            const cacheKey = upperSymbol;
            const now = Date.now();
            if (cache[cacheKey] && (now - cache[cacheKey].timestamp) < CACHE_DURATION) {
                renderResult(cache[cacheKey].data);
                return;
            }

            const container = $('resultContainer');
            container.innerHTML = '<div class="loading">Consultando precios</div>';

            try {
                const coinData = await getCoinGeckoData(upperSymbol);

                const result = {
                    symbol: upperSymbol,
                    coinData,
                    timestamp: Date.now()
                };

                cache[cacheKey] = { data: result, timestamp: now };
                renderResult(result);
                updateLastUpdate();

            } catch (e) {
                console.error('Error general:', e);
                container.innerHTML = `
                    <div class="error">
                        ❌ Error al consultar: ${e.message || 'Intenta nuevamente'}
                        <small>Verifica tu conexión a internet</small>
                    </div>
                `;
            }
        }

        // ─── RENDER ─────────────────────────────────────────────────────
        function renderEmpty() {
            const container = $('resultContainer');
            container.innerHTML = `
                <div class="empty">
                    <span class="icon">⌨️</span>
                    <div>Ingresa un símbolo para consultar</div>
                    <div class="hint">Ej: BTC, ETH, TRX, ADA, SOL...</div>
                </div>
            `;
            $('lastUpdate').textContent = '—';
            document.getElementById('copyTextBtn').classList.remove('show');
            document.getElementById('pricePanel').classList.add('small');
        }

        function renderResult(result) {
            const container = $('resultContainer');
            const { symbol, coinData } = result;

            let html = '';

            if (!coinData) {
                html = `
                    <div class="error">
                        ⚠️ No se encontraron datos para "${symbol}"
                        <small>Verifica el símbolo o intenta con otro</small>
                    </div>
                `;
                container.innerHTML = html;
                document.getElementById('copyTextBtn').classList.remove('show');
                document.getElementById('pricePanel').classList.add('small');
                return;
            }

            const cambio = coinData.cambio_24h || 0;
            const cambioClass = cambio >= 0 ? 'positive' : 'negative';
            const cambioEmoji = cambio >= 0 ? '📈' : '📉';

            html += `<div class="price-card">`;

            html += `
                <div class="coin-header">
                    <div class="coin-icon">
                        <img src="${coinData.icono || getCryptoIcon(symbol)}" alt="${symbol}" 
                             onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%2240%22 height=%2240%22 viewBox=%220 0 40 40%22%3E%3Ctext x=%2220%22 y=%2226%22 text-anchor=%22middle%22 fill=%22%23818cf8%22 font-size=%2218%22 font-family=%22monospace%22%3E${symbol.slice(0,4)}%3C/text%3E%3C/svg%3E'">
                    </div>
                    <div>
                        <span class="coin-name">${coinData.nombre}</span>
                        <span class="coin-symbol">${coinData.ticker}</span>
                    </div>
                </div>
            `;

            if (coinData.precio > 0) {
                html += `
                    <div style="margin-bottom:8px;">
                        <div class="main-price">${formatPrice(coinData.precio, symbol)}</div>
                        <div class="price-change ${cambioClass}">
                            ${cambioEmoji} ${cambio >= 0 ? '+' : ''}${cambio.toFixed(2)}% (24h)
                            <span class="source">CoinGecko</span>
                        </div>
                    </div>
                `;
            }

            html += `
                <div class="data-grid">
                    <span class="label">Market Cap</span>
                    <span class="value">${formatNumber(coinData.market_cap)}</span>

                    <span class="label">Volumen 24h</span>
                    <span class="value">${formatNumber(coinData.volumen_24h)}</span>

                    <span class="label">Cambio 24h</span>
                    <span class="value ${cambioClass}">${cambio >= 0 ? '+' : ''}${cambio.toFixed(2)}% ${cambioEmoji}</span>

                    <span class="label">Ranking</span>
                    <span class="value gold">#${coinData.ranking}</span>

                    ${coinData.high_24h ? `<span class="label">Máx 24h</span><span class="value">${formatPrice(coinData.high_24h, symbol)}</span>` : ''}
                    ${coinData.low_24h ? `<span class="label">Mín 24h</span><span class="value">${formatPrice(coinData.low_24h, symbol)}</span>` : ''}

                    ${coinData.ath ? `<span class="label">ATH</span><span class="value gold">${formatPrice(coinData.ath, symbol)}</span>` : ''}
                    ${coinData.atl ? `<span class="label">ATL</span><span class="value">${formatPrice(coinData.atl, symbol)}</span>` : ''}
                </div>
            `;

            // Tron card 
            if (isTronToken(symbol)) {
                html += `
                    <div class="brutus-card">
                        <div class="brutus-content">
                            <div style="font-size:48px;margin-bottom:4px;">🚀</div>
                            <div class="brutus-text">
                                ¿Necesitas recursos Tron?<br>
                                <span class="highlight">Energía</span> y <span class="highlight">Banda ancha</span> disponibles
                            </div>
                            <a href="https://brutus.finance" target="_blank" class="brutus-link">
                                🔗 Ir a Brutus Finance
                            </a>
                        </div>
                    </div>
                `;
            }

            html += `</div>`;
            container.innerHTML = html;

            document.getElementById('copyTextBtn').classList.add('show');

            if (isTronToken(symbol)) {
                document.getElementById('pricePanel').classList.remove('small');
            } else {
                document.getElementById('pricePanel').classList.add('small');
            }
        }

        function updateLastUpdate() {
            const now = new Date();
            const el = $('lastUpdate');
            if (el) {
                el.textContent = `Última actualización: ${now.toLocaleString('es-AR', { hour12: false })}`;
            }
        }

        // ─── EVENTOS ─────────────────────────────────────────────────────
        $('searchBtn').addEventListener('click', () => {
            const input = $('cryptoInput');
            if (input.value.trim()) {
                queryPrice(input.value);
            } else {
                renderEmpty();
            }
        });

        $('cryptoInput').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                $('searchBtn').click();
            }
        });

        setInterval(() => {
            const input = $('cryptoInput');
            if (input.value.trim()) {
                queryPrice(input.value);
            }
        }, 60000);

        // ─── EXPONER FUNCIONES ──────────────────────────────────────────
        window.queryPrice = queryPrice;
        window.copyPanelAsText = copyPanelAsText;
    </script>

</body>
</html>
