<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 · cΔrovΣr0</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            min-height: 100vh;
            background: #0a080c;
            background-image:
                radial-gradient(ellipse at 30% 40%, rgba(79, 70, 229, 0.10) 0%, transparent 60%),
                radial-gradient(ellipse at 70% 80%, rgba(79, 70, 229, 0.06) 0%, transparent 50%),
                linear-gradient(160deg, #0a080c 0%, #0d0b14 50%, #0a080c 100%);
            font-family: 'Lucida Console', 'Courier New', monospace;
            color: #ece8e0;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow: hidden;
        }

        .container {
            max-width: 700px;
            width: 100%;
            text-align: center;
            padding: 40px 28px;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(79, 70, 229, 0.15);
            border-radius: 18px;
            backdrop-filter: blur(8px);
            position: relative;
            animation: fadeIn 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes fadeIn {
            0% { transform: translateY(20px); opacity: 0; }
            100% { transform: translateY(0); opacity: 1; }
        }

        .glitch {
            font-size: 120px;
            font-weight: 700;
            color: #818cf8;
            letter-spacing: 8px;
            line-height: 1;
            margin-bottom: 8px;
            text-shadow:
                0 0 40px rgba(79, 70, 229, 0.5),
                0 0 80px rgba(79, 70, 229, 0.3);
            position: relative;
            display: inline-block;
            animation: glitch 3s infinite;
        }

        @keyframes glitch {
            0%, 90%, 100% { transform: translate(0); }
            92% { transform: translate(-3px, 2px); }
            94% { transform: translate(3px, -2px); }
            96% { transform: translate(-2px, -2px); }
            98% { transform: translate(2px, 2px); }
        }

        .subtitle {
            color: #6a6255;
            font-size: 12px;
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-bottom: 30px;
        }

        .message {
            color: #d2c8b7;
            font-size: 15px;
            line-height: 1.7;
            margin-bottom: 14px;
            max-width: 500px;
            margin-left: auto;
            margin-right: auto;
        }

        .message .highlight {
            color: #818cf8;
        }

        .emoji-row {
            font-size: 28px;
            letter-spacing: 12px;
            margin: 24px 0 30px 0;
            opacity: 0.85;
        }

        .btn-home {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: rgba(79, 70, 229, 0.12);
            color: #818cf8;
            border: 1px solid rgba(79, 70, 229, 0.3);
            padding: 14px 32px;
            border-radius: 30px;
            font-family: 'Lucida Console', monospace;
            font-size: 14px;
            text-decoration: none;
            letter-spacing: 1px;
            transition: all 0.3s ease;
            cursor: pointer;
            margin-bottom: 20px;
        }

        .btn-home:hover {
            background: rgba(79, 70, 229, 0.25);
            border-color: #818cf8;
            transform: translateY(-2px);
            box-shadow: 0 8px 40px rgba(79, 70, 229, 0.3);
        }

        .btn-home .arrow {
            transition: transform 0.3s ease;
        }

        .btn-home:hover .arrow {
            transform: translateX(4px);
        }

        .counter {
            font-size: 11px;
            color: #3d3830;
            margin-top: 30px;
            letter-spacing: 1px;
        }

        .counter .val {
            color: #818cf8;
        }

        .stars {
            position: fixed;
            inset: 0;
            pointer-events: none;
            overflow: hidden;
            z-index: -1;
        }

        .star {
            position: absolute;
            width: 2px;
            height: 2px;
            background: #818cf8;
            border-radius: 50%;
            box-shadow: 0 0 6px rgba(129, 140, 248, 0.6);
            animation: twinkle 3s infinite ease-in-out;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.2; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.5); }
        }

        @media (max-width: 600px) {
            .glitch { font-size: 80px; letter-spacing: 4px; }
            .subtitle { font-size: 10px; letter-spacing: 2px; }
            .message { font-size: 13px; }
            .emoji-row { font-size: 22px; letter-spacing: 8px; }
            .btn-home { font-size: 12px; padding: 12px 24px; }
            .container { padding: 30px 18px; }
        }

        @media (max-width: 400px) {
            .glitch { font-size: 60px; }
        }
    </style>

    <script>
        (function () {
            const path = window.location.pathname;

            const explorers = [
                { name: 'zec-explorer',    pattern: /\/zec-explorer\/(.+)$/ },
                { name: 'pivx-explorer',   pattern: /\/pivx-explorer\/(.+)$/ },
                { name: 'ycash-explorer',  pattern: /\/ycash-explorer\/(.+)$/ },
                { name: 'komodo-explorer', pattern: /\/komodo-explorer\/(.+)$/ },
                { name: 'firo-explorer',   pattern: /\/firo-explorer\/(.+)$/ },
                { name: 'bch-explorer',    pattern: /\/bch-explorer\/(.+)$/ }
            ];

            for (const exp of explorers) {
                const match = path.match(exp.pattern);
                if (match && match[1]) {
                    window.location.replace('/pagina/' + exp.name + '?q=' + encodeURIComponent(match[1]));
                    return;
                }
            }
        })();
    </script>
</head>
<body>

    <div class="stars" id="stars"></div>

    <div class="container">
        <div class="glitch">404</div>
        <div class="subtitle">PÁGINA NO ENCONTRADA</div>

        <div class="emoji-row">🛸 💫 🧭</div>

        <p class="message">
            Parece que te perdiste en el <span class="highlight">hiperespacio</span>.
        </p>

        <p class="message" style="font-size: 13px; color: #6a6255;">
            La página que buscás no existe, o alguien movió el archivo sin avisarnos.
        </p>

        <a href="https://carover0.github.io/pagina/" class="btn-home">
            <span>← Volver al inicio</span>
            <span class="arrow">→</span>
        </a>

        <div class="counter">
            Error reportado a la <span class="val">central</span> · cΔrovΣr0
        </div>
    </div>

    <script>
        (function generateStars() {
            const container = document.getElementById('stars');
            const numStars = 40;

            for (let i = 0; i < numStars; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                star.style.left = Math.random() * 100 + '%';
                star.style.top = Math.random() * 100 + '%';
                star.style.animationDelay = (Math.random() * 3) + 's';
                star.style.animationDuration = (2 + Math.random() * 3) + 's';
                container.appendChild(star);
            }
        })();
    </script>

</body>
</html>
