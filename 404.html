<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 · cΔrovΣr0</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    background: #0a080c;
    color: #ece8e0;
    font-family: 'Lucida Console', 'Courier New', monospace;
  }

  .card {
    width: 100%;
    max-width: 420px;
    text-align: center;
  }

  .code {
    font-size: 64px;
    font-weight: 700;
    color: #818cf8;
    line-height: 1;
    margin-bottom: 12px;
  }

  .subtitle {
    font-size: 12px;
    color: #6a6255;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    margin-bottom: 24px;
  }

  .message {
    font-size: 13px;
    line-height: 1.7;
    color: #b0a897;
    margin-bottom: 28px;
  }

  .btn {
    display: inline-block;
    padding: 10px 20px;
    border-radius: 6px;
    font-family: inherit;
    font-size: 12px;
    text-decoration: none;
    color: #c4b5fd;
    background: rgba(79, 70, 229, 0.12);
    border: 1px solid rgba(79, 70, 229, 0.25);
    transition: background 0.2s, border-color 0.2s, color 0.2s;
  }

  .btn:hover {
    background: rgba(79, 70, 229, 0.22);
    border-color: #818cf8;
    color: #fff;
  }

  .footer {
    margin-top: 28px;
    font-size: 10px;
    color: #4a443a;
    letter-spacing: 0.5px;
  }

  .footer .heart { color: #818cf8; }
</style>

<script>
(function () {
  var path = window.location.pathname;
  var explorers = [
    { name: 'zec-explorer',   pattern: /\/zec-explorer\/(.+)$/ },
    { name: 'pivx-explorer',  pattern: /\/pivx-explorer\/(.+)$/ },
    { name: 'ycash-explorer', pattern: /\/ycash-explorer\/(.+)$/ },
    { name: 'cementerio',     pattern: /\/cementerio\/(.+)$/ },
    { name: 'firo-explorer',  pattern: /\/firo-explorer\/(.+)$/ },
    { name: 'texplorer',      pattern: /\/texplorer\/(.+)$/ }
  ];

  for (var i = 0; i < explorers.length; i++) {
    var exp = explorers[i];
    var match = path.match(exp.pattern);
    if (match && match[1]) {
      var decoded = match[1];
      try { decoded = decodeURIComponent(decoded); } catch (e) {}

      var target;
      if (exp.name === 'texplorer') {
        // texplorer: hash routing (no depende del servidor)
        var clean = decoded.replace(/\s+/g, '/');
        target = '/pagina/texplorer/#/' + clean;
      } else {
        // demás exploradores: query string como siempre
        target = '/pagina/' + exp.name + '/?q=' + encodeURIComponent(decoded);
      }
      window.location.replace(target);
      return;
    }
  }
})();
</script>
</head>
<body>

  <div class="card">
    <div class="code">404</div>
    <div class="subtitle">página no encontrada</div>

    <p class="message">
      La página que buscás no existe o fue movida.
    </p>

    <a href="https://carover0.github.io/pagina/" class="btn">← Volver al inicio</a>

    <div class="footer">
      cΔrovΣr0 · <span class="heart">♥</span> desde Argentina
    </div>
  </div>

</body>
</html>
