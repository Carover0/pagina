<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PIVX · Explorador</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: #0a080c;
            background-image:
                radial-gradient(ellipse at 30% 40%, rgba(160, 68, 255, 0.08) 0%, transparent 60%),
                radial-gradient(ellipse at 70% 80%, rgba(160, 68, 255, 0.05) 0%, transparent 50%),
                linear-gradient(160deg, #0a080c 0%, #161114 50%, #0d0b10 100%);
            font-family: 'Lucida Console', 'Courier New', monospace;
            color: #ece8e0;
            padding: 0;
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .app {
            width: 100%;
            max-width: 1400px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            gap: 18px;
            padding: 20px 28px;
        }

        .header {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 12px 20px;
            padding: 16px 24px;
            background: rgba(255, 255, 255, 0.02);
            border-radius: 14px;
            border: 1px solid rgba(160, 68, 255, 0.2);
            backdrop-filter: blur(8px);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .brand img {
            width: 38px;
            height: 38px;
            filter: drop-shadow(0 0 16px rgba(160, 68, 255, 0.3));
            transition: filter 0.3s;
        }

        .brand img:hover {
            filter: drop-shadow(0 0 24px rgba(160, 68, 255, 0.5));
        }

        .brand h1 {
            font-size: 21px;
            font-weight: 400;
            letter-spacing: 1.5px;
            color: #f5e6c8;
            text-shadow: 0 0 30px rgba(160, 68, 255, 0.15);
        }

        .brand h1 small {
            font-size: 12px;
            color: #6a6255;
            letter-spacing: 2px;
            font-weight: 300;
        }

        .nav-links {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 4px 18px;
            font-size: 12px;
            letter-spacing: 0.3px;
        }

        .nav-links a {

        }

        .search-section input::placeholder {

        .search-section .shortcuts {

        .search-section .shortcuts kbd {

<body>

    <div class="app">

        <header class="header">
            <div class="brand">
                <img src="assets/pivx.png" alt="PIVX">
                <h1>PIVX <small>explorador</small></h1>
            </div>
            <nav class="nav-links">
                <span class="back-btn" id="backBtn" onclick="goBack()">← volver</span>
                <a href="https://carover0.github.io/pagina/pivx-nodo.html">[NODO]</a>
                <a href="https://carover0.github.io/pagina/pivx-consola.html">[CONSOLA]</a>
                <a href="https://carover0.github.io/pagina/">[INICIO]</a>
            </nav>
        </header>

        <div class="stats-bar">
            <div class="stat"><span class="label">ALTURA</span><span class="value" id="stat-height">—</span></div>
            <div class="stat"><span class="label">CONEXIONES</span><span class="value" id="stat-connections">—</span></div>
            <div class="stat"><span class="label">MEMPOOL</span><span class="value" id="stat-mempool">0</span><span style="color:#3d3830;font-size:11px;">tx</span></div>
        </div>

        <div class="breadcrumb" id="breadcrumb"></div>

        <div class="search-section">
            <span class="prompt">►</span>
            <input type="text" id="searchInput" placeholder="bloque · hash · txid · dirección" autofocus spellcheck="false">
            <div class="shortcuts">
                <kbd>F8</kbd> copiar
                <kbd>F9</kbd> limpiar
            </div>
        </div>

        <div class="output-wrapper">
            <div id="output">
                <div class="placeholder">
                    <div class="icon">⧫</div>
                    <div>explorador de bloques PIVX</div>
                    <div class="sub">bloque · transacción · dirección</div>
                </div>
            </div>
        </div>

        <footer class="footer-bar">
            <span>API · <a href="https://carover0.xyz/api/pivx/pivx.php?token=pivx2026" target="_blank" rel="noopener" class="api">https://carover0.xyz/api/pivx/pivx.php?token=pivx2026</a></span>
            <span style="font-size:10px;color:#2d2820;">PIVX mainnet</span>
        </footer>

    </div>

    <div class="toast" id="toast"></div>

    <script>
        const API_URL = "https://carover0.xyz/api/pivx/pivx.php";
        const TOKEN = "pivx2026";
        const STATUS_URL = "https://carover0.xyz/cacaX/pivx_status_X.json";

        let historyStack = [];
        let currentIndex = -1;

        function pushHistory(query, label) {
            historyStack = historyStack.slice(0, currentIndex + 1);
            historyStack.push({ query: query, label: label || query });
            currentIndex = historyStack.length - 1;
            updateBackButton();
            updateBreadcrumb();
        }

        function goBack() {
            if (currentIndex > 0) {
                currentIndex--;
                const entry = historyStack[currentIndex];
                const input = document.getElementById('searchInput');
                if (input) {
                    input.value = entry.query;
                    executeSearch(entry.query);
                }
                updateBackButton();
                updateBreadcrumb();
            }
        }

        function updateBackButton() {
            const btn = document.getElementById('backBtn');
            if (currentIndex > 0) {
                btn.classList.add('show');
            } else {
                btn.classList.remove('show');
            }
        }

        function updateBreadcrumb() {
            const container = document.getElementById('breadcrumb');
            if (historyStack.length === 0) {
                container.innerHTML = '';
                return;
            }

            let html = '';
            const maxDisplay = 4;
            const start = Math.max(0, historyStack.length - maxDisplay);
            const entries = historyStack.slice(start);

            if (start > 0) {
                html += `<span class="crumb" onclick="goToHistory(0)">⏪</span><span class="sep">·</span>`;
            }

            for (let i = 0; i < entries.length; i++) {
                const idx = start + i;
                const entry = entries[i];
                const isCurrent = idx === currentIndex;
                const label = entry.label.length > 30 ? entry.label.substring(0, 28) + '…' : entry.label;
                if (isCurrent) {
                    html += `<span class="crumb current">${escapeHtml(label)}</span>`;
                } else {
                    html += `<span class="crumb" onclick="goToHistory(${idx})">${escapeHtml(label)}</span>`;
                }
                if (i < entries.length - 1) {
                    html += `<span class="sep">›</span>`;
                }
            }

            container.innerHTML = html;
        }

        function goToHistory(index) {
            if (index >= 0 && index < historyStack.length && index !== currentIndex) {
                currentIndex = index;
                const entry = historyStack[index];
                const input = document.getElementById('searchInput');
                if (input) {
                    input.value = entry.query;
                    executeSearch(entry.query);
                }
                updateBackButton();
                updateBreadcrumb();
            }
        }

        function escapeHtml(text) {
            if (!text) return '';
            return String(text).replace(/[&<>]/g, function(m) {
                if (m === '&') return '&amp;';
                if (m === '<') return '&lt;';
                if (m === '>') return '&gt;';
                return m;
            });
        }

        function makeLink(text) {
            if (!text) return '';
            const encoded = encodeURIComponent(text);
            return `<span class="link" onclick="navigateTo('${encoded}')">${escapeHtml(text)}</span>`;
        }

        function navigateTo(query) {
            const decoded = decodeURIComponent(query);
            const input = document.getElementById('searchInput');
            if (input) {
                input.value = decoded;
                const label = getLabelForQuery(decoded);
                pushHistory(decoded, label);
                executeSearch(decoded);
            }
        }

        function showToast(msg) {
            const el = document.getElementById('toast');
            el.textContent = msg;
            el.classList.add('show');
            clearTimeout(el._timer);
            el._timer = setTimeout(() => el.classList.remove('show'), 1800);
        }

        function getLabelForQuery(q) {
            const s = q.trim();
            if (s.startsWith('getblock ')) return 'Bloque ' + s.replace('getblock ', '');
            if (s.startsWith('getrawtransaction ')) {
                const txid = s.replace('getrawtransaction ', '').replace(' 1', '');
                return 'TX ' + txid.substring(0, 16) + '…';
            }
            if (s.startsWith('validateaddress ')) {
                const addr = s.split(' ')[1];
                return 'Dirección ' + (addr ? addr.substring(0, 12) + '…' : '');
            }
            if (/^\d+$/.test(s)) return 'Bloque ' + s;
            if (/^[a-fA-F0-9]{64}$/.test(s)) return 'TX ' + s.substring(0, 16) + '…';
            return s.substring(0, 20) + (s.length > 20 ? '…' : '');
        }

        function detectSearchFromUrl() {
            const urlParams = new URLSearchParams(window.location.search);
            const queryParam = urlParams.get('q');
            if (queryParam) return queryParam;
            const path = window.location.pathname;
            const match = path.match(/\/pivx-explorer\/(.+)$/);
            if (match && match[1]) return match[1];
            return null;
        }

        function updateUrlWithSearch(parametro) {
            const basePath = window.location.origin + '/pagina';
            const newUrl = basePath + '/pivx-explorer/' + encodeURIComponent(parametro);
            window.history.replaceState({}, '', newUrl);
        }

        // ─── DETECTAR TIPO ──────────────────────────
        function getTxType(tx) {
            if (!tx) return 'unknown';

            const hasShieldedSpend = tx.vShieldSpend && tx.vShieldSpend.length > 0;
            const hasShieldedOutput = tx.vShieldOutput && tx.vShieldOutput.length > 0;
            const hasTransparentIn = tx.vin && tx.vin.length > 0;
            const hasTransparentOut = tx.vout && tx.vout.length > 0;
            const hasCoinbase = tx.vin && tx.vin.length > 0 && tx.vin[0].coinbase !== undefined;
            const hasVoutZero = tx.vout && tx.vout.length > 0 && tx.vout[0].value === 0;
            const isOnlyZeroOutput = tx.vout && tx.vout.length === 1 && tx.vout[0].value === 0;
            const isCoinStake = !hasCoinbase && hasTransparentIn && hasVoutZero && tx.vout && tx.vout.length >= 2;

            // Transacción privada 
            if (hasShieldedSpend || hasShieldedOutput) {
                if (hasTransparentIn && !hasTransparentOut && hasShieldedOutput && !hasShieldedSpend) {
                    return 'shielding'; // transparente → privada
                }
                if (hasShieldedSpend && !hasShieldedOutput && hasTransparentOut && !hasTransparentIn) {
                    return 'deshielding'; // privada → transparente
                }
                return 'private'; // completamente privada
            }

            // Coinbase / Coinstake
            if (hasCoinbase) {
                if (isOnlyZeroOutput) return 'coinstake_dummy';
                return 'coinbase';
            }
            if (isCoinStake) return 'coinstake';

            // Transparente normal
            if (hasTransparentIn || hasTransparentOut) {
                return 'transparent';
            }

            return 'unknown';
        }

        function getTxTypeLabel(type) {
            switch (type) {
                case 'private':
                    return { label: 'PRIVADA', icon: '🛡', cssClass: 'private' };
                case 'shielding':
                    return { label: 'SHIELDING', icon: '🛡', cssClass: 'shielding' };
                case 'deshielding':
                    return { label: 'DESHIELDING', icon: '🛡', cssClass: 'shielding' };
                case 'transparent':
                    return { label: 'TRANSPARENTE', icon: '📄', cssClass: 'transparent' };
                case 'coinstake':
                    return { label: 'COINSTAKE', icon: '⚡', cssClass: 'transparent' };
                case 'coinstake_dummy':
                    return { label: 'COINSTAKE (dummy)', icon: '⚡', cssClass: 'transparent' };
                case 'coinbase':
                    return { label: 'COINBASE', icon: '⛏️', cssClass: 'transparent' };
                default:
                    return { label: 'DESCONOCIDA', icon: '❓', cssClass: 'transparent' };
            }
        }

        async function detectCommand(input) {
            input = input.trim();
            if (input.startsWith('getblock ') || input.startsWith('getrawtransaction ') ||
                input.startsWith('validateaddress ') || input.startsWith('getblockhash ')) {
                return input;
            }
            if (/^\d+$/.test(input)) {
                try {
                    const url = `${API_URL}?token=${TOKEN}&cmd=getblockhash ${input}`;
                    const response = await fetch(url);
                    const data = await response.json();
                    if (data.result) return `getblock ${data.result}`;
                } catch (e) {}
                return `getblock ${input}`;
            }
            if (/^[a-fA-F0-9]{64}$/.test(input)) {
                try {
                    const blockCheckUrl = `${API_URL}?token=${TOKEN}&cmd=getblock ${input}`;
                    const blockResponse = await fetch(blockCheckUrl);
                    const blockData = await blockResponse.json();
                    if (blockData.result && !blockData.error) return `getblock ${input}`;
                    return `getrawtransaction ${input} 1`;
                } catch (error) {
                    return `getrawtransaction ${input} 1`;
                }
            }
            if (input.startsWith('D') && input.length === 34) return `validateaddress ${input}`;
            if (input.startsWith('p') && input.length === 78) return `validateaddress ${input}`;
            if (input.startsWith('z') && input.length > 50) return `validateaddress ${input}`;
            return input;
        }

        async function loadNetworkStats() {
            try {
                const r = await fetch(STATUS_URL);
                const d = await r.json();
                document.getElementById('stat-height').textContent = d.height?.toLocaleString() || '---';
                document.getElementById('stat-connections').textContent = d.connections || '---';
                document.getElementById('stat-mempool').textContent = d.mempool || '0';
            } catch (e) {}
        }

        async function getVinValue(txid, voutIndex) {
            try {
                const url = `${API_URL}?token=${TOKEN}&cmd=getrawtransaction ${txid} 1`;
                const response = await fetch(url);
                const data = await response.json();
                if (data.result && data.result.vout && data.result.vout[voutIndex]) {
                    return data.result.vout[voutIndex].value;
                }
            } catch (e) {}
            return null;
        }

        function renderOutput(html) {
            document.getElementById('output').innerHTML = html;
        }

        function renderPlaceholder() {
            renderOutput(`
            <div class="placeholder">
              <div class="icon">⧫</div>
              <div>explorador de bloques PIVX</div>
              <div class="sub">bloque · transacción · dirección</div>
            </div>
          `);
        }

        function renderLoading() {
            renderOutput(`
            <div class="loading">
              <span class="spinner"></span>
              consultando red…
            </div>
          `);
        }

        async function executeSearch(q) {
            const raw = q.trim();
            if (!raw) { renderPlaceholder(); return; }

            renderLoading();

            let cmd = raw;
            if (!cmd.startsWith('getblock') && !cmd.startsWith('getrawtransaction') &&
                !cmd.startsWith('validateaddress') && !cmd.startsWith('getblockhash')) {
                cmd = await detectCommand(raw);
                const cleanValue = cmd.replace('getblock ', '').replace('getrawtransaction ', '').replace(' 1', '')
                    .replace('validateaddress ', '').replace('getblockhash ', '');
                if (cleanValue) updateUrlWithSearch(cleanValue);
            } else {
                const cleanValue = cmd.replace('getblock ', '').replace('getrawtransaction ', '').replace(' 1', '')
                    .replace('validateaddress ', '').replace('getblockhash ', '');
                if (cleanValue) updateUrlWithSearch(cleanValue);
            }

            try {
                const r = await fetch(`${API_URL}?token=${TOKEN}&cmd=${encodeURIComponent(cmd)}`);
                const data = await r.json();

                if (data.error) {
                    renderOutput(`
                <div class="cmd-line"><span class="tag">✕</span> ${escapeHtml(cmd)}</div>
                <div style="color:#ff756f;padding:6px 0;">error: ${escapeHtml(JSON.stringify(data.error))}</div>
                <button class="copy-btn" onclick="copyResult()">[ copiar ]</button>
              `);
                    return;
                }

                const result = data.result;
                if (!result) {
                    renderOutput(`
                <div class="cmd-line"><span class="tag">◌</span> ${escapeHtml(cmd)}</div>
                <div style="color:#3d3830;">sin resultado</div>
                <button class="copy-btn" onclick="copyResult()">[ copiar ]</button>
              `);
                    return;
                }

                // ── BLOQUE ──
                if (cmd.includes('getblock') && result.hash) {
                    const b = result;
                    let res = `<div class="cmd-line"><span class="tag">⧫ BLOQUE</span> #${b.height}</div>`;
                    res += `<div class="row"><span class="key">hash</span><span class="val">${makeLink(b.hash)}</span></div>`;
                    res += `<div class="row"><span class="key">fecha</span><span class="val">${new Date(b.time*1000).toLocaleString()}</span></div>`;
                    res += `<div class="row"><span class="key">dificultad</span><span class="val">${b.difficulty || '---'}</span></div>`;
                    res += `<div class="row"><span class="key">tamaño</span><span class="val">${b.size || 0} bytes</span></div>`;
                    if (b.previousblockhash) res += `<div class="row"><span class="key">anterior</span><span class="val">${makeLink(b.previousblockhash)}</span></div>`;
                    if (b.nextblockhash) res += `<div class="row"><span class="key">siguiente</span><span class="val">${makeLink(b.nextblockhash)}</span></div>`;
                    res += `<div class="divider"></div>`;
                    res += `<div class="row"><span class="key">transacciones</span><span class="val violet">${b.tx?.length ?? 0}</span></div>`;

                    if (b.tx && b.tx.length > 0) {
                        const txs = b.tx.slice(0, 50);
                        for (const tx of txs) {
                            const txid = typeof tx === 'object' ? tx.txid || tx : tx;
                            let txObj = typeof tx === 'object' ? tx : null;

                            let txType = 'unknown';
                            let txInfo = { label: 'DESCONOCIDA', icon: '❓', cssClass: 'transparent' };

                            if (txObj) {
                                txType = getTxType(txObj);
                                txInfo = getTxTypeLabel(txType);
                            } else {
                                try {
                                    const txResponse = await fetch(`${API_URL}?token=${TOKEN}&cmd=getrawtransaction ${txid} 1`);
                                    const txData = await txResponse.json();
                                    if (txData.result) {
                                        txType = getTxType(txData.result);
                                        txInfo = getTxTypeLabel(txType);
                                    }
                                } catch (e) {}
                            }

                            res += `<div class="tx-item">
                                <span class="txid-link" onclick="navigateTo('${encodeURIComponent(txid)}')">${txInfo.icon} ${escapeHtml(txid)}</span>
                                <span class="tx-type-badge ${txInfo.cssClass}">${txInfo.label}</span>
                                <div class="tx-meta">
                                    <span>${txType === 'private' ? '🔒 transacción privada (shielded)' : txType === 'shielding' ? '🔄 shielding: transparente → privada' : txType === 'deshielding' ? '🔄 deshielding: privada → transparente' : '📄 transacción transparente'}</span>
                                </div>
                            </div>`;
                        }
                        if (b.tx.length > 50) res += `<div style="color:#3d3830;font-size:12px;padding:4px 0;">… y ${b.tx.length - 50} más</div>`;
                    }

                    res += `<button class="copy-btn" onclick="copyResult()">[ copiar ]</button>`;
                    renderOutput(res);
                    return;
                }

                // ── TRANSACCIÓN ──
                if (cmd.includes('getrawtransaction') && result.txid) {
                    const t = result;
                    const txType = getTxType(t);
                    const txInfo = getTxTypeLabel(txType);

                    const hasCoinbase = t.vin && t.vin.length > 0 && t.vin[0].coinbase !== undefined;
                    const hasTransparentIn = t.vin && t.vin.length > 0;
                    const hasTransparentOut = t.vout && t.vout.length > 0;
                    const hasShieldedSpend = t.vShieldSpend && t.vShieldSpend.length > 0;
                    const hasShieldedOutput = t.vShieldOutput && t.vShieldOutput.length > 0;
                    const hasVoutZero = t.vout && t.vout.length > 0 && t.vout[0].value === 0;
                    const isOnlyZeroOutput = t.vout && t.vout.length === 1 && t.vout[0].value === 0;
                    const isCoinStake = !hasCoinbase && hasTransparentIn && hasVoutZero && t.vout && t.vout.length >= 2;
                    const isDummyCoinbase = hasCoinbase && isOnlyZeroOutput;
                    const isShielded = !hasTransparentIn && !hasTransparentOut && (hasShieldedSpend || hasShieldedOutput);
                    const isShielding = hasTransparentIn && !hasTransparentOut && hasShieldedOutput && !hasShieldedSpend;
                    const isDeshielding = hasShieldedSpend && !hasShieldedOutput && hasTransparentOut && !hasTransparentIn;

                    let isColdStaking = false;
                    let coldStakeOwner = null;
                    let coldStakeStaker = null;

                    if (t.vout && t.vout.length > 0) {
                        t.vout.forEach(vout => {
                            if (vout.scriptPubKey && vout.scriptPubKey.type === 'coldstake') {
                                isColdStaking = true;
                                if (vout.scriptPubKey.addresses && vout.scriptPubKey.addresses.length >= 2) {
                                    coldStakeStaker = vout.scriptPubKey.addresses[0];
                                    coldStakeOwner = vout.scriptPubKey.addresses[1];
                                }
                            }
                        });
                    }

                    const isSelfDelegation = isColdStaking && coldStakeOwner && coldStakeStaker &&
                        coldStakeOwner === coldStakeStaker;

                    let totalIn = 0;
                    let inputValues = [];

                    if (t.vin && t.vin.length > 0 && !hasCoinbase) {
                        const vinPromises = t.vin.map(async (vin, index) => {
                            const value = await getVinValue(vin.txid, vin.vout);
                            return { index, value };
                        });
                        const results = await Promise.all(vinPromises);
                        results.forEach(r => {
                            if (r.value !== null) {
                                totalIn += r.value;
                                inputValues[r.index] = r.value;
                            }
                        });
                    }

                    let totalOut = 0;
                    if (t.vout) {
                        t.vout.forEach(vout => {
                            totalOut += vout.value || 0;
                        });
                    }

                    let tipoLabel = `${txInfo.icon} ${txInfo.label}`;
                    if (txType === 'private') tipoLabel = '🛡 TRANSACCIÓN PRIVADA (SHIELDED)';
                    else if (txType === 'shielding') tipoLabel = '🛡 SHIELDING (TRANSPARENTE → PRIVADA)';
                    else if (txType === 'deshielding') tipoLabel = '🛡 DESHIELDING (PRIVADA → TRANSPARENTE)';
                    else if (txType === 'coinstake') tipoLabel = '⚡️ COINSTAKE (GENERACIÓN DE BLOQUE PoS)';
                    else if (txType === 'transparent') tipoLabel = '📄 TRANSACCIÓN TRANSPARENTE';

                    let res = `<div class="cmd-line"><span class="tag">${tipoLabel}</span> ${makeLink(t.txid)}</div>`;
                    res += `<div class="row"><span class="key">TXID</span><span class="val">${makeLink(t.txid)}</span></div>`;
                    res += `<div class="row"><span class="key">bloque</span><span class="val">${t.blockheight || t.height ? makeLink(String(t.blockheight || t.height)) : 'no confirmada'}</span></div>`;
                    res += `<div class="row"><span class="key">confirmaciones</span><span class="val">${t.confirmations || 0}</span></div>`;
                    if (t.time || t.blocktime) {
                        const ts = t.time || t.blocktime;
                        res += `<div class="row"><span class="key">fecha</span><span class="val">${new Date(ts*1000).toLocaleString()}</span></div>`;
                    }
                    if (t.size) res += `<div class="row"><span class="key">tamaño</span><span class="val">${t.size} bytes</span></div>`;
                    if (t.version) res += `<div class="row"><span class="key">versión</span><span class="val">${t.version}</span></div>`;
                    if (t.expiryheight) res += `<div class="row"><span class="key">expira</span><span class="val">bloque ${t.expiryheight}</span></div>`;

                    res += `<div class="divider"></div>`;

                    // ── ENTRADAS ──
                    if (t.vin && t.vin.length > 0) {
                        res += `<div class="row"><span class="key">▶ ENTRADAS</span><span class="val violet">${t.vin.length}</span></div>`;
                        t.vin.forEach((vin, i) => {
                            if (vin.coinbase !== undefined) {
                                if (isDummyCoinbase) {
                                    res += `<div class="row" style="padding-left:14px;font-size:12px;color:#6a6255;"><span class="key" style="min-width:24px;">#${i}</span><span class="val" style="color:#5a5348;">COINBASE (dummy - PoS)</span></div>`;
                                } else {
                                    res += `<div class="row" style="padding-left:14px;font-size:12px;color:#6a6255;"><span class="key" style="min-width:24px;">#${i}</span><span class="val" style="color:#c597ff;">COINBASE</span></div>`;
                                }
                            } else if (vin.txid) {
                                const valorInput = inputValues[i] !== undefined ? inputValues[i] : null;
                                let valorStr = '';
                                if (valorInput) {
                                    valorStr = ` ${valorInput.toFixed(6)} PIV`;
                                    if (isCoinStake) valorStr += ` (stake activo)`;
                                    else if (isColdStaking) valorStr += ` (fondos a delegar)`;
                                    else if (isShielding) valorStr += ` (a blindar)`;
                                }
                                res += `<div class="row" style="padding-left:14px;font-size:12px;color:#6a6255;"><span class="key" style="min-width:24px;">#${i}</span><span class="val" style="font-size:12px;">${makeLink(vin.txid)}:${vin.vout}</span>${valorStr ? `<span class="val violet">${valorStr}</span>` : ''}</div>`;
                            }
                        });
                        if (totalIn > 0) {
                            res += `<div class="row" style="margin-top:2px;"><span class="key">total entrada</span><span class="val violet">${totalIn.toFixed(6)} PIV</span></div>`;
                        }
                    }

                    // ── SALIDAS ──
                    if (t.vout && t.vout.length > 0) {
                        res += `<div class="divider"></div>`;
                        res += `<div class="row"><span class="key">◀ SALIDAS</span><span class="val violet">${t.vout.length}</span></div>`;

                        t.vout.forEach((vout, i) => {
                            let addr = '';
                            let extraInfo = '';

                            if (vout.scriptPubKey?.addresses?.[0]) {
                                addr = vout.scriptPubKey.addresses[0];
                                if (vout.scriptPubKey.addresses.length > 1) {
                                    extraInfo = ` (multi-address)`;
                                }
                            } else if (vout.scriptPubKey?.address) {
                                addr = vout.scriptPubKey.address;
                            }

                            let tipo = '';
                            let addrDisplay = '';

                            if (isDummyCoinbase) {
                                if (vout.value === 0) {
                                    tipo = ' [salida nula - coinbase PoS]';
                                }
                            } else if (isCoinStake) {
                                if (i === 0 && vout.value === 0) {
                                    tipo = ' [coinstake marker]';
                                } else if (i === 1 && vout.value > 0) {
                                    tipo = ' ← stake (parte 1/2)';
                                } else if (i === 2 && vout.value > 0) {
                                    tipo = ' ← stake (parte 2/2)';
                                } else if (i >= 3 && vout.value > 0) {
                                    tipo = ' [recompensa]';
                                }
                            } else if (isColdStaking) {
                                if (vout.scriptPubKey && vout.scriptPubKey.type === 'coldstake') {
                                    tipo = ' [CONTRATO COLD STAKING]';
                                    if (coldStakeStaker && coldStakeOwner) {
                                        const relacion = isSelfDelegation ? ' (auto-delegación)' : ' (delegado a tercero)';
                                        extraInfo = `\n       dueño: ${coldStakeOwner}\n       staker: ${coldStakeStaker}${relacion}`;
                                    }
                                } else {
                                    if (vout.value === 0) {
                                        tipo = ' [salida nula]';
                                    } else if (t.vout.length > 1 && vout.value === Math.max(...t.vout.map(v => v.value || 0))) {
                                        tipo = ' ← destinatario (pago)';
                                    } else if (t.vout.length > 1 && vout.value < Math.max(...t.vout.map(v => v.value || 0))) {
                                        tipo = ' [cambio]';
                                    }
                                }
                            } else {
                                if (vout.value === 0) {
                                    tipo = ' [salida nula]';
                                } else if (t.vout.length > 1 && vout.value === Math.max(...t.vout.map(v => v.value || 0))) {
                                    tipo = ' ← destinatario (pago)';
                                } else if (t.vout.length > 1 && vout.value < Math.max(...t.vout.map(v => v.value || 0))) {
                                    tipo = ' [cambio]';
                                }
                            }

                            if (addr) {
                                addrDisplay = ` → ${makeLink(addr)}`;
                            }

                            res += `<div class="row" style="padding-left:14px;font-size:12px;color:#6a6255;"><span class="key" style="min-width:24px;">#${i}</span><span class="val violet">${vout.value.toFixed(6)} PIV</span>${addrDisplay}${tipo}${extraInfo}</div>`;
                        });

                        if (totalOut > 0) {
                            if (isColdStaking && !isCoinStake) {
                                res += `<div class="row" style="margin-top:2px;"><span class="key">total delegado</span><span class="val violet">${totalOut.toFixed(6)} PIV</span></div>`;
                            } else if (isCoinStake) {
                                res += `<div class="row" style="margin-top:2px;"><span class="key">total generado</span><span class="val violet">${totalOut.toFixed(6)} PIV</span></div>`;
                            } else {
                                res += `<div class="row" style="margin-top:2px;"><span class="key">total salida</span><span class="val violet">${totalOut.toFixed(6)} PIV</span></div>`;
                            }
                        }
                    }

                    // ── SHIELDED (PRIVADA) ──
                    if (hasShieldedSpend || hasShieldedOutput) {
                        res += `<div class="divider"></div>`;
                        res += `<div class="row"><span class="key">🛡 TRANSACCIÓN PRIVADA (SHIELDED)</span></div>`;

                        if (hasShieldedSpend) {
                            res += `<div class="row" style="padding-left:14px;font-size:12px;color:#6a6255;"><span class="key" style="min-width:60px;">gastos privados</span><span class="val violet">${t.vShieldSpend.length}</span></div>`;
                            t.vShieldSpend.forEach((spend, i) => {
                                res += `<div class="row" style="padding-left:28px;font-size:12px;color:#5a5348;"><span class="key" style="min-width:40px;">#${i}</span><span class="val">nullifier: ${spend.nullifier}</span></div>`;
                            });
                        }
                        if (hasShieldedOutput) {
                            res += `<div class="row" style="padding-left:14px;font-size:12px;color:#6a6255;"><span class="key" style="min-width:60px;">salidas privadas</span><span class="val violet">${t.vShieldOutput.length}</span></div>`;
                        }
                        if (t.valueBalance !== undefined) {
                            const balancePiv = parseFloat(t.valueBalance);
                            res += `<div class="row" style="padding-left:14px;font-size:12px;color:#6a6255;"><span class="key" style="min-width:60px;">valueBalance</span><span class="val violet">${balancePiv.toFixed(6)} PIV</span></div>`;
                        }
                        if (t.bindingSig) {
                            res += `<div class="row" style="padding-left:14px;font-size:12px;color:#6a6255;"><span class="key" style="min-width:60px;">bindingSig</span><span class="val mono">${t.bindingSig.substring(0, 64)}…</span></div>`;
                        }
                        res += `<div class="row" style="padding-left:14px;font-size:12px;color:#5a5348;"><span class="key" style="min-width:60px;">🔒 privacidad</span><span class="val">montos ocultos</span></div>`;
                    }

                    // ── RESUMEN ──
                    res += `<div class="divider"></div>`;
                    res += `<div class="row"><span class="key">RESUMEN</span></div>`;
                    res += `<div class="row" style="padding-left:14px;font-size:12px;color:#6a6255;"><span class="key" style="min-width:60px;">entradas transparentes</span><span class="val">${t.vin?.length || 0}</span></div>`;
                    res += `<div class="row" style="padding-left:14px;font-size:12px;color:#6a6255;"><span class="key" style="min-width:60px;">salidas transparentes</span><span class="val">${t.vout?.length || 0}</span></div>`;
                    if (isShielded || hasShieldedSpend || hasShieldedOutput) {
                        res += `<div class="row" style="padding-left:14px;font-size:12px;color:#6a6255;"><span class="key" style="min-width:60px;">actividad privada</span><span class="val violet">sí 🛡</span></div>`;
                    }

                    if (isDummyCoinbase) {
                        res += `<div class="row" style="padding-left:14px;font-size:12px;color:#6a6255;"><span class="key" style="min-width:60px;">tipo</span><span class="val">coinbase (bloque PoS - sin recompensa)</span></div>`;
                    } else if (hasCoinbase && !isDummyCoinbase) {
                        res += `<div class="row" style="padding-left:14px;font-size:12px;color:#6a6255;"><span class="key" style="min-width:60px;">tipo</span><span class="val">coinbase (PoW - no aplica en PIVX)</span></div>`;
                    } else if (isCoinStake) {
                        res += `<div class="row" style="padding-left:14px;font-size:12px;color:#6a6255;"><span class="key" style="min-width:60px;">tipo</span><span class="val violet">coinstake (PoS)</span></div>`;
                        res += `<div class="row" style="padding-left:14px;font-size:12px;color:#6a6255;"><span class="key" style="min-width:60px;">modo</span><span class="val">${isColdStaking ? 'cold staking' : 'hot staking'}</span></div>`;
                        if (totalIn > 0 && t.vout && t.vout.length >= 2) {
                            const stakeFinal = t.vout[1]?.value || 0;
                            const recompensaDistribuida = t.vout.slice(2).reduce((sum, v) => sum + (v.value || 0), 0);
                            const recompensaTotal = totalOut - totalIn;
                            const recompensaReinvertida = stakeFinal - totalIn;
                            res += `<div class="row" style="padding-left:14px;font-size:12px;color:#5a5348;"><span class="key" style="min-width:60px;">stake activo previo</span><span class="val violet">${totalIn.toFixed(6)} PIV</span></div>`;
                            res += `<div class="row" style="padding-left:14px;font-size:12px;color:#5a5348;"><span class="key" style="min-width:60px;">stake final</span><span class="val violet">${stakeFinal.toFixed(6)} PIV</span></div>`;
                            res += `<div class="row" style="padding-left:14px;font-size:12px;color:#5a5348;"><span class="key" style="min-width:60px;">recompensa total</span><span class="val violet">+${recompensaTotal.toFixed(6)} PIV</span></div>`;
                            res += `<div class="row" style="padding-left:28px;font-size:12px;color:#5a5348;"><span class="key" style="min-width:40px;">reinvertida</span><span class="val violet">+${recompensaReinvertida.toFixed(6)} PIV</span></div>`;
                            res += `<div class="row" style="padding-left:28px;font-size:12px;color:#5a5348;"><span class="key" style="min-width:40px;">distribuida</span><span class="val violet">${recompensaDistribuida.toFixed(6)} PIV</span></div>`;
                        }
                        res += `<div class="row" style="padding-left:14px;font-size:12px;color:#6a6255;"><span class="key" style="min-width:60px;">fee</span><span class="val">0 PIV (generación de bloques)</span></div>`;
                    } else if (isShielded) {
                        res += `<div class="row" style="padding-left:14px;font-size:12px;color:#6a6255;"><span class="key" style="min-width:60px;">tipo</span><span class="val violet">transacción privada (shielded)</span></div>`;
                        res += `<div class="row" style="padding-left:14px;font-size:12px;color:#6a6255;"><span class="key" style="min-width:60px;">privacidad</span><span class="val">🔒 total (datos ocultos)</span></div>`;
                        if (t.valueBalance) {
                            const fee = Math.abs(parseFloat(t.valueBalance));
                            res += `<div class="row" style="padding-left:14px;font-size:12px;color:#6a6255;"><span class="key" style="min-width:60px;">fee</span><span class="val violet">${fee.toFixed(6)} PIV</span></div>`;
                        }
                    } else if (isShielding) {
                        res += `<div class="row" style="padding-left:14px;font-size:12px;color:#6a6255;"><span class="key" style="min-width:60px;">tipo</span><span class="val violet">shielding (transparente → privada)</span></div>`;
                        if (totalIn > 0) {
                            res += `<div class="row" style="padding-left:14px;font-size:12px;color:#6a6255;"><span class="key" style="min-width:60px;">fondos blindados</span><span class="val violet">${totalIn.toFixed(6)} PIV</span></div>`;
                        }
                    } else if (isDeshielding) {
                        res += `<div class="row" style="padding-left:14px;font-size:12px;color:#6a6255;"><span class="key" style="min-width:60px;">tipo</span><span class="val violet">deshielding (privada → transparente)</span></div>`;
                        if (totalOut > 0) {
                            res += `<div class="row" style="padding-left:14px;font-size:12px;color:#6a6255;"><span class="key" style="min-width:60px;">fondos visibles</span><span class="val violet">${totalOut.toFixed(6)} PIV</span></div>`;
                        }
                    } else if (isColdStaking && !isCoinStake) {
                        res += `<div class="row" style="padding-left:14px;font-size:12px;color:#6a6255;"><span class="key" style="min-width:60px;">tipo</span><span class="val violet">delegación a cold staking</span></div>`;
                        if (coldStakeOwner && coldStakeStaker) {
                            const relacion = isSelfDelegation ? 'auto-delegación' : 'delegado a tercero';
                            res += `<div class="row" style="padding-left:14px;font-size:12px;color:#5a5348;"><span class="key" style="min-width:60px;">dueño</span><span class="val">${coldStakeOwner}</span></div>`;
                            res += `<div class="row" style="padding-left:14px;font-size:12px;color:#5a5348;"><span class="key" style="min-width:60px;">staker</span><span class="val">${coldStakeStaker}</span></div>`;
                            res += `<div class="row" style="padding-left:14px;font-size:12px;color:#5a5348;"><span class="key" style="min-width:60px;">relación</span><span class="val">${relacion}</span></div>`;
                        }
                    }

                    res += `<button class="copy-btn" onclick="copyResult()">[ copiar ]</button>`;
                    renderOutput(res);
                    return;
                }

                // ── VALIDAR DIRECCION ──
                if (cmd.includes('validateaddress') && result) {
                    const v = result;
                    const direccion = v.address || cmd.split(' ')[1] || 'desconocida';
                    let emoji = '🔓';
                    let tipoDir = 'transparente';
                    if (direccion.startsWith('p') || direccion.startsWith('z')) {
                        emoji = '🔒';
                        tipoDir = 'privada (shielded)';
                    }
                    let res = `<div class="cmd-line"><span class="tag">◈ DIRECCIÓN</span> ${makeLink(direccion)} ${emoji}</div>`;
                    res += `<div class="row"><span class="key">dirección</span><span class="val">${makeLink(direccion)}</span></div>`;
                    res += `<div class="row"><span class="key">válida</span><span class="val">${v.isvalid ? '✅ sí' : '❌ no'}</span></div>`;
                    if (v.isvalid) {
                        res += `<div class="row"><span class="key">tipo</span><span class="val">${tipoDir}</span></div>`;
                        if (v.ismine !== undefined) {
                            res += `<div class="row"><span class="key">pertenece a wallet</span><span class="val">${v.ismine ? 'sí' : 'no'}</span></div>`;
                        }
                        if (v.isstaking !== undefined) {
                            res += `<div class="row"><span class="key">staking</span><span class="val">${v.isstaking ? 'sí' : 'no'}</span></div>`;
                        }
                    }

                    res += `<button class="copy-btn" onclick="copyResult()">[ copiar ]</button>`;
                    renderOutput(res);
                    return;
                }

                let res = `<div class="cmd-line"><span class="tag">◌</span> ${escapeHtml(cmd)}</div>`;
                res += `<pre style="font-family:'Lucida Console',monospace;font-size:12px;color:#6a6255;background:rgba(0,0,0,0.2);padding:16px;border-radius:10px;overflow-x:auto;white-space:pre-wrap;word-break:break-all;">${escapeHtml(JSON.stringify(result, null, 2))}</pre>`;
                res += `<button class="copy-btn" onclick="copyResult()">[ copiar ]</button>`;
                renderOutput(res);

            } catch (e) {
                renderOutput(`
              <div class="cmd-line"><span class="tag">✕</span> error</div>
              <div style="color:#ff756f;padding:6px 0;">${escapeHtml(e.message)}</div>
              <button class="copy-btn" onclick="copyResult()">[ copiar ]</button>
            `);
            }

            document.getElementById('searchInput').value = '';
        }

        window.copyResult = function() {
            const outputPre = document.querySelector('#output pre:last-of-type');
            if (outputPre) {
                navigator.clipboard.writeText(outputPre.innerText).then(() => {
                    document.querySelector('.prompt').textContent = '✓';
                    setTimeout(() => document.querySelector('.prompt').textContent = '►', 1000);
                    showToast('✓ copiado');
                });
            } else {
                const out = document.getElementById('output');
                const text = out.textContent;
                if (text) {
                    navigator.clipboard.writeText(text).then(() => {
                        showToast('✓ copiado');
                    });
                }
            }
        };

        window.navigateTo = navigateTo;
        window.executeSearch = executeSearch;
        window.goBack = goBack;
        window.goToHistory = goToHistory;

        document.addEventListener('keydown', function(e) {
            if (e.key === 'F8') { e.preventDefault();
                window.copyResult(); }
            if (e.key === 'F9') {
                e.preventDefault();
                document.getElementById('searchInput').value = '';
                renderPlaceholder();
                document.querySelector('.prompt').textContent = '♥';
                setTimeout(() => document.querySelector('.prompt').textContent = '►', 1000);
                const baseUrl = window.location.origin + '/pagina/pivx-explorer';
                window.history.replaceState({}, '', baseUrl);
                historyStack = [];
                currentIndex = -1;
                updateBackButton();
                updateBreadcrumb();
                loadNetworkStats();
            }
            if (e.key === 'ArrowLeft' && (e.altKey || e.metaKey)) {
                e.preventDefault();
                goBack();
            }
        });

        const searchInput = document.getElementById('searchInput');
        searchInput.addEventListener('keydown', async (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                const rawInput = searchInput.value.trim();
                if (rawInput) {
                    const cmd = await detectCommand(rawInput);
                    const label = getLabelForQuery(cmd);
                    pushHistory(cmd, label);
                    const cleanValue = cmd.replace('getblock ', '').replace('getrawtransaction ', '').replace(' 1', '')
                        .replace('validateaddress ', '').replace('getblockhash ', '');
                    updateUrlWithSearch(cleanValue);
                    executeSearch(cmd);
                }
            }
        });
        searchInput.addEventListener('paste', () => {
            setTimeout(async () => {
                const input = searchInput.value;
                const cmd = await detectCommand(input);
                if (cmd !== input) searchInput.value = cmd;
            }, 10);
        });

        (async function() {
            const searchParam = detectSearchFromUrl();
            if (searchParam) {
                window.addEventListener('load', async () => {
                    setTimeout(async () => {
                        const input = document.getElementById('searchInput');
                        if (input) {
                            const cmd = await detectCommand(searchParam);
                            input.value = cmd;
                            const label = getLabelForQuery(cmd);
                            pushHistory(cmd, label);
                            executeSearch(cmd);
                        }
                    }, 500);
                });
            }
        })();

        loadNetworkStats();
        setInterval(loadNetworkStats, 30000);
    </script>

</body>
</html>
