<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PIVX · Explorador</title>
    <link rel="icon" type="image/png" href="assets/pivx.png">
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body { overflow-x: hidden; }

    body {
        min-height: 100vh;
        background: #0a080c;
        background-image:
            radial-gradient(ellipse at 30% 40%, rgba(160, 68, 255, 0.08) 0%, transparent 60%),
            radial-gradient(ellipse at 70% 80%, rgba(160, 68, 255, 0.05) 0%, transparent 50%),
            linear-gradient(160deg, #0a080c 0%, #161114 50%, #0d0b10 100%);
        font-family: 'Lucida Console', 'Courier New', monospace;
        color: #ece8e0;
        display: flex;
        align-items: flex-start;
        justify-content: center;
    }

    .app {
        width: 100%;
        max-width: 1400px;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        gap: 18px;
        padding: 20px 28px;
        min-width: 0;
    }

    .header {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 12px 20px;
        padding: 16px 24px;
        background: rgba(255, 255, 255, 0.02);
        border-radius: 14px;
        border: 1px solid rgba(160, 68, 255, 0.2);
        backdrop-filter: blur(8px);
        min-width: 0;
    }

    .brand {
        display: flex;
        align-items: center;
        gap: 14px;
        min-width: 0;
    }

    .brand img {
        width: 38px;
        height: 38px;
        filter: drop-shadow(0 0 16px rgba(160, 68, 255, 0.3));
        transition: filter 0.3s;
        flex-shrink: 0;
    }

    .brand img:hover { filter: drop-shadow(0 0 24px rgba(160, 68, 255, 0.5)); }

    .brand h1 {
        font-size: 21px;
        font-weight: 400;
        letter-spacing: 1.5px;
        color: #f5e6c8;
        text-shadow: 0 0 30px rgba(160, 68, 255, 0.15);
        white-space: nowrap;
    }

    .brand h1 small {
        font-size: 12px;
        color: #6a6255;
        letter-spacing: 2px;
        font-weight: 300;
    }

    .header-right {
        display: flex;
        align-items: center;
        gap: 18px;
        flex-wrap: wrap;
        min-width: 0;
    }

    .nav-links {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 4px 18px;
        font-size: 12px;
        letter-spacing: 0.3px;
        min-width: 0;
    }

    .nav-links a {
        color: #6a6255;
        text-decoration: none;
        transition: all 0.25s;
        padding: 4px 0;
        border-bottom: 2px solid transparent;
        white-space: nowrap;
    }

    .nav-links a:hover { color: #c597ff; border-bottom-color: #c597ff; }

    .back-btn {
        color: #c597ff;
        cursor: pointer;
        padding: 4px 12px;
        border: 1px solid rgba(160, 68, 255, 0.15);
        border-radius: 20px;
        font-size: 11px;
        transition: all 0.25s;
        background: rgba(160, 68, 255, 0.05);
        display: none;
        align-items: center;
        gap: 6px;
        white-space: nowrap;
        flex-shrink: 0;
    }

    .back-btn:hover { background: rgba(160, 68, 255, 0.1); border-color: rgba(160, 68, 255, 0.3); }
    .back-btn.show { display: inline-flex; }

    .lang-switcher {
        display: inline-flex;
        border: 1px solid rgba(160, 68, 255, 0.25);
        border-radius: 8px;
        overflow: hidden;
        background: rgba(255, 255, 255, 0.02);
        flex-shrink: 0;
    }

    .lang-switcher button {
        background: transparent;
        border: none;
        color: #6a6255;
        font-family: 'Lucida Console', 'Courier New', monospace;
        font-size: 11px;
        letter-spacing: 1px;
        padding: 6px 12px;
        cursor: pointer;
        transition: all 0.2s;
    }

    .lang-switcher button + button { border-left: 1px solid rgba(160, 68, 255, 0.15); }
    .lang-switcher button:hover { color: #c597ff; background: rgba(160, 68, 255, 0.06); }
    .lang-switcher button.active { color: #0a080c; background: #c597ff; font-weight: 700; }

    .stats-bar {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 6px 32px;
        padding: 12px 24px;
        background: rgba(255, 255, 255, 0.02);
        border-radius: 12px;
        border: 1px solid rgba(160, 68, 255, 0.1);
        font-size: 13px;
        min-width: 0;
    }

    .stats-bar .stat {
        display: flex;
        align-items: baseline;
        gap: 6px;
        min-width: 0;
    }

    .stats-bar .label {
        color: #4a443a;
        font-size: 9px;
        text-transform: uppercase;
        letter-spacing: 0.8px;
        flex-shrink: 0;
    }

    .stats-bar .value {
        color: #f5ede4;
        font-weight: 600;
        font-size: 14px;
        min-width: 0;
        word-break: break-word;
        overflow-wrap: anywhere;
    }

    .search-section {
        display: flex;
        gap: 12px;
        align-items: center;
        background: rgba(255, 255, 255, 0.03);
        border-radius: 14px;
        padding: 2px 2px 2px 22px;
        border: 1px solid rgba(160, 68, 255, 0.15);
        transition: all 0.3s ease;
        min-width: 0;
    }

    .search-section:focus-within {
        border-color: rgba(160, 68, 255, 0.4);
        box-shadow: 0 0 0 4px rgba(160, 68, 255, 0.06);
        background: rgba(255, 255, 255, 0.04);
    }

    .search-section .prompt {
        color: #c597ff;
        font-size: 16px;
        user-select: none;
        transition: transform 0.2s;
        flex-shrink: 0;
    }

    .search-section:focus-within .prompt { transform: scale(1.1); }

    .search-section input {
        flex: 1;
        background: transparent;
        border: none;
        padding: 15px 8px 15px 4px;
        font-family: 'Lucida Console', 'Courier New', monospace;
        font-size: 16px;
        color: #f5ede4;
        outline: none;
        min-width: 0;
        letter-spacing: 0.2px;
    }

    .search-section input::placeholder { color: #3d3830; letter-spacing: 0.5px; }

    .search-section .shortcuts {
        display: flex;
        gap: 4px;
        padding-right: 16px;
        font-size: 10px;
        color: #3d3830;
        flex-shrink: 0;
    }

    .search-section .shortcuts kbd {
        background: rgba(255, 255, 255, 0.04);
        padding: 4px 12px;
        border-radius: 6px;
        color: #5a5348;
        border: 1px solid rgba(255, 255, 255, 0.04);
        font-family: 'Lucida Console', monospace;
        font-size: 9px;
        letter-spacing: 0.3px;
        transition: all 0.2s;
    }

    .search-section .shortcuts kbd:hover {
        background: rgba(160, 68, 255, 0.06);
        border-color: rgba(160, 68, 255, 0.1);
        color: #8a8275;
    }

    .output-wrapper {
        flex: 1;
        min-height: 400px;
        background: rgba(0, 0, 0, 0.3);
        border-radius: 14px;
        border: 1px solid rgba(160, 68, 255, 0.06);
        padding: 24px 28px;
        overflow-y: auto;
        box-shadow: inset 0 0 60px rgba(0, 0, 0, 0.2);
        backdrop-filter: blur(4px);
        transition: border-color 0.3s;
        min-width: 0;
    }

    .output-wrapper:hover { border-color: rgba(160, 68, 255, 0.1); }
    .output-wrapper::-webkit-scrollbar { width: 6px; }
    .output-wrapper::-webkit-scrollbar-track { background: transparent; }
    .output-wrapper::-webkit-scrollbar-thumb { background: rgba(160, 68, 255, 0.2); border-radius: 10px; }

    #output {
        font-family: 'Lucida Console', 'Courier New', monospace;
        font-size: 13px;
        line-height: 1.8;
        color: #e0d8cc;
        min-width: 0;
    }

    #output .cmd-line {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 10px;
        color: #c597ff;
        font-size: 14px;
        padding-bottom: 14px;
        border-bottom: 1px solid rgba(160, 68, 255, 0.06);
        margin-bottom: 18px;
        word-break: break-word;
        overflow-wrap: anywhere;
    }

    #output .cmd-line .tag {
        background: rgba(160, 68, 255, 0.1);
        padding: 2px 16px;
        border-radius: 20px;
        font-size: 11px;
        color: #c597ff;
        letter-spacing: 0.5px;
        border: 1px solid rgba(160, 68, 255, 0.06);
        flex-shrink: 0;
    }

    #output .row {
        display: flex;
        flex-wrap: wrap;
        align-items: baseline;
        gap: 2px 12px;
        padding: 3px 0;
        min-width: 0;
    }

    #output .row .key {
        color: #5a5348;
        font-size: 12px;
        min-width: 100px;
        letter-spacing: 0.2px;
        flex-shrink: 0;
    }

    #output .row .val {
        color: #f5ede4;
        word-break: break-all;
        overflow-wrap: anywhere;
        min-width: 0;
        max-width: 100%;
    }

    #output .row .val.violet { color: #c597ff; }

    #output .row .val .link {
        color: #c597ff;
        text-decoration: none;
        transition: all 0.2s;
        border-bottom: 1px solid rgba(160, 68, 255, 0.15);
        padding-bottom: 1px;
        word-break: break-all;
        overflow-wrap: anywhere;
        cursor: pointer;
    }

    #output .row .val .link:hover { color: #dbb8ff; border-bottom-color: #c597ff; }

    #output .divider {
        height: 1px;
        background: linear-gradient(to right, rgba(160, 68, 255, 0.08), transparent);
        margin: 14px 0;
    }

    #output .tx-item {
        background: rgba(255, 255, 255, 0.02);
        border-radius: 10px;
        padding: 10px 16px;
        border-left: 2px solid rgba(160, 68, 255, 0.12);
        margin: 4px 0;
        transition: all 0.15s;
        min-width: 0;
    }

    #output .tx-item:hover {
        background: rgba(255, 255, 255, 0.04);
        border-left-color: rgba(160, 68, 255, 0.25);
    }

    #output .tx-item .txid-link {
        color: #c597ff;
        text-decoration: none;
        font-size: 13px;
        word-break: break-all;
        overflow-wrap: anywhere;
        transition: all 0.2s;
        border-bottom: 1px solid rgba(160, 68, 255, 0.1);
        cursor: pointer;
        display: inline-block;
        max-width: 100%;
    }

    #output .tx-item .txid-link:hover { color: #dbb8ff; border-bottom-color: #c597ff; }

    #output .tx-item .tx-meta {
        display: flex;
        flex-wrap: wrap;
        gap: 2px 20px;
        font-size: 12px;
        color: #6a6255;
        margin-top: 2px;
        min-width: 0;
        word-break: break-word;
        overflow-wrap: anywhere;
    }

    #output .copy-btn {
        margin-top: 18px;
        background: rgba(160, 68, 255, 0.06);
        border: 1px solid rgba(160, 68, 255, 0.12);
        color: #c597ff;
        font-family: 'Lucida Console', monospace;
        font-size: 12px;
        padding: 7px 24px;
        border-radius: 30px;
        cursor: pointer;
        transition: all 0.25s;
        letter-spacing: 0.3px;
    }

    #output .copy-btn:hover {
        background: rgba(160, 68, 255, 0.1);
        border-color: #c597ff;
        box-shadow: 0 0 30px rgba(160, 68, 255, 0.04);
    }

    #output .placeholder {
        color: #3d3830;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 350px;
        gap: 12px;
        text-align: center;
    }

    #output .placeholder .placeholder-logo {
        display: flex;
        align-items: center;
        justify-content: center;
        max-width: 100%;
        margin-bottom: 4px;
    }

    #output .placeholder .placeholder-logo img {
        display: block;
        width: auto;
        height: auto;
        max-width: 350px;
        max-height: 340px;
        object-fit: contain;
        opacity: 0.35;
        filter: drop-shadow(0 0 24px rgba(160, 68, 255, 0.15));
        transition: opacity 0.3s, filter 0.3s;
    }

    #output .placeholder .placeholder-logo img:hover {
        opacity: 0.6;
        filter: drop-shadow(0 0 32px rgba(160, 68, 255, 0.3));
    }

    #output .placeholder .sub {
        font-size: 13px;
        color: #2d2820;
        letter-spacing: 0.5px;
    }

    #output .loading {
        display: flex;
        align-items: center;
        gap: 14px;
        color: #4a443a;
        padding: 20px 0;
    }

    #output .loading .spinner {
        display: inline-block;
        width: 18px;
        height: 18px;
        border: 2px solid rgba(160, 68, 255, 0.1);
        border-top-color: #c597ff;
        border-radius: 50%;
        animation: spin 0.6s linear infinite;
        flex-shrink: 0;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .footer-bar {
        display: flex;
        flex-wrap: wrap;
        justify-content: space-between;
        align-items: center;
        gap: 10px;
        padding: 14px 24px;
        background: rgba(255, 255, 255, 0.01);
        border-radius: 12px;
        border: 1px solid rgba(160, 68, 255, 0.04);
        font-size: 11px;
        color: #3d3830;
        min-width: 0;
    }

    .footer-bar a { color: #5a5348; text-decoration: none; transition: color 0.25s; }
    .footer-bar a:hover { color: #c597ff; }

    .footer-bar .api {
        font-size: 11px;
        background: rgba(255, 255, 255, 0.02);
        padding: 3px 18px;
        border-radius: 20px;
        border: 1px solid rgba(255, 255, 255, 0.03);
        transition: all 0.2s;
        word-break: break-all;
        overflow-wrap: anywhere;
        max-width: 100%;
        display: inline-block;
    }

    .footer-bar .api:hover {
        border-color: rgba(160, 68, 255, 0.08);
        background: rgba(160, 68, 255, 0.02);
    }

    .toast {
        position: fixed;
        bottom: 30px;
        left: 50%;
        transform: translateX(-50%) translateY(80px);
        background: rgba(160, 68, 255, 0.08);
        backdrop-filter: blur(12px);
        color: #f5ede4;
        padding: 10px 20px;
        border-radius: 40px;
        border: 1px solid rgba(160, 68, 255, 0.12);
        font-family: 'Lucida Console', monospace;
        font-size: 12px;
        opacity: 0;
        transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        pointer-events: none;
        z-index: 999;
        letter-spacing: 0.3px;
        box-shadow: 0 8px 40px rgba(0, 0, 0, 0.3);
        max-width: calc(100vw - 40px);
        text-align: center;
    }

    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    .breadcrumb {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 6px 12px;
        padding: 6px 0;
        font-size: 11px;
        color: #4a443a;
        min-height: 28px;
        min-width: 0;
    }

    .breadcrumb .crumb {
        color: #6a6255;
        cursor: pointer;
        transition: color 0.2s;
        border-bottom: 1px solid transparent;
        max-width: 200px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
    }

    .breadcrumb .crumb:hover {
        color: #c597ff;
        border-bottom-color: rgba(160, 68, 255, 0.2);
    }

    .breadcrumb .crumb.current {
        color: #c597ff;
        cursor: default;
        border-bottom-color: transparent;
    }

    .breadcrumb .sep { color: #3d3830; flex-shrink: 0; }

    .tx-type-badge {
        display: inline-block;
        font-size: 10px;
        padding: 1px 10px;
        border-radius: 12px;
        font-weight: 500;
        letter-spacing: 0.3px;
        margin-left: 8px;
    }

    .tx-type-badge.transparent {
        color: #8a8275;
        border: 1px solid rgba(138, 130, 117, 0.3);
        background: rgba(138, 130, 117, 0.08);
    }

    .tx-type-badge.private {
        color: #c597ff;
        border: 1px solid rgba(160, 68, 255, 0.3);
        background: rgba(160, 68, 255, 0.1);
    }

    .tx-type-badge.shielding {
        color: #ffaa44;
        border: 1px solid rgba(255, 170, 68, 0.3);
        background: rgba(255, 170, 68, 0.08);
    }

    .piv-icon {
        width: 18px;
        height: 18px;
        vertical-align: -4px;
        margin-right: 6px;
    }

    @media (max-width: 768px) {
        .app {
            padding: max(12px, env(safe-area-inset-top))
                     max(14px, env(safe-area-inset-right))
                     max(12px, env(safe-area-inset-bottom))
                     max(14px, env(safe-area-inset-left));
            gap: 12px;
        }
        .header { flex-direction: column; align-items: stretch; gap: 10px; padding: 14px 18px; }
        .brand h1 { font-size: 17px; }
        .brand img { width: 30px; height: 30px; }
        .header-right { justify-content: space-between; width: 100%; }
        .nav-links { font-size: 11px; gap: 2px 14px; }
        .stats-bar { font-size: 11px; padding: 8px 14px; gap: 4px 16px; }
        .search-section { padding: 2px 2px 2px 14px; }
        .search-section input { font-size: 16px; padding: 12px 4px; }
        .search-section .shortcuts { display: none; }
        .output-wrapper { flex: 0 0 auto; padding: 16px 18px; min-height: 260px; }
        #output { font-size: 12px; }
        #output .row .key { min-width: 70px; font-size: 11px; }
        #output .placeholder { min-height: 280px; }
        #output .placeholder .placeholder-logo img { max-width: 100px; max-height: 200px; }
        .footer-bar { flex-direction: column; align-items: flex-start; gap: 6px; padding: 12px 18px; }
        .footer-bar .api { font-size: 10px; padding: 2px 14px; }
        .breadcrumb { font-size: 10px; }
    }

    @media (max-width: 480px) {
        .app { gap: 10px; }
        .header { padding: 10px 14px; }
        .brand h1 { font-size: 15px; }
        .brand h1 small { font-size: 10px; }
        .brand img { width: 26px; height: 26px; }
        .header-right { flex-direction: column; align-items: stretch; gap: 10px; }
        .nav-links { justify-content: center; font-size: 10px; gap: 4px 10px; }
        .lang-switcher { align-self: center; }
        .stats-bar { font-size: 10px; padding: 6px 12px; gap: 3px 12px; }
        .stats-bar .value { font-size: 12px; }
        .search-section input { font-size: 16px; padding: 10px 4px; }
        .output-wrapper { padding: 12px 14px; min-height: 240px; }
        #output { font-size: 11px; line-height: 1.6; }
        #output .row { flex-direction: column; align-items: flex-start; gap: 2px 0; }
        #output .row .key { min-width: 0; font-size: 10px; text-transform: uppercase; }
        #output .row .val { font-size: 11px; }
        #output .tx-item { padding: 8px 12px; }
        #output .tx-item .txid-link { font-size: 11px; display: block; margin-bottom: 4px; }
        .tx-type-badge { margin-left: 0; display: inline-block; }
        #output .copy-btn { font-size: 11px; padding: 5px 16px; }
        #output .placeholder { min-height: 240px; gap: 10px; }
        #output .placeholder .placeholder-logo img { max-width: 80px; max-height: 160px; }
        .breadcrumb { font-size: 9px; gap: 4px 8px; }
        .breadcrumb .crumb { max-width: 120px; border: 1px solid rgba(160, 68, 255, 0.06); padding: 2px 8px; border-radius: 12px; font-size: 9px; }
        .breadcrumb .sep { display: none; }
    }

    @media (max-width: 360px) {
        .brand h1 { font-size: 13px; }
        .brand h1 small { font-size: 9px; letter-spacing: 1px; }
        .nav-links { font-size: 9px; gap: 3px 8px; }
        .breadcrumb .crumb { max-width: 90px; }
        #output .row .key { font-size: 9px; }
        #output .placeholder .placeholder-logo img { max-width: 64px; max-height: 128px; }
    }

    @media (min-width: 1920px) {
        .app { max-width: 1600px; padding: 24px 40px; }
        #output { font-size: 14px; }
        #output .row .key { min-width: 120px; }
    }
</style>
</head>
<body>

    <div class="app">

        <header class="header">
            <div class="brand">
                <img src="assets/pivx.png" alt="PIVX">
                <h1>PIVX <small data-i18n="explorer.title_short">explorador</small></h1>
            </div>
            <div class="header-right">
                <nav class="nav-links">
                    <span class="back-btn" id="backBtn" onclick="goBack()" data-i18n="explorer.back">← volver</span>
                    <a href="https://carover0.github.io/pagina/pivx-nodo.html" data-i18n="common.nav.node">[NODO]</a>
                    <a href="https://carover0.github.io/pagina/pivx-consola.html" data-i18n="common.nav.console">[CONSOLA]</a>
                    <a href="https://carover0.github.io/pagina/" data-i18n="common.nav.home">[INICIO]</a>
                </nav>
                <div class="lang-switcher" role="group" aria-label="Language">
                    <button type="button" data-lang="es" class="active">ES</button>
                    <button type="button" data-lang="en">EN</button>
                </div>
            </div>
        </header>

        <div class="stats-bar">
            <div class="stat"><span class="label" data-i18n="common.label.height">ALTURA</span><span class="value" id="stat-height">—</span></div>
            <div class="stat"><span class="label" data-i18n="common.label.connections">CONEXIONES</span><span class="value" id="stat-connections">—</span></div>
            <div class="stat"><span class="label" data-i18n="common.label.mempool">MEMPOOL</span><span class="value" id="stat-mempool">0</span><span style="color:#3d3830;font-size:11px;" data-i18n="common.unit.tx">tx</span></div>
        </div>

        <div class="breadcrumb" id="breadcrumb"></div>

        <div class="search-section">
            <span class="prompt">►</span>
            <input type="text" id="searchInput" data-i18n-placeholder="explorer.search_placeholder" placeholder="bloque · hash · txid · dirección" autofocus spellcheck="false">
            <div class="shortcuts">
                <kbd>F8</kbd> <span data-i18n="explorer.shortcut_copy_label">copiar</span>
                <kbd>F9</kbd> <span data-i18n="explorer.shortcut_clear_label">limpiar</span>
            </div>
        </div>

<div class="output-wrapper">
    <div id="output">
        <div class="placeholder">
            <div class="placeholder-logo">
                <img src="assets/piv7.png" alt="PIVX">
            </div>
            <div data-i18n="explorer.placeholder_title">explorador de bloques PIVX</div>
            <div class="sub" data-i18n="explorer.placeholder_sub">bloque · transacción · dirección</div>
        </div>
    </div>
</div>

        <footer class="footer-bar">
            <span><span data-i18n="common.footer.api">API ·</span> <a href="https://carover0.xyz/api/pivx/pivx.php?token=pivx2026" target="_blank" rel="noopener" class="api">https://carover0.xyz/api/pivx/pivx.php?token=pivx2026</a></span>
            <span style="font-size:10px;color:#2d2820;" data-i18n="common.footer.mainnet">PIVX mainnet</span>
        </footer>

    </div>

    <div class="toast" id="toast"></div>

    <script src="js/i18n-bch.js" defer></script>
    <script>
        const API_URL = "https://carover0.xyz/api/pivx/pivx.php";
        const TOKEN = "pivx2026";
        const STATUS_URL = "https://carover0.xyz/cacaX/pivx_status_X.json";
        const PIV_ICON = (function() {
            const path = window.location.pathname;
            if (path.includes('/pagina/')) return '/pagina/assets/pivx.png';
            return '/assets/pivx.png';
        })();

        let I18n = null;
        let historyStack = [];
        let currentIndex = -1;
        let lastResultHtml = null;

        function getI18n() {
            return window.FiroI18n || window.PivxI18n || window.BchI18n || null;
        }

        function t(key, fallback) {
            const i = getI18n();
            if (i && typeof i.t === 'function') {
                const v = i.t(key);
                if (v && v !== key) return v;
            }
            return fallback || key;
        }

        function formatPiv(value, extra = '') {
            const num = typeof value === 'number' ? value : parseFloat(value);
            if (isNaN(num)) return '';
            return `<img src="${PIV_ICON}" class="piv-icon" alt="">${num.toFixed(6)}${extra}`;
        }

        function pushHistory(query, label) {
            historyStack = historyStack.slice(0, currentIndex + 1);
            historyStack.push({ query: query, label: label || query });
            currentIndex = historyStack.length - 1;
            updateBackButton();
            updateBreadcrumb();
        }

        function goBack() {
            if (currentIndex > 0) {
                currentIndex--;
                const entry = historyStack[currentIndex];
                const input = document.getElementById('searchInput');
                if (input) {
                    input.value = entry.query;
                    executeSearch(entry.query);
                }
                updateBackButton();
                updateBreadcrumb();
            }
        }

        function updateBackButton() {
            const btn = document.getElementById('backBtn');
            if (!btn) return;
            if (currentIndex > 0) {
                btn.classList.add('show');
            } else {
                btn.classList.remove('show');
            }
        }

        function updateBreadcrumb() {
            const container = document.getElementById('breadcrumb');
            if (!container) return;
            if (historyStack.length === 0) {
                container.innerHTML = '';
                return;
            }

            let html = '';
            const maxDisplay = 4;
            const start = Math.max(0, historyStack.length - maxDisplay);
            const entries = historyStack.slice(start);

            if (start > 0) {
                html += `<span class="crumb" onclick="goToHistory(0)">⏪</span><span class="sep">·</span>`;
            }

            for (let i = 0; i < entries.length; i++) {
                const idx = start + i;
                const entry = entries[i];
                const isCurrent = idx === currentIndex;
                const label = entry.label.length > 30 ? entry.label.substring(0, 28) + '…' : entry.label;
                if (isCurrent) {
                    html += `<span class="crumb current">${escapeHtml(label)}</span>`;
                } else {
                    html += `<span class="crumb" onclick="goToHistory(${idx})">${escapeHtml(label)}</span>`;
                }
                if (i < entries.length - 1) {
                    html += `<span class="sep">›</span>`;
                }
            }

            container.innerHTML = html;
        }

        function goToHistory(index) {
            if (index >= 0 && index < historyStack.length && index !== currentIndex) {
                currentIndex = index;
                const entry = historyStack[index];
                const input = document.getElementById('searchInput');
                if (input) {
                    input.value = entry.query;
                    executeSearch(entry.query);
                }
                updateBackButton();
                updateBreadcrumb();
            }
        }

        function escapeHtml(text) {
            if (!text) return '';
            return String(text).replace(/[&<>]/g, function(m) {
                if (m === '&') return '&amp;';
                if (m === '<') return '&lt;';
                if (m === '>') return '&gt;';
                return m;
            });
        }

        function makeLink(text) {
            if (!text) return '';
            const encoded = encodeURIComponent(text);
            return `<span class="link" onclick="navigateTo('${encoded}')">${escapeHtml(text)}</span>`;
        }

        function navigateTo(query) {
            const decoded = decodeURIComponent(query);
            const input = document.getElementById('searchInput');
            if (input) {
                input.value = decoded;
                const label = getLabelForQuery(decoded);
                pushHistory(decoded, label);
                executeSearch(decoded);
            }
        }

        function showToast(msg) {
            const el = document.getElementById('toast');
            el.textContent = msg;
            el.classList.add('show');
            clearTimeout(el._timer);
            el._timer = setTimeout(() => el.classList.remove('show'), 1800);
        }

        function getLabelForQuery(q) {
            const s = q.trim();
            if (s.startsWith('getblock ')) return t('explorer.label_block', 'Bloque') + ' ' + s.replace('getblock ', '');
            if (s.startsWith('getrawtransaction ')) {
                const txid = s.replace('getrawtransaction ', '').replace(' 1', '');
                return 'TX ' + txid.substring(0, 16) + '…';
            }
            if (s.startsWith('validateaddress ')) {
                const addr = s.split(' ')[1];
                return t('explorer.label_address', 'Dirección') + ' ' + (addr ? addr.substring(0, 12) + '…' : '');
            }
            if (/^\d+$/.test(s)) return t('explorer.label_block', 'Bloque') + ' ' + s;
            if (/^[a-fA-F0-9]{64}$/.test(s)) return 'TX ' + s.substring(0, 16) + '…';
            return s.substring(0, 20) + (s.length > 20 ? '…' : '');
        }

        function detectSearchFromUrl() {
            const urlParams = new URLSearchParams(window.location.search);
            const queryParam = urlParams.get('q');
            if (queryParam) return queryParam;
            const path = window.location.pathname;
            const match = path.match(/\/pivx-explorer\/(.+)$/);
            if (match && match[1]) return match[1];
            return null;
        }

        function updateUrlWithSearch(parametro) {
            const basePath = window.location.origin + '/pagina';
            const newUrl = basePath + '/pivx-explorer/' + encodeURIComponent(parametro);
            window.history.replaceState({}, '', newUrl);
        }

        function getTxType(tx) {
            if (!tx) return 'unknown';

            const hasShieldedSpend = tx.vShieldSpend && tx.vShieldSpend.length > 0;
            const hasShieldedOutput = tx.vShieldOutput && tx.vShieldOutput.length > 0;
            const hasTransparentIn = tx.vin && tx.vin.length > 0;
            const hasTransparentOut = tx.vout && tx.vout.length > 0;
            const hasCoinbase = tx.vin && tx.vin.length > 0 && tx.vin[0].coinbase !== undefined;
            const hasVoutZero = tx.vout && tx.vout.length > 0 && tx.vout[0].value === 0;
            const isOnlyZeroOutput = tx.vout && tx.vout.length === 1 && tx.vout[0].value === 0;
            const isCoinStake = !hasCoinbase && hasTransparentIn && hasVoutZero && tx.vout && tx.vout.length >= 2;

            if (hasShieldedSpend || hasShieldedOutput) {
                if (hasTransparentIn && !hasTransparentOut && hasShieldedOutput && !hasShieldedSpend) {
                    return 'shielding';
                }
                if (hasShieldedSpend && !hasShieldedOutput && hasTransparentOut && !hasTransparentIn) {
                    return 'deshielding';
                }
                return 'private';
            }

            if (hasCoinbase) {
                if (isOnlyZeroOutput) return 'coinstake_dummy';
                return 'coinbase';
            }
            if (isCoinStake) return 'coinstake';

            if (hasTransparentIn || hasTransparentOut) {
                return 'transparent';
            }

            return 'unknown';
        }

        function getTxTypeLabel(type) {
            switch (type) {
                case 'private':
                    return { label: t('explorer.tx_type_private_short', 'PRIVADA'), icon: '🛡', cssClass: 'private' };
                case 'shielding':
                    return { label: 'SHIELDING', icon: '🛡', cssClass: 'shielding' };
                case 'deshielding':
                    return { label: 'DESHIELDING', icon: '🛡', cssClass: 'shielding' };
                case 'transparent':
                    return { label: t('explorer.tx_type_transparent_short', 'TRANSPARENTE'), icon: '📄', cssClass: 'transparent' };
                case 'coinstake':
                    return { label: 'COINSTAKE', icon: '⚡', cssClass: 'transparent' };
                case 'coinstake_dummy':
                    return { label: 'COINSTAKE (dummy)', icon: '⚡', cssClass: 'transparent' };
                case 'coinbase':
                    return { label: t('explorer.tag_coinbase', 'COINBASE'), icon: '⛏️', cssClass: 'transparent' };
                default:
                    return { label: t('explorer.tx_type_unknown_short', 'DESCONOCIDA'), icon: '❓', cssClass: 'transparent' };
            }
        }

        async function detectCommand(input) {
            input = input.trim();
            if (input.startsWith('getblock ') || input.startsWith('getrawtransaction ') ||
                input.startsWith('validateaddress ') || input.startsWith('getblockhash ')) {
                return input;
            }
            if (/^\d+$/.test(input)) {
                try {
                    const url = `${API_URL}?token=${TOKEN}&cmd=getblockhash ${input}`;
                    const response = await fetch(url);
                    const data = await response.json();
                    if (data.result) return `getblock ${data.result}`;
                } catch (e) {}
                return `getblock ${input}`;
            }
            if (/^[a-fA-F0-9]{64}$/.test(input)) {
                try {
                    const blockCheckUrl = `${API_URL}?token=${TOKEN}&cmd=getblock ${input}`;
                    const blockResponse = await fetch(blockCheckUrl);
                    const blockData = await blockResponse.json();
                    if (blockData.result && !blockData.error) return `getblock ${input}`;
                    return `getrawtransaction ${input} 1`;
                } catch (error) {
                    return `getrawtransaction ${input} 1`;
                }
            }
            if (input.startsWith('D') && input.length === 34) return `validateaddress ${input}`;
            if (input.startsWith('p') && input.length === 78) return `validateaddress ${input}`;
            if (input.startsWith('z') && input.length > 50) return `validateaddress ${input}`;
            return input;
        }

        async function loadNetworkStats() {
            try {
                const r = await fetch(STATUS_URL);
                const d = await r.json();
                document.getElementById('stat-height').textContent = d.height?.toLocaleString() || '---';
                document.getElementById('stat-connections').textContent = d.connections || '---';
                document.getElementById('stat-mempool').textContent = d.mempool || '0';
            } catch (e) {}
        }

        async function getVinValue(txid, voutIndex) {
            try {
                const url = `${API_URL}?token=${TOKEN}&cmd=getrawtransaction ${txid} 1`;
                const response = await fetch(url);
                const data = await response.json();
                if (data.result && data.result.vout && data.result.vout[voutIndex]) {
                    return data.result.vout[voutIndex].value;
                }
            } catch (e) {}
            return null;
        }

        function renderOutput(html) {
            document.getElementById('output').innerHTML = html;
            lastResultHtml = html;
        }

function renderPlaceholder() {
    renderOutput(`
    <div class="placeholder">
      <div class="placeholder-logo">
        <img src="assets/piv7.png" alt="PIVX">
      </div>
      <div>${t('explorer.placeholder_title', 'explorador de bloques PIVX')}</div>
      <div class="sub">${t('explorer.placeholder_sub', 'bloque · transacción · dirección')}</div>
    </div>
  `);
}
        function renderLoading() {
            renderOutput(`
            <div class="loading">
              <span class="spinner"></span>
              ${t('explorer.loading', 'consultando red…')}
            </div>
          `);
        }

        async function executeSearch(q) {
            const raw = q.trim();
            if (!raw) { renderPlaceholder(); return; }

            renderLoading();

            let cmd = raw;
            if (!cmd.startsWith('getblock') && !cmd.startsWith('getrawtransaction') &&
                !cmd.startsWith('validateaddress') && !cmd.startsWith('getblockhash')) {
                cmd = await detectCommand(raw);
                const cleanValue = cmd.replace('getblock ', '').replace('getrawtransaction ', '').replace(' 1', '')
                    .replace('validateaddress ', '').replace('getblockhash ', '');
                if (cleanValue) updateUrlWithSearch(cleanValue);
            } else {
                const cleanValue = cmd.replace('getblock ', '').replace('getrawtransaction ', '').replace(' 1', '')
                    .replace('validateaddress ', '').replace('getblockhash ', '');
                if (cleanValue) updateUrlWithSearch(cleanValue);
            }

            try {
                const r = await fetch(`${API_URL}?token=${TOKEN}&cmd=${encodeURIComponent(cmd)}`);
                const data = await r.json();

                if (data.error) {
                    renderOutput(`
                <div class="cmd-line"><span class="tag">${t('explorer.tag_not_found', '✕')}</span> ${escapeHtml(cmd)}</div>
                <div style="color:#ff756f;padding:6px 0;">${t('explorer.cmd_error', 'error')}: ${escapeHtml(JSON.stringify(data.error))}</div>
                <button class="copy-btn" onclick="copyResult()">${t('explorer.copy_result', '[ copiar ]')}</button>
              `);
                    return;
                }

                const result = data.result;
                if (!result) {
                    renderOutput(`
                <div class="cmd-line"><span class="tag">◌</span> ${escapeHtml(cmd)}</div>
                <div style="color:#3d3830;">${t('explorer.no_result', 'sin resultado')}</div>
                <button class="copy-btn" onclick="copyResult()">${t('explorer.copy_result', '[ copiar ]')}</button>
              `);
                    return;
                }

                if (cmd.includes('getblock') && result.hash) {
                    const b = result;
                    let res = `<div class="cmd-line"><span class="tag">${t('explorer.tag_block', '⧫ BLOQUE')}</span> #${b.height}</div>`;
                    res += `<div class="row"><span class="key">${t('explorer.label_hash', 'hash')}</span><span class="val">${makeLink(b.hash)}</span></div>`;
                    res += `<div class="row"><span class="key">${t('explorer.label_date', 'fecha')}</span><span class="val">${new Date(b.time*1000).toLocaleString()}</span></div>`;
                    res += `<div class="row"><span class="key">${t('explorer.label_difficulty', 'dificultad')}</span><span class="val">${b.difficulty || '---'}</span></div>`;
                    res += `<div class="row"><span class="key">${t('explorer.label_size', 'tamaño')}</span><span class="val">${b.size || 0} bytes</span></div>`;
                    if (b.previousblockhash) res += `<div class="row"><span class="key">${t('explorer.label_previous', 'anterior')}</span><span class="val">${makeLink(b.previousblockhash)}</span></div>`;
                    if (b.nextblockhash) res += `<div class="row"><span class="key">${t('explorer.label_next', 'siguiente')}</span><span class="val">${makeLink(b.nextblockhash)}</span></div>`;
                    res += `<div class="divider"></div>`;
                    res += `<div class="row"><span class="key">${t('explorer.label_transactions', 'transacciones')}</span><span class="val violet">${b.tx?.length ?? 0}</span></div>`;

                    if (b.tx && b.tx.length > 0) {
                        const txs = b.tx.slice(0, 50);
                        for (const tx of txs) {
                            const txid = typeof tx === 'object' ? tx.txid || tx : tx;
                            let txObj = typeof tx === 'object' ? tx : null;

                            let txType = 'unknown';
                            let txInfo = { label: t('explorer.tx_type_unknown_short', 'DESCONOCIDA'), icon: '❓', cssClass: 'transparent' };

                            if (txObj) {
                                txType = getTxType(txObj);
                                txInfo = getTxTypeLabel(txType);
                            } else {
                                try {
                                    const txResponse = await fetch(`${API_URL}?token=${TOKEN}&cmd=getrawtransaction ${txid} 1`);
                                    const txData = await txResponse.json();
                                    if (txData.result) {
                                        txType = getTxType(txData.result);
                                        txInfo = getTxTypeLabel(txType);
                                    }
                                } catch (e) {}
                            }

                            res += `<div class="tx-item">
                                <span class="txid-link" onclick="navigateTo('${encodeURIComponent(txid)}')">${txInfo.icon} ${escapeHtml(txid)}</span>
                                <span class="tx-type-badge ${txInfo.cssClass}">${txInfo.label}</span>
                                <div class="tx-meta">
                                    <span>${txType === 'private' ? t('explorer.tx_type_private_desc', '🔒 transacción privada (shielded)') : txType === 'shielding' ? t('explorer.tx_type_shielding_desc', '🔄 shielding: transparente → privada') : txType === 'deshielding' ? t('explorer.tx_type_deshielding_desc', '🔄 deshielding: privada → transparente') : t('explorer.tx_type_transparent_desc', '📄 transacción transparente')}</span>
                                </div>
                            </div>`;
                        }
                        if (b.tx.length > 50) res += `<div style="color:#3d3830;font-size:12px;padding:4px 0;">… y ${b.tx.length - 50} más</div>`;
                    }

                    res += `<button class="copy-btn" onclick="copyResult()">${t('explorer.copy_result', '[ copiar ]')}</button>`;
                    renderOutput(res);
                    return;
                }

                if (cmd.includes('getrawtransaction') && result.txid) {
                    const tr = result;
                    const txType = getTxType(tr);
                    const txInfo = getTxTypeLabel(txType);

                    const hasCoinbase = tr.vin && tr.vin.length > 0 && tr.vin[0].coinbase !== undefined;
                    const hasTransparentIn = tr.vin && tr.vin.length > 0;
                    const hasTransparentOut = tr.vout && tr.vout.length > 0;
                    const hasShieldedSpend = tr.vShieldSpend && tr.vShieldSpend.length > 0;
                    const hasShieldedOutput = tr.vShieldOutput && tr.vShieldOutput.length > 0;
                    const hasVoutZero = tr.vout && tr.vout.length > 0 && tr.vout[0].value === 0;
                    const isOnlyZeroOutput = tr.vout && tr.vout.length === 1 && tr.vout[0].value === 0;
                    const isCoinStake = !hasCoinbase && hasTransparentIn && hasVoutZero && tr.vout && tr.vout.length >= 2;
                    const isDummyCoinbase = hasCoinbase && isOnlyZeroOutput;
                    const isShielded = !hasTransparentIn && !hasTransparentOut && (hasShieldedSpend || hasShieldedOutput);
                    const isShielding = hasTransparentIn && !hasTransparentOut && hasShieldedOutput && !hasShieldedSpend;
                    const isDeshielding = hasShieldedSpend && !hasShieldedOutput && hasTransparentOut && !hasTransparentIn;

                    let isColdStaking = false;
                    let coldStakeOwner = null;
                    let coldStakeStaker = null;

                    if (tr.vout && tr.vout.length > 0) {
                        tr.vout.forEach(vout => {
                            if (vout.scriptPubKey && vout.scriptPubKey.type === 'coldstake') {
                                isColdStaking = true;
                                if (vout.scriptPubKey.addresses && vout.scriptPubKey.addresses.length >= 2) {
                                    coldStakeStaker = vout.scriptPubKey.addresses[0];
                                    coldStakeOwner = vout.scriptPubKey.addresses[1];
                                }
                            }
                        });
                    }

                    const isSelfDelegation = isColdStaking && coldStakeOwner && coldStakeStaker &&
                        coldStakeOwner === coldStakeStaker;

                    let totalIn = 0;
                    let inputValues = [];

                    if (tr.vin && tr.vin.length > 0 && !hasCoinbase) {
                        const vinPromises = tr.vin.map(async (vin, index) => {
                            const value = await getVinValue(vin.txid, vin.vout);
                            return { index, value };
                        });
                        const results = await Promise.all(vinPromises);
                        results.forEach(r => {
                            if (r.value !== null) {
                                totalIn += r.value;
                                inputValues[r.index] = r.value;
                            }
                        });
                    }

                    let totalOut = 0;
                    if (tr.vout) {
                        tr.vout.forEach(vout => {
                            totalOut += vout.value || 0;
                        });
                    }

                    let tipoLabel = `${txInfo.icon} ${txInfo.label}`;
                    if (txType === 'private') tipoLabel = t('explorer.tx_type_private', '🛡 TRANSACCIÓN PRIVADA (SHIELDED)');
                    else if (txType === 'shielding') tipoLabel = t('explorer.tx_type_shielding', '🛡 SHIELDING (TRANSPARENTE → PRIVADA)');
                    else if (txType === 'deshielding') tipoLabel = t('explorer.tx_type_deshielding', '🛡 DESHIELDING (PRIVADA → TRANSPARENTE)');
                    else if (txType === 'coinstake') tipoLabel = t('explorer.tx_type_coinstake', '⚡️ COINSTAKE (GENERACIÓN DE BLOQUE PoS)');
                    else if (txType === 'transparent') tipoLabel = t('explorer.tx_type_transparent', '📄 TRANSACCIÓN TRANSPARENTE');

                    let res = `<div class="cmd-line"><span class="tag">${tipoLabel}</span> ${makeLink(tr.txid)}</div>`;
                    res += `<div class="row"><span class="key">${t('explorer.label_txid', 'TXID')}</span><span class="val">${makeLink(tr.txid)}</span></div>`;
                    res += `<div class="row"><span class="key">${t('explorer.label_block', 'bloque')}</span><span class="val">${tr.blockheight || tr.height ? makeLink(String(tr.blockheight || tr.height)) : t('explorer.label_unconfirmed', 'no confirmada')}</span></div>`;
                    res += `<div class="row"><span class="key">${t('explorer.label_confirmations', 'confirmaciones')}</span><span class="val">${tr.confirmations || 0}</span></div>`;
                    if (tr.time || tr.blocktime) {
                        const ts = tr.time || tr.blocktime;
                        res += `<div class="row"><span class="key">${t('explorer.label_date', 'fecha')}</span><span class="val">${new Date(ts*1000).toLocaleString()}</span></div>`;
                    }
                    if (tr.size) res += `<div class="row"><span class="key">${t('explorer.label_size', 'tamaño')}</span><span class="val">${tr.size} bytes</span></div>`;
                    if (tr.version) res += `<div class="row"><span class="key">${t('explorer.label_version', 'versión')}</span><span class="val">${tr.version}</span></div>`;
                    if (tr.expiryheight) res += `<div class="row"><span class="key">${t('explorer.label_expiry', 'expira')}</span><span class="val">${t('explorer.label_block_prefix', 'Bloque')} ${tr.expiryheight}</span></div>`;

                    res += `<div class="divider"></div>`;

                    if (tr.vin && tr.vin.length > 0) {
                        res += `<div class="row"><span class="key">${t('explorer.section_inputs', '▶ ENTRADAS')}</span><span class="val violet">${tr.vin.length}</span></div>`;
                        tr.vin.forEach((vin, i) => {
                            if (vin.coinbase !== undefined) {
                                if (isDummyCoinbase) {
                                    res += `<div class="row" style="padding-left:14px;font-size:12px;color:#6a6255;"><span class="key" style="min-width:24px;">#${i}</span><span class="val" style="color:#5a5348;">${t('explorer.tag_coinbase', 'COINBASE')} (dummy - PoS)</span></div>`;
                                } else {
                                    res += `<div class="row" style="padding-left:14px;font-size:12px;color:#6a6255;"><span class="key" style="min-width:24px;">#${i}</span><span class="val" style="color:#c597ff;">${t('explorer.tag_coinbase', 'COINBASE')}</span></div>`;
                                }
                            } else if (vin.txid) {
                                const valorInput = inputValues[i] !== undefined ? inputValues[i] : null;
                                let valorStr = '';
                                if (valorInput) {
                                    valorStr = formatPiv(valorInput);
                                    if (isCoinStake) valorStr += ` (stake activo)`;
                                    else if (isColdStaking) valorStr += ` (fondos a delegar)`;
                                    else if (isShielding) valorStr += ` (a blindar)`;
                                }
                                res += `<div class="row" style="padding-left:14px;font-size:12px;color:#6a6255;"><span class="key" style="min-width:24px;">#${i}</span><span class="val" style="font-size:12px;">${makeLink(vin.txid)}:${vin.vout}</span>${valorStr ? `<span class="val violet">${valorStr}</span>` : ''}</div>`;
                            }
                        });
                        if (totalIn > 0) {
                            res += `<div class="row" style="margin-top:2px;"><span class="key">${t('explorer.label_total_in', 'total entrada')}</span><span class="val violet">${formatPiv(totalIn)}</span></div>`;
                        }
                    }

                    if (tr.vout && tr.vout.length > 0) {
                        res += `<div class="divider"></div>`;
                        res += `<div class="row"><span class="key">${t('explorer.section_outputs', '◀ SALIDAS')}</span><span class="val violet">${tr.vout.length}</span></div>`;

                        tr.vout.forEach((vout, i) => {
                            let addr = '';
                            let extraInfo = '';

                            if (vout.scriptPubKey?.addresses?.[0]) {
                                addr = vout.scriptPubKey.addresses[0];
                                if (vout.scriptPubKey.addresses.length > 1) {
                                    extraInfo = ` (multi-address)`;
                                }
                            } else if (vout.scriptPubKey?.address) {
                                addr = vout.scriptPubKey.address;
                            }

                            let tipo = '';
                            let addrDisplay = '';

                            if (isDummyCoinbase) {
                                if (vout.value === 0) {
                                    tipo = ' [salida nula - coinbase PoS]';
                                }
                            } else if (isCoinStake) {
                                if (i === 0 && vout.value === 0) {
                                    tipo = ' [coinstake marker]';
                                } else if (i === 1 && vout.value > 0) {
                                    tipo = ' ← stake (parte 1/2)';
                                } else if (i === 2 && vout.value > 0) {
                                    tipo = ' ← stake (parte 2/2)';
                                } else if (i >= 3 && vout.value > 0) {
                                    tipo = ' [recompensa]';
                                }
                            } else if (isColdStaking) {
                                if (vout.scriptPubKey && vout.scriptPubKey.type === 'coldstake') {
                                    tipo = ` [${t('explorer.label_coldstake_contract', 'CONTRATO COLD STAKING')}]`;
                                    if (coldStakeStaker && coldStakeOwner) {
                                        const relacion = isSelfDelegation ? t('explorer.label_self_delegation', ' (auto-delegación)') : t('explorer.label_delegated', ' (delegado a tercero)');
                                        extraInfo = `\n       ${t('explorer.label_owner', 'dueño')}: ${coldStakeOwner}\n       staker: ${coldStakeStaker}${relacion}`;
                                    }
                                } else {
                                    if (vout.value === 0) {
                                        tipo = ' [salida nula]';
                                    } else if (tr.vout.length > 1 && vout.value === Math.max(...tr.vout.map(v => v.value || 0))) {
                                        tipo = ` ← ${t('explorer.label_recipient', 'destinatario')} (pago)`;
                                    } else if (tr.vout.length > 1 && vout.value < Math.max(...tr.vout.map(v => v.value || 0))) {
                                        tipo = ` [${t('explorer.label_change', 'cambio')}]`;
                                    }
                                }
                            } else {
                                if (vout.value === 0) {
                                    tipo = ' [salida nula]';
                                } else if (tr.vout.length > 1 && vout.value === Math.max(...tr.vout.map(v => v.value || 0))) {
                                    tipo = ` ← ${t('explorer.label_recipient', 'destinatario')} (pago)`;
                                } else if (tr.vout.length > 1 && vout.value < Math.max(...tr.vout.map(v => v.value || 0))) {
                                    tipo = ` [${t('explorer.label_change', 'cambio')}]`;
                                }
                            }

                            if (addr) {
                                addrDisplay = ` → ${makeLink(addr)}`;
                            }

                            res += `<div class="row" style="padding-left:14px;font-size:12px;color:#6a6255;"><span class="key" style="min-width:24px;">#${i}</span><span class="val violet">${formatPiv(vout.value)}</span>${addrDisplay}${tipo}${extraInfo}</div>`;
                        });

                        if (totalOut > 0) {
                            if (isColdStaking && !isCoinStake) {
                                res += `<div class="row" style="margin-top:2px;"><span class="key">${t('explorer.label_total_delegated', 'total delegado')}</span><span class="val violet">${formatPiv(totalOut)}</span></div>`;
                            } else if (isCoinStake) {
                                res += `<div class="row" style="margin-top:2px;"><span class="key">${t('explorer.label_total_generated', 'total generado')}</span><span class="val violet">${formatPiv(totalOut)}</span></div>`;
                            } else {
                                res += `<div class="row" style="margin-top:2px;"><span class="key">${t('explorer.label_total_out', 'total salida')}</span><span class="val violet">${formatPiv(totalOut)}</span></div>`;
                            }
                        }
                    }

                    if (hasShieldedSpend || hasShieldedOutput) {
                        res += `<div class="divider"></div>`;
                        res += `<div class="row"><span class="key">${t('explorer.tx_type_private', '🛡 TRANSACCIÓN PRIVADA (SHIELDED)')}</span></div>`;

                        if (hasShieldedSpend) {
                            res += `<div class="row" style="padding-left:14px;font-size:12px;color:#6a6255;"><span class="key" style="min-width:60px;">${t('explorer.label_shielded_spends', 'gastos privados')}</span><span class="val violet">${tr.vShieldSpend.length}</span></div>`;
                            tr.vShieldSpend.forEach((spend, i) => {
                                res += `<div class="row" style="padding-left:28px;font-size:12px;color:#5a5348;"><span class="key" style="min-width:40px;">#${i}</span><span class="val">nullifier: ${spend.nullifier}</span></div>`;
                            });
                        }
                        if (hasShieldedOutput) {
                            res += `<div class="row" style="padding-left:14px;font-size:12px;color:#6a6255;"><span class="key" style="min-width:60px;">${t('explorer.label_shielded_outputs', 'salidas privadas')}</span><span class="val violet">${tr.vShieldOutput.length}</span></div>`;
                        }
                        if (tr.valueBalance !== undefined) {
                            const balancePiv = parseFloat(tr.valueBalance);
                            res += `<div class="row" style="padding-left:14px;font-size:12px;color:#6a6255;"><span class="key" style="min-width:60px;">valueBalance</span><span class="val violet">${formatPiv(balancePiv)}</span></div>`;
                        }
                        if (tr.bindingSig) {
                            res += `<div class="row" style="padding-left:14px;font-size:12px;color:#6a6255;"><span class="key" style="min-width:60px;">bindingSig</span><span class="val mono">${tr.bindingSig.substring(0, 64)}…</span></div>`;
                        }
                        res += `<div class="row" style="padding-left:14px;font-size:12px;color:#5a5348;"><span class="key" style="min-width:60px;">${t('explorer.label_privacy', '🔒 privacidad')}</span><span class="val">${t('explorer.label_hidden_amounts', 'montos ocultos')}</span></div>`;
                    }

                    res += `<div class="divider"></div>`;
                    res += `<div class="row"><span class="key">${t('explorer.label_summary', 'RESUMEN')}</span></div>`;
                    res += `<div class="row" style="padding-left:14px;font-size:12px;color:#6a6255;"><span class="key" style="min-width:60px;">${t('explorer.label_inputs_short', 'entradas')}</span><span class="val">${tr.vin?.length || 0}</span></div>`;
                    res += `<div class="row" style="padding-left:14px;font-size:12px;color:#6a6255;"><span class="key" style="min-width:60px;">${t('explorer.label_outputs_short', 'salidas')}</span><span class="val">${tr.vout?.length || 0}</span></div>`;
                    if (isShielded || hasShieldedSpend || hasShieldedOutput) {
                        res += `<div class="row" style="padding-left:14px;font-size:12px;color:#6a6255;"><span class="key" style="min-width:60px;">${t('explorer.label_private_activity', 'actividad privada')}</span><span class="val violet">${t('explorer.ok_validate', 'sí')} 🛡</span></div>`;
                    }

                    if (isDummyCoinbase) {
                        res += `<div class="row" style="padding-left:14px;font-size:12px;color:#6a6255;"><span class="key" style="min-width:60px;">${t('explorer.label_type', 'tipo')}</span><span class="val">coinbase (bloque PoS - sin recompensa)</span></div>`;
                    } else if (hasCoinbase && !isDummyCoinbase) {
                        res += `<div class="row" style="padding-left:14px;font-size:12px;color:#6a6255;"><span class="key" style="min-width:60px;">${t('explorer.label_type', 'tipo')}</span><span class="val">coinbase (PoW - no aplica en PIVX)</span></div>`;
                    } else if (isCoinStake) {
                        res += `<div class="row" style="padding-left:14px;font-size:12px;color:#6a6255;"><span class="key" style="min-width:60px;">${t('explorer.label_type', 'tipo')}</span><span class="val violet">coinstake (PoS)</span></div>`;
                        res += `<div class="row" style="padding-left:14px;font-size:12px;color:#6a6255;"><span class="key" style="min-width:60px;">${t('explorer.label_mode', 'modo')}</span><span class="val">${isColdStaking ? t('explorer.label_cold_staking', 'cold staking') : t('explorer.label_hot_staking', 'hot staking')}</span></div>`;
                        if (totalIn > 0 && tr.vout && tr.vout.length >= 2) {
                            const stakeFinal = tr.vout[1]?.value || 0;
                            const recompensaDistribuida = tr.vout.slice(2).reduce((sum, v) => sum + (v.value || 0), 0);
                            const recompensaTotal = totalOut - totalIn;
                            const recompensaReinvertida = stakeFinal - totalIn;
                            res += `<div class="row" style="padding-left:14px;font-size:12px;color:#5a5348;"><span class="key" style="min-width:60px;">${t('explorer.label_stake_prev', 'stake activo previo')}</span><span class="val violet">${formatPiv(totalIn)}</span></div>`;
                            res += `<div class="row" style="padding-left:14px;font-size:12px;color:#5a5348;"><span class="key" style="min-width:60px;">${t('explorer.label_stake_final', 'stake final')}</span><span class="val violet">${formatPiv(stakeFinal)}</span></div>`;
                            res += `<div class="row" style="padding-left:14px;font-size:12px;color:#5a5348;"><span class="key" style="min-width:60px;">${t('explorer.label_reward_total', 'recompensa total')}</span><span class="val violet">+${formatPiv(recompensaTotal)}</span></div>`;
                            res += `<div class="row" style="padding-left:28px;font-size:12px;color:#5a5348;"><span class="key" style="min-width:40px;">${t('explorer.label_reward_reinvested', 'reinvertida')}</span><span class="val violet">+${formatPiv(recompensaReinvertida)}</span></div>`;
                            res += `<div class="row" style="padding-left:28px;font-size:12px;color:#5a5348;"><span class="key" style="min-width:40px;">${t('explorer.label_reward_distributed', 'distribuida')}</span><span class="val violet">${formatPiv(recompensaDistribuida)}</span></div>`;
                        }
                        res += `<div class="row" style="padding-left:14px;font-size:12px;color:#6a6255;"><span class="key" style="min-width:60px;">${t('explorer.label_fee', '■ FEE')}</span><span class="val">0 PIV (generación de bloques)</span></div>`;
                    } else if (isShielded) {
                        res += `<div class="row" style="padding-left:14px;font-size:12px;color:#6a6255;"><span class="key" style="min-width:60px;">${t('explorer.label_type', 'tipo')}</span><span class="val violet">${t('explorer.tx_type_private_short', 'transacción privada')} (shielded)</span></div>`;
                        res += `<div class="row" style="padding-left:14px;font-size:12px;color:#6a6255;"><span class="key" style="min-width:60px;">${t('explorer.label_privacy', 'privacidad')}</span><span class="val">🔒 ${t('explorer.label_privacy_total', 'total (datos ocultos)')}</span></div>`;
                        if (tr.valueBalance) {
                            const fee = Math.abs(parseFloat(tr.valueBalance));
                            res += `<div class="row" style="padding-left:14px;font-size:12px;color:#6a6255;"><span class="key" style="min-width:60px;">${t('explorer.label_fee', '■ FEE')}</span><span class="val violet">${formatPiv(fee)}</span></div>`;
                        }
                    } else if (isShielding) {
                        res += `<div class="row" style="padding-left:14px;font-size:12px;color:#6a6255;"><span class="key" style="min-width:60px;">${t('explorer.label_type', 'tipo')}</span><span class="val violet">shielding (transparente → privada)</span></div>`;
                        if (totalIn > 0) {
                            res += `<div class="row" style="padding-left:14px;font-size:12px;color:#6a6255;"><span class="key" style="min-width:60px;">${t('explorer.label_shielded_funds', 'fondos blindados')}</span><span class="val violet">${formatPiv(totalIn)}</span></div>`;
                        }
                    } else if (isDeshielding) {
                        res += `<div class="row" style="padding-left:14px;font-size:12px;color:#6a6255;"><span class="key" style="min-width:60px;">${t('explorer.label_type', 'tipo')}</span><span class="val violet">deshielding (privada → transparente)</span></div>`;
                        if (totalOut > 0) {
                            res += `<div class="row" style="padding-left:14px;font-size:12px;color:#6a6255;"><span class="key" style="min-width:60px;">${t('explorer.label_visible_funds', 'fondos visibles')}</span><span class="val violet">${formatPiv(totalOut)}</span></div>`;
                        }
                    } else if (isColdStaking && !isCoinStake) {
                        res += `<div class="row" style="padding-left:14px;font-size:12px;color:#6a6255;"><span class="key" style="min-width:60px;">${t('explorer.label_type', 'tipo')}</span><span class="val violet">${t('explorer.label_cold_staking_delegation', 'delegación a cold staking')}</span></div>`;
                        if (coldStakeOwner && coldStakeStaker) {
                            const relacion = isSelfDelegation ? t('explorer.label_self_delegation_short', 'auto-delegación') : t('explorer.label_delegated_short', 'delegado a tercero');
                            res += `<div class="row" style="padding-left:14px;font-size:12px;color:#5a5348;"><span class="key" style="min-width:60px;">${t('explorer.label_owner', 'dueño')}</span><span class="val">${coldStakeOwner}</span></div>`;
                            res += `<div class="row" style="padding-left:14px;font-size:12px;color:#5a5348;"><span class="key" style="min-width:60px;">staker</span><span class="val">${coldStakeStaker}</span></div>`;
                            res += `<div class="row" style="padding-left:14px;font-size:12px;color:#5a5348;"><span class="key" style="min-width:60px;">${t('explorer.label_relation', 'relación')}</span><span class="val">${relacion}</span></div>`;
                        }
                    }

                    res += `<button class="copy-btn" onclick="copyResult()">${t('explorer.copy_result', '[ copiar ]')}</button>`;
                    renderOutput(res);
                    return;
                }

                if (cmd.includes('validateaddress') && result) {
                    const v = result;
                    const direccion = v.address || cmd.split(' ')[1] || t('common.state.unknown', 'desconocida');
                    let emoji = '🔓';
                    let tipoDir = t('explorer.tx_type_transparent_short', 'transparente');
                    if (direccion.startsWith('p') || direccion.startsWith('z')) {
                        emoji = '🔒';
                        tipoDir = t('explorer.tx_type_private_short', 'privada') + ' (shielded)';
                    }
                    let res = `<div class="cmd-line"><span class="tag">${t('explorer.tag_address', '◈ DIRECCIÓN')}</span> ${makeLink(direccion)} ${emoji}</div>`;
                    res += `<div class="row"><span class="key">${t('explorer.label_address', 'dirección')}</span><span class="val">${makeLink(direccion)}</span></div>`;
                    res += `<div class="row"><span class="key">${t('explorer.label_validate', 'válida')}</span><span class="val">${v.isvalid ? '✅ ' + t('explorer.ok_validate', 'sí') : '❌ ' + t('explorer.error_validate', 'no')}</span></div>`;
                    if (v.isvalid) {
                        res += `<div class="row"><span class="key">${t('explorer.label_type', 'tipo')}</span><span class="val">${tipoDir}</span></div>`;
                        if (v.ismine !== undefined) {
                            res += `<div class="row"><span class="key">${t('explorer.is_mine', 'pertenece a wallet')}</span><span class="val">${v.ismine ? t('explorer.ok_validate', 'sí') : t('explorer.error_validate', 'no')}</span></div>`;
                        }
                        if (v.isstaking !== undefined) {
                            res += `<div class="row"><span class="key">staking</span><span class="val">${v.isstaking ? t('explorer.ok_validate', 'sí') : t('explorer.error_validate', 'no')}</span></div>`;
                        }
                    }

                    res += `<button class="copy-btn" onclick="copyResult()">${t('explorer.copy_result', '[ copiar ]')}</button>`;
                    renderOutput(res);
                    return;
                }

                let res = `<div class="cmd-line"><span class="tag">◌</span> ${escapeHtml(cmd)}</div>`;
                res += `<pre style="font-family:'Lucida Console',monospace;font-size:12px;color:#6a6255;background:rgba(0,0,0,0.2);padding:16px;border-radius:10px;overflow-x:auto;white-space:pre-wrap;word-break:break-all;">${escapeHtml(JSON.stringify(result, null, 2))}</pre>`;
                res += `<button class="copy-btn" onclick="copyResult()">${t('explorer.copy_result', '[ copiar ]')}</button>`;
                renderOutput(res);

            } catch (e) {
                renderOutput(`
              <div class="cmd-line"><span class="tag">${t('explorer.tag_not_found', '✕')}</span> ${t('explorer.cmd_error', 'error')}</div>
              <div style="color:#ff756f;padding:6px 0;">${escapeHtml(e.message)}</div>
              <button class="copy-btn" onclick="copyResult()">${t('explorer.copy_result', '[ copiar ]')}</button>
            `);
            }

            document.getElementById('searchInput').value = '';
        }

        window.copyResult = function() {
            const outputPre = document.querySelector('#output pre:last-of-type');
            if (outputPre) {
                navigator.clipboard.writeText(outputPre.innerText).then(() => {
                    const prompt = document.querySelector('.prompt');
                    if (prompt) {
                        prompt.textContent = '✓';
                        setTimeout(() => prompt.textContent = '►', 1000);
                    }
                    showToast(t('common.copy.ok', '✓ copiado'));
                });
            } else {
                const out = document.getElementById('output');
                const text = out.textContent;
                if (text) {
                    navigator.clipboard.writeText(text).then(() => {
                        showToast(t('common.copy.ok', '✓ copiado'));
                    });
                }
            }
        };

        window.navigateTo = navigateTo;
        window.executeSearch = executeSearch;
        window.goBack = goBack;
        window.goToHistory = goToHistory;

        document.addEventListener('keydown', function(e) {
            if (e.key === 'F8') {
                e.preventDefault();
                window.copyResult();
            }
            if (e.key === 'F9') {
                e.preventDefault();
                document.getElementById('searchInput').value = '';
                renderPlaceholder();
                const prompt = document.querySelector('.prompt');
                if (prompt) {
                    prompt.textContent = '♥';
                    setTimeout(() => prompt.textContent = '►', 1000);
                }
                const baseUrl = window.location.origin + '/pagina/pivx-explorer';
                window.history.replaceState({}, '', baseUrl);
                historyStack = [];
                currentIndex = -1;
                updateBackButton();
                updateBreadcrumb();
                loadNetworkStats();
            }
            if (e.key === 'ArrowLeft' && (e.altKey || e.metaKey)) {
                e.preventDefault();
                goBack();
            }
        });

        const searchInput = document.getElementById('searchInput');
        searchInput.addEventListener('keydown', async (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                const rawInput = searchInput.value.trim();
                if (rawInput) {
                    const cmd = await detectCommand(rawInput);
                    const label = getLabelForQuery(cmd);
                    pushHistory(cmd, label);
                    const cleanValue = cmd.replace('getblock ', '').replace('getrawtransaction ', '').replace(' 1', '')
                        .replace('validateaddress ', '').replace('getblockhash ', '');
                    updateUrlWithSearch(cleanValue);
                    executeSearch(cmd);
                }
            }
        });
        searchInput.addEventListener('paste', () => {
            setTimeout(async () => {
                const input = searchInput.value;
                const cmd = await detectCommand(input);
                if (cmd !== input) searchInput.value = cmd;
            }, 10);
        });

        (async function() {
            const searchParam = detectSearchFromUrl();
            if (searchParam) {
                window.addEventListener('load', async () => {
                    setTimeout(async () => {
                        const input = document.getElementById('searchInput');
                        if (input) {
                            const cmd = await detectCommand(searchParam);
                            input.value = cmd;
                            const label = getLabelForQuery(cmd);
                            pushHistory(cmd, label);
                            executeSearch(cmd);
                        }
                    }, 500);
                });
            }
        })();

        window.onLangChange = function() {
            if (lastResultHtml) {
                const outputEl = document.getElementById('output');
                if (outputEl && historyStack.length > 0) {
                    const currentEntry = historyStack[currentIndex];
                    if (currentEntry) {
                        executeSearch(currentEntry.query);
                    }
                }
            } else {
                const outputEl = document.getElementById('output');
                if (outputEl) {
                    const placeholder = outputEl.querySelector('.placeholder');
                    if (placeholder) {
                        renderPlaceholder();
                    }
                }
            }
        };

        function initI18n() {
            I18n = getI18n();
            if (!I18n) {
                console.error('❌ i18n no cargó. Revisa que js/i18n-bch.js termine con: window.FiroI18n = BchI18n;');
                return false;
            }
            if (typeof I18n.init !== 'function') {
                console.error('❌ I18n existe pero no tiene init()');
                return false;
            }
            I18n.init();
            console.log('✅ i18n listo. Idioma:', I18n.getLang ? I18n.getLang() : '?');
            return true;
        }

        document.addEventListener('DOMContentLoaded', function() {
            initI18n();
            loadNetworkStats();
            setInterval(loadNetworkStats, 30000);
        });
    </script>

</body>
</html>
