<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zcash · Bloques en Vivo</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            background: #0a080c;
            background-image: radial-gradient(ellipse at 30% 40%, rgba(221,157,52,0.06) 0%, transparent 60%),
                              radial-gradient(ellipse at 70% 80%, rgba(221,157,52,0.04) 0%, transparent 50%),
                              linear-gradient(160deg, #0a080c 0%, #161114 50%, #0d0b10 100%);
            font-family: 'Lucida Console', 'Courier New', monospace;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .app { width: 100%; max-width: 1200px; }
        
        .header {
            display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between;
            padding: 16px 24px; background: rgba(255,255,255,0.02); border-radius: 14px;
            border: 1px solid rgba(221,157,52,0.08); backdrop-filter: blur(8px); margin-bottom: 24px;
        }
        .brand { display: flex; align-items: center; gap: 14px; }
        .brand img { width: 38px; height: 38px; filter: drop-shadow(0 0 16px rgba(221,157,52,0.25)); }
        .brand h1 { font-size: 21px; font-weight: 400; color: #f5e6c8; }
        .brand h1 small { font-size: 12px; color: #6a6255; }
        
        .nav-links {
            display: flex;
            flex-wrap: wrap;
            gap: 4px 18px;
            font-size: 12px;
            letter-spacing: 0.3px;
            margin-left: auto;
        }
        .nav-links a {
            color: #6a6255;
            text-decoration: none;
            transition: all 0.25s;
            padding: 4px 0;
            border-bottom: 2px solid transparent;
        }
        .nav-links a:hover {
            color: #dd9d34;
            border-bottom-color: #dd9d34;
        }
        
        .stats-panel {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 14px;
            padding: 16px 20px; background: rgba(255,255,255,0.015); border-radius: 14px;
            border: 1px solid rgba(221,157,52,0.04); margin-bottom: 24px;
        }
        .stat-item .label { font-size: 8px; text-transform: uppercase; color: #4a443a; }
        .stat-item .value { font-size: 15px; font-weight: 500; color: #f5ede4; }
        .stat-item .value.gold { color: #dd9d34; }
        .stat-item .value.mono { font-size: 11px; color: #8a8275; word-break: break-all; }
        .stat-item .sub { font-size: 10px; color: #5a5348; }
        
        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 24px;
            min-height: 300px;
        }
        
        .block-card {
            background: rgba(255,255,255,0.02);
            border-radius: 16px;
            padding: 18px 20px 16px;
            border: 1px solid rgba(221,157,52,0.06);
            backdrop-filter: blur(4px);
            transition: all 0.3s ease;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
            cursor: pointer;
            text-decoration: none;
            color: inherit;
            display: block;
        }
        .block-card:hover {
            border-color: rgba(221,157,52,0.3);
            transform: translateY(-4px);
            box-shadow: 0 8px 40px rgba(221,157,52,0.15);
            background: rgba(255,255,255,0.05);
        }
        
        .block-card.new-block {
            animation: slideIn 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        }
        @keyframes slideIn {
            0% { transform: translateY(-20px); opacity: 0; }
            100% { transform: translateY(0); opacity: 1; }
        }
        
        .block-top {
            display: flex; justify-content: space-between; align-items: baseline;
            border-bottom: 1px solid rgba(221,157,52,0.05); padding-bottom: 8px; margin-bottom: 10px;
        }
        .block-height { font-size: 18px; font-weight: 600; color: #f5ede4; }
        .block-height small { font-size: 11px; color: #6a6255; font-weight: 300; margin-left: 6px; }
        .block-time { font-size: 11px; color: #6a6255; background: rgba(255,255,255,0.03); padding: 2px 12px; border-radius: 20px; border: 1px solid rgba(221,157,52,0.04); }
        .block-row { display: flex; justify-content: space-between; align-items: center; padding: 4px 0; font-size: 12px; }
        .block-row .label { color: #4a443a; font-size: 9px; text-transform: uppercase; }
        .block-row .value { color: #ece8e0; font-weight: 500; }
        .block-row .value.gold { color: #dd9d34; }
        .block-row .value.mono { font-size: 10px; color: #8a8275; }
        .block-footer {
            margin-top: 10px; padding-top: 8px; border-top: 1px solid rgba(221,157,52,0.04);
            display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 6px;
        }
        .miner-tag {
            background: rgba(221,157,52,0.06); padding: 2px 12px; border-radius: 20px;
            font-size: 9px; color: #dd9d34; border: 1px solid rgba(221,157,52,0.04);
            word-break: break-all; max-width: 200px;
        }
        .block-hint { font-size: 9px; color: #4a443a; }
        .error-msg { color: #ff756f; padding: 20px; text-align: center; background: rgba(255,0,0,0.05); border-radius: 12px; border: 1px solid rgba(255,0,0,0.1); }
        
        .footer { display: flex; flex-wrap: wrap; justify-content: flex-end; padding-top: 14px; border-top: 1px solid rgba(221,157,52,0.06); font-size: 10px; color: #4a443a; }
        .footer a { color: #6a6255; text-decoration: none; border-bottom: 1px solid transparent; transition: 0.2s; cursor: pointer; }
        .footer a:hover { color: #dd9d34; border-bottom-color: rgba(221,157,52,0.15); }
        .footer-links { display: flex; gap: 16px; }
        
        @media (max-width: 700px) { 
            .header { flex-direction: column; align-items: stretch; gap: 10px; }
            .cards-grid { grid-template-columns: 1fr; } 
            .stats-panel { grid-template-columns: 1fr 1fr; }
            .nav-links { font-size: 11px; gap: 2px 14px; justify-content: center; margin-left: 0; }
        }
    </style>
</head>
<body>
<div class="app">
    <header class="header">
        <div class="brand">
            <img src="assets/zcash.png" alt="Zcash" onerror="this.style.display='none'">
            <h1>Zcash <small>bloques en vivo</small></h1>
        </div>
        <nav class="nav-links">
            <a href="https://carover0.github.io/pagina/zec-estadisticas.html">[ESTADÍSTICAS]</a>
            <a href="https://carover0.github.io/pagina/zec-nodo.html">[NODO]</a>
            <a href="https://carover0.github.io/pagina/zec-explorer.html">[EXPLORADOR]</a>
            <a href="https://carover0.github.io/pagina/zec-consola.html">[CONSOLA]</a>
            <a href="https://carover0.github.io/pagina/zec-servidores.html">[SERVIDORES]</a>
            <a href="https://carover0.github.io/pagina/">[INICIO]</a>
        </nav>
    </header>

    <div class="stats-panel" id="statsPanel">
        <div class="stat-item"><div class="label">⛏️ Dificultad</div><div class="value gold" id="statDiff">—</div><div class="sub" id="statHeight">Bloque #---</div></div>
        <div class="stat-item"><div class="label">📦 Mempool</div><div class="value" id="statMempool">—</div><div class="sub">transacciones pendientes</div></div>
        <div class="stat-item"><div class="label">🔗 Último bloque</div><div class="value mono" id="statBestBlock">—</div><div class="sub" id="statBlockTime">actualizando...</div></div>
        <div class="stat-item"><div class="label">💰 Recompensa</div><div class="value gold" id="statReward">1.5625 ZEC</div><div class="sub">por bloque</div></div>
    </div>

    <div class="cards-grid" id="blockContainer">
        <div class="error-msg">⏳ Cargando bloques desde tu nodo...</div>
    </div>

    <footer class="footer">
        <div class="footer-links">
            <a href="#" onclick="refreshData(); return false;">↻ Actualizar</a>
        </div>
    </footer>
</div>

<script>
const VPS_IP = '45.67.217.147';  
const API_URL = `http://${VPS_IP}/api/zec/rpc.php?token=zec2026&cmd=getrecentblocks&limit=8`;

const REWARD = '1.5625 ZEC';

let previousBlocks = [];
let currentHeight = 0;



function getExplorerLink(hash) {
    return `https://carover0.github.io/pagina/zec-explorer/${hash}`;
}

function formatMiner(miner) {
    if (!miner || miner === 'Desconocido') return 'Desconocido';
    if (miner.length > 20) {
        return miner.substring(0, 10) + '...' + miner.substring(miner.length - 6);
    }
    return miner;
}

function formatHash(hash) {
    if (!hash || hash.length < 20) return hash || '—';
    return hash.substring(0, 10) + '…' + hash.substring(hash.length - 10);
}

function createBlockCard(block, isNew = false) {
    const card = document.createElement('a');
    card.className = 'block-card' + (isNew ? ' new-block' : '');
    card.href = getExplorerLink(block.hash);
    card.target = '_blank';
    card.rel = 'noopener noreferrer';
    
    const minerDisplay = formatMiner(block.miner);
    const timeDisplay = block.time || new Date().toLocaleTimeString();
    
    card.innerHTML = `
        <div class="block-top">
            <span class="block-height">#${block.height.toLocaleString()} <small>ZEC</small></span>
            <span class="block-time">${timeDisplay}</span>
        </div>
        <div class="block-row">
            <span class="label">Minero</span>
            <span class="value gold" style="font-size:10px;word-break:break-all;max-width:180px;text-align:right;">${minerDisplay}</span>
        </div>
        <div class="block-row">
            <span class="label">Transacciones</span>
            <span class="value">${block.tx_count || 0} <span style="color:#5a5348;font-size:10px;">TX</span></span>
        </div>
        <div class="block-row">
            <span class="label">Tamaño</span>
            <span class="value mono">${block.size || '—'}</span>
        </div>
        <div class="block-row">
            <span class="label">Dificultad</span>
            <span class="value">${block.difficulty || '—'}</span>
        </div>
        <div class="block-footer">
            <span class="miner-tag">⛏️ ${minerDisplay}</span>
            <span class="block-hint">🔗 ver en explorador</span>
        </div>
    `;
    
    return card;
}

function detectNewBlocks(newBlocks) {
    if (previousBlocks.length === 0) return [];
    
    const prevHeights = new Set(previousBlocks.map(b => b.height));
    return newBlocks.filter(b => !prevHeights.has(b.height));
}

function renderBlocks(data) {
    const container = document.getElementById('blockContainer');
    if (!container) return;
    
    if (data.error) {
        container.innerHTML = `<div class="error-msg">⚠️ ${data.error}</div>`;
        return;
    }
    
    if (!data.blocks || data.blocks.length === 0) {
        container.innerHTML = `<div class="error-msg">⚠️ No se encontraron bloques</div>`;
        return;
    }
    
    const newBlocks = detectNewBlocks(data.blocks);
    const isNew = (height) => newBlocks.some(b => b.height === height);
    
    previousBlocks = [...data.blocks];
    currentHeight = data.stats?.height || 0;
    
    container.innerHTML = '';
    data.blocks.forEach((block, index) => {
        const card = createBlockCard(block, isNew(block.height));
        container.appendChild(card);
    });
    
    document.getElementById('statReward').textContent = REWARD;
}

function updateStats(data) {
    if (!data || data.error) return;
    document.getElementById('statDiff').textContent = data.stats?.difficulty || '—';
    document.getElementById('statHeight').textContent = `Bloque #${data.stats?.height || '—'}`;
    document.getElementById('statMempool').textContent = data.stats?.mempool || '0';
    
    const bestBlock = data.stats?.best_block || '';
    document.getElementById('statBestBlock').textContent = formatHash(bestBlock);
    document.getElementById('statBlockTime').textContent = `actualizado ${new Date().toLocaleTimeString()}`;
}

// ─── FETCH DATA ────────────────────────────────────────────
async function fetchData() {
    try {
        const response = await fetch(API_URL);
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const data = await response.json();
        renderBlocks(data);
        updateStats(data);
    } catch (error) {
        console.error('Error:', error);
        document.getElementById('blockContainer').innerHTML = `
            <div class="error-msg">⚠️ Error de conexión: ${error.message}</div>
        `;
    }
}

window.refreshData = function() {
    const link = document.querySelector('.footer-links a:first-child');
    const originalText = link.textContent;
    link.textContent = '↻ Actualizando...';
    fetchData().finally(() => { link.textContent = originalText; });
    return false;
};

// ─── INIT ──────────────────────────────────────────────────
fetchData();
setInterval(fetchData, 10000);  
</script>
</body>
</html>
