<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zcash · Estadísticas</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: #0a080c;
            background-image:
                radial-gradient(ellipse at 30% 40%, rgba(221, 157, 52, 0.06) 0%, transparent 60%),
                radial-gradient(ellipse at 70% 80%, rgba(221, 157, 52, 0.04) 0%, transparent 50%),
                linear-gradient(160deg, #0a080c 0%, #161114 50%, #0d0b10 100%);
            font-family: 'Lucida Console', 'Courier New', monospace;
            color: #ece8e0;
            padding: 0;
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .app {
            width: 100%;
            max-width: 1400px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            gap: 18px;
            padding: 20px 28px;
        }

        .header {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 12px 20px;
            padding: 16px 24px;
            background: rgba(255, 255, 255, 0.02);
            border-radius: 14px;
            border: 1px solid rgba(221, 157, 52, 0.08);
            backdrop-filter: blur(8px);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .brand img {
            width: 38px;
            height: 38px;
            filter: drop-shadow(0 0 16px rgba(221, 157, 52, 0.25));
            transition: filter 0.3s;
        }

        .brand img:hover {
            filter: drop-shadow(0 0 24px rgba(221, 157, 52, 0.4));
        }

        .brand h1 {
            font-size: 21px;
            font-weight: 400;
            letter-spacing: 1.5px;
            color: #f5e6c8;
            text-shadow: 0 0 30px rgba(221, 157, 52, 0.1);
        }

        .brand h1 small {
            font-size: 12px;
            color: #6a6255;
            letter-spacing: 2px;
            font-weight: 300;
        }

        .nav-links {
            display: flex;
            flex-wrap: wrap;
            gap: 4px 18px;
            font-size: 12px;
            letter-spacing: 0.3px;
        }

        .nav-links a {
            color: #6a6255;
            text-decoration: none;
            transition: all 0.25s;
            padding: 4px 0;
            border-bottom: 2px solid transparent;
        }

        .nav-links a:hover {
            color: #dd9d34;
            border-bottom-color: #dd9d34;
        }

        .panel {
            background: rgba(255, 255, 255, 0.02);
            border-radius: 14px;
            border: 1px solid rgba(221, 157, 52, 0.06);
            padding: 24px 28px;
            backdrop-filter: blur(8px);
            transition: border-color 0.3s;
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .panel:hover {
            border-color: rgba(221, 157, 52, 0.1);
        }

        .panel-title {
            display: flex;
            align-items: center;
            gap: 14px;
            color: #dd9d34;
            font-size: 18px;
            letter-spacing: 1px;
            margin-bottom: 18px;
            padding-bottom: 12px;
            border-bottom: 1px solid rgba(221, 157, 52, 0.06);
        }

        .panel-title img {
            width: 32px;
            height: 32px;
            filter: drop-shadow(0 0 12px rgba(221, 157, 52, 0.2));
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 16px;
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.02);
            border-radius: 12px;
            padding: 18px 20px;
            border: 1px solid rgba(221, 157, 52, 0.04);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .stat-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, transparent, rgba(221, 157, 52, 0.2), transparent);
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .stat-card:hover::before {
            opacity: 1;
        }

        .stat-card:hover {
            border-color: rgba(221, 157, 52, 0.12);
            background: rgba(255, 255, 255, 0.04);
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.2);
        }

        .stat-card-title {
            color: #4a443a;
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 12px;
            padding-bottom: 8px;
            border-bottom: 1px solid rgba(221, 157, 52, 0.04);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .stat-card-title .icon {
            font-size: 12px;
        }

        .stat-item {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            padding: 5px 0;
            border-bottom: 1px solid rgba(221, 157, 52, 0.02);
            gap: 8px;
        }

        .stat-item:last-child {
            border-bottom: none;
        }

        .stat-item .label {
            color: #6a6255;
            font-size: 11px;
            letter-spacing: 0.2px;
            white-space: nowrap;
        }

        .stat-item .value {
            color: #f5ede4;
            font-size: 12px;
            text-align: right;
            word-break: break-all;
            flex-shrink: 0;
        }

        .stat-item .value.gold {
            color: #dd9d34;
        }

        .stat-item .value.green {
            color: #31db72;
        }

        .stat-item .value.red {
            color: #ff756f;
        }

        .stat-item .value.mono {
            color: #8a8275;
            font-size: 11px;
        }

        .stat-item .value .pct {
            color: #5a5348;
            font-size: 10px;
            margin-left: 4px;
        }

        .stat-item .value .badge {
            display: inline-block;
            background: rgba(221, 157, 52, 0.08);
            padding: 0 8px;
            border-radius: 4px;
            font-size: 10px;
            color: #8a8275;
            margin-left: 4px;
        }

        .progress-wrap {
            display: flex;
            align-items: center;
            gap: 12px;
            flex: 1;
            justify-content: flex-end;
            min-width: 0;
        }

        .progress-track {
            flex: 1;
            min-width: 80px;
            height: 6px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            overflow: hidden;
            position: relative;
        }

        .progress-fill {
            height: 100%;
            border-radius: 10px;
            transition: width 1s ease;
            background: linear-gradient(90deg, #dd9d34, #f5c542);
            position: relative;
        }

        .progress-fill.gold {
            background: linear-gradient(90deg, #dd9d34, #f5c542);
        }

        .progress-fill.green {
            background: linear-gradient(90deg, #31db72, #5ae89a);
        }

        .progress-fill.orange {
            background: linear-gradient(90deg, #f5a623, #ffd170);
        }

        .progress-fill.purple {
            background: linear-gradient(90deg, #9b59b6, #c084d8);
        }

        .progress-fill.shielded {
            background: linear-gradient(90deg, #3498db, #5dade2);
        }

        .progress-fill::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.15), transparent);
            animation: shimmer 2s infinite;
        }

        @keyframes shimmer {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }

        .progress-value {
            font-size: 12px;
            color: #dd9d34;
            min-width: 45px;
            text-align: right;
            font-weight: 600;
            flex-shrink: 0;
        }

        .progress-value.gold {
            color: #dd9d34;
        }

        .progress-value.green {
            color: #31db72;
        }

        .progress-value.orange {
            color: #f5a623;
        }

        .progress-value.purple {
            color: #c084d8;
        }

        .progress-value.shielded {
            color: #5dade2;
        }

        .status-msg {
            color: #4a443a;
            font-size: 10px;
            margin-top: 16px;
            text-align: center;
            padding: 8px;
            border-top: 1px solid rgba(221, 157, 52, 0.04);
        }

        .footer {
            margin-top: 18px;
            padding-top: 14px;
            border-top: 1px solid rgba(221, 157, 52, 0.06);
            font-size: 11px;
            color: #4a443a;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
        }

        .footer a {
            color: #6a6255;
            text-decoration: none;
            transition: color 0.2s;
        }

        .footer a:hover {
            color: #dd9d34;
        }

        .footer .api-link {
            font-size: 11px;
            color: #5a5348;
            word-break: break-all;
        }

        .footer .api-link:hover {
            color: #dd9d34;
        }

        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(80px);
            background: rgba(221, 157, 52, 0.08);
            backdrop-filter: blur(12px);
            color: #f5ede4;
            padding: 10px 32px;
            border-radius: 40px;
            border: 1px solid rgba(221, 157, 52, 0.12);
            font-family: 'Lucida Console', monospace;
            font-size: 12px;
            opacity: 0;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            pointer-events: none;
            z-index: 999;
            letter-spacing: 0.3px;
            box-shadow: 0 8px 40px rgba(0, 0, 0, 0.3);
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        @media (max-width: 768px) {
            .app {
                padding: 12px 14px;
                gap: 12px;
            }

            .header {
                flex-direction: column;
                align-items: stretch;
                gap: 10px;
                padding: 14px 18px;
            }

            .brand h1 {
                font-size: 17px;
            }

            .brand img {
                width: 30px;
                height: 30px;
            }

            .nav-links {
                font-size: 11px;
                gap: 2px 14px;
            }

            .panel {
                padding: 18px 16px;
            }

            .panel-title {
                font-size: 16px;
            }

            .panel-title img {
                width: 28px;
                height: 28px;
            }

            .stats-grid {
                grid-template-columns: 1fr;
                gap: 12px;
            }

            .stat-card {
                padding: 14px 16px;
            }

            .stat-item .label {
                font-size: 10px;
                white-space: normal;
            }

            .stat-item .value {
                font-size: 11px;
            }

            .progress-track {
                min-width: 50px;
            }

            .footer {
                flex-direction: column;
                align-items: flex-start;
                gap: 6px;
            }
        }

        @media (max-width: 480px) {
            .app {
                padding: 8px 10px;
                gap: 10px;
            }

            .header {
                padding: 10px 14px;
            }

            .brand h1 {
                font-size: 15px;
            }

            .brand h1 small {
                font-size: 10px;
            }

            .brand img {
                width: 26px;
                height: 26px;
            }

            .panel {
                padding: 14px 12px;
                border-radius: 10px;
            }

            .panel-title {
                font-size: 14px;
                gap: 10px;
                margin-bottom: 14px;
                padding-bottom: 10px;
            }

            .panel-title img {
                width: 24px;
                height: 24px;
            }

            .stat-card {
                padding: 12px 14px;
            }

            .stat-card-title {
                font-size: 9px;
            }

            .stat-item {
                padding: 3px 0;
                flex-wrap: wrap;
                gap: 2px;
            }

            .stat-item .label {
                font-size: 10px;
                min-width: 70px;
                white-space: normal;
            }

            .stat-item .value {
                font-size: 10px;
                text-align: left;
                flex: 1;
            }

            .progress-wrap {
                flex-wrap: nowrap;
                gap: 8px;
            }

            .progress-track {
                min-width: 40px;
                height: 5px;
            }

            .progress-value {
                font-size: 10px;
                min-width: 35px;
            }

            .footer {
                font-size: 10px;
            }

            .footer .api-link {
                font-size: 10px;
            }

            .status-msg {
                font-size: 9px;
            }
        }

        @media (min-width: 1920px) {
            .app {
                max-width: 1600px;
                padding: 24px 40px;
            }

            .stats-grid {
                grid-template-columns: repeat(auto-fit, minmax(380px, 1fr));
            }

            .stat-item .value {
                font-size: 13px;
            }
        }
    </style>
</head>
<body>

    <div class="app">

        <header class="header">
            <div class="brand">
                <img src="assets/zcash.png" alt="Zcash">
                <h1>Zcash <small>estadísticas</small></h1>
            </div>
            <nav class="nav-links">
                <a href="https://carover0.github.io/pagina/zec-nodo.html">[NODO]</a>
                <a href="https://carover0.github.io/pagina/zec-explorer.html">[EXPLORADOR]</a>
                <a href="https://carover0.github.io/pagina/zec-consola.html">[CONSOLA]</a>
                <a href="https://carover0.github.io/pagina/zec-servidores.html">[SERVIDORES]</a>
                <a href="https://carover0.github.io/pagina/">[INICIO]</a>
            </nav>
        </header>
            <div class="stats-grid" id="statsGrid">
            </div>

            <div id="statusMsg" class="status-msg">Cargando datos...</div>

            <footer class="footer">
                <a href="https://carover0.xyz/zec/status.json" target="_blank" rel="noopener" class="api-link">https://carover0.xyz/zec/status.json</a>
                <span>actualizado cada 60s</span>
            </footer>
        </div>

    </div>

    <div class="toast" id="toast"></div>

    <script>
        const RPC_URL = "https://carover0.xyz/api/zec/rpc.php";
        const TOKEN = "zec2026";
        const PRICE_URL = "https://carover0.xyz/getprice.php";

        const HALVING_BLOCK = 4406400;
        const BLOCKS_PER_DAY = 1152;
        const MAX_SUPPLY = 21000000;

        const upgradeNames = {
            "5ba81b19": "Overwinter",
            "76b809bb": "Sapling",
            "2bb40e60": "Blossom",
            "f5b9230b": "Heartwood",
            "e9ff75a6": "Canopy",
            "c2d6d0b4": "NU5",
            "c8e71055": "NU6",
            "4dec4df0": "NU6.1",
            "5437f330": "NU6.2",
            "37a5165b": "NU6.3"
        };

        const poolIcons = {
            'transparent': '█',
            'orchard': '◈',
            'sapling': '◉',
            'sprout': '○',
            'lockbox': '▣',
            'ironwood': '✦'
        };

        function escapeHtml(text) {
            if (!text) return '';
            return String(text).replace(/[&<>]/g, function(m) {
                if (m === '&') return '&amp;';
                if (m === '<') return '&lt;';
                if (m === '>') return '&gt;';
                return m;
            });
        }

        function formatNumber(num, decimals = 0) {
            if (num === undefined || num === null || num === '---') return '---';
            return Number(num).toLocaleString(undefined, { maximumFractionDigits: decimals, useGrouping: true });
        }

        function formatLargeNumber(num) {
            if (num === undefined || num === null) return '---';
            const n = Number(num);
            if (n >= 1e9) return (n / 1e9).toFixed(2) + 'B';
            if (n >= 1e6) return (n / 1e6).toFixed(2) + 'M';
            if (n >= 1e3) return (n / 1e3).toFixed(2) + 'K';
            return n.toFixed(2);
        }

        function formatTimeRemaining(days) {
            if (days < 0 || days === undefined || isNaN(days)) return '---';
            const years = Math.floor(days / 365);
            const remainingDays = Math.floor(days % 365);
            const months = Math.floor(remainingDays / 30);
            const daysOnly = remainingDays % 30;
            let result = [];
            if (years > 0) result.push(years + ' año' + (years > 1 ? 's' : ''));
            if (months > 0) result.push(months + ' mes' + (months > 1 ? 'es' : ''));
            if (daysOnly > 0 && years === 0) result.push(daysOnly + ' día' + (daysOnly > 1 ? 's' : ''));
            return result.join(', ') || 'menos de 1 día';
        }

        function showToast(msg) {
            const el = document.getElementById('toast');
            el.textContent = msg;
            el.classList.add('show');
            clearTimeout(el._timer);
            el._timer = setTimeout(() => el.classList.remove('show'), 1800);
        }

        async function callRPC(method, params = []) {
            try {
                const url = `${RPC_URL}?token=${TOKEN}&cmd=${encodeURIComponent(method + (params.length ? ' ' + params.join(' ') : ''))}`;
                const res = await fetch(url);
                const data = await res.json();
                return data.result;
            } catch (e) {
                console.error(`RPC error ${method}:`, e);
                return null;
            }
        }

        async function loadPrice() {
            try {
                const res = await fetch(PRICE_URL);
                const data = await res.json();
                return data.success ? data.price : null;
            } catch (e) {
                return null;
            }
        }

        function renderStats(data) {
            const container = document.getElementById('statsGrid');

            if (!data) {
                container.innerHTML = '<div style="color:#4a443a;text-align:center;padding:30px;">No se pudieron cargar los datos</div>';
                return;
            }

            const {
                price,
                totalSupply,
                currentHeight,
                difficulty,
                bestBlock,
                transparent,
                orchard,
                sapling,
                sprout,
                lockbox,
                ironwood,
                poolsTotal,
                shieldedTotal,
                shieldedPct,
                upgrades,
                consensusTip,
                blocksRemaining,
                halvingProgress,
                daysRemaining,
                currentReward,
                mempoolSize,
                mempoolValue
            } = data;

            const minedPercent = totalSupply > 0 ? (totalSupply / MAX_SUPPLY) * 100 : 0;

            let html = '';

            html += `<div class="stat-card">
                <div class="stat-card-title"><span class="icon">⧫</span> RED</div>
                <div class="stat-item"><span class="label">PRECIO</span><span class="value gold">${price !== null ? '$' + price.toFixed(2) : '---'}</span></div>
                <div class="stat-item"><span class="label">SUMINISTRO TOTAL</span><span class="value gold">${formatNumber(totalSupply, 2)} ZEC</span></div>
                <div class="stat-item">
                    <span class="label">PROGRESO MINADO</span>
                    <div class="progress-wrap">
                        <div class="progress-track"><div class="progress-fill gold" style="width:${Math.min(minedPercent, 100)}%"></div></div>
                        <span class="progress-value gold">${minedPercent.toFixed(2)}%</span>
                    </div>
                </div>
                <div class="stat-item"><span class="label">BLOQUES</span><span class="value">${formatNumber(currentHeight)}</span></div>
                <div class="stat-item"><span class="label">DIFICULTAD</span><span class="value">${formatLargeNumber(difficulty)}</span></div>
                <div class="stat-item"><span class="label">BEST BLOCK</span><span class="value mono">${bestBlock || '---'}</span></div>
            </div>`;

            const pools = [
                { id: 'transparent', label: 'TRANSPARENTE (t...)', value: transparent, icon: '█' },
                { id: 'orchard', label: 'ORCHARD (u1...)', value: orchard, icon: '◈', gold: true },
                { id: 'sapling', label: 'SAPLING (zs...)', value: sapling, icon: '◉', gold: true },
                { id: 'sprout', label: 'SPROUT (zc...)', value: sprout, icon: '○' },
                { id: 'lockbox', label: 'LOCKBOX', value: lockbox, icon: '▣' },
                { id: 'ironwood', label: 'IRONWOOD', value: ironwood, icon: '✦' }
            ];

            html += `<div class="stat-card">
                <div class="stat-card-title"><span class="icon">◈</span> POOLS DE VALOR</div>`;
            for (const pool of pools) {
                const pct = poolsTotal > 0 ? (pool.value / poolsTotal) * 100 : 0;
                const goldClass = pool.gold ? ' gold' : '';
                html += `<div class="stat-item">
                    <span class="label">${pool.icon} ${pool.label}</span>
                    <span class="value${goldClass}">${formatNumber(pool.value, 2)} ZEC <span class="pct">${pct.toFixed(1)}%</span></span>
                </div>`;
            }
            html += `</div>`;

            html += `<div class="stat-card">
                <div class="stat-card-title"><span class="icon">🛡</span> SUMINISTRO BLINDADO</div>
                <div class="stat-item"><span class="label">TOTAL BLINDADO</span><span class="value gold">${formatNumber(shieldedTotal, 2)} ZEC</span></div>
                <div class="stat-item">
                    <span class="label">% CIRCULANTE</span>
                    <div class="progress-wrap">
                        <div class="progress-track"><div class="progress-fill shielded" style="width:${Math.min(shieldedPct, 100)}%"></div></div>
                        <span class="progress-value shielded">${shieldedPct.toFixed(1)}%</span>
                    </div>
                </div>
            </div>`;

            const halvingDate = daysRemaining > 0 ? new Date(Date.now() + (daysRemaining * 24 * 60 * 60 * 1000)) : null;
            html += `<div class="stat-card">
                <div class="stat-card-title"><span class="icon">⏱</span> HALVING</div>
                <div class="stat-item"><span class="label">PROXIMO HALVING</span><span class="value gold">${halvingDate ? halvingDate.toLocaleDateString() + ' (est.)' : '---'}</span></div>
                <div class="stat-item"><span class="label">BLOQUE OBJETIVO</span><span class="value">4,406,400</span></div>
                <div class="stat-item">
                    <span class="label">BLOQUES RESTANTES</span>
                    <div class="progress-wrap">
                        <div class="progress-track"><div class="progress-fill orange" style="width:${Math.min(halvingProgress, 100)}%"></div></div>
                        <span class="progress-value orange">${formatNumber(blocksRemaining)}</span>
                    </div>
                </div>
                <div class="stat-item"><span class="label">TIEMPO ESTIMADO</span><span class="value">${formatTimeRemaining(daysRemaining)}</span></div>
                <div class="stat-item"><span class="label">REWARD ACTUAL</span><span class="value gold">${currentReward} ZEC</span></div>
            </div>`;

            html += `<div class="stat-card">
                <div class="stat-card-title"><span class="icon">⬆</span> ACTUALIZACIONES ACTIVAS</div>`;
            for (const [key, name] of Object.entries(upgradeNames)) {
                const upgrade = upgrades && upgrades[key];
                const status = upgrade ? (upgrade.status === 'active' ? 'activo' : 'bloque ' + formatNumber(upgrade.activationheight)) : '---';
                const isActive = status === 'activo';
                html += `<div class="stat-item">
                    <span class="label">${name}</span>
                    <span class="value${isActive ? ' green' : ''}">${escapeHtml(status)}</span>
                </div>`;
            }
            html += `<div class="stat-item">
                <span class="label">CONSENSUS CHAINTIP</span>
                <span class="value mono">${consensusTip ? (upgradeNames[consensusTip] || consensusTip) : '---'}</span>
            </div>`;
            html += `</div>`;

            html += `<div class="stat-card">
                <div class="stat-card-title"><span class="icon">📋</span> MEMPOOL</div>
                <div class="stat-item"><span class="label">TRANSACCIONES</span><span class="value">${mempoolSize !== null ? mempoolSize + ' tx' : '---'}</span></div>
                <div class="stat-item"><span class="label">VALOR TOTAL</span><span class="value gold">${mempoolValue !== null ? formatNumber(mempoolValue, 2) + ' ZEC' : '---'}</span></div>
            </div>`;

            container.innerHTML = html;
        }

        async function loadData() {
            const statusMsg = document.getElementById('statusMsg');
            statusMsg.innerHTML = 'Cargando datos...';

            try {
                const [price, blockchainInfo] = await Promise.all([
                    loadPrice(),
                    callRPC('getblockchaininfo')
                ]);

                if (!blockchainInfo) throw new Error('No se pudo obtener blockchainInfo');

                const totalSupply = blockchainInfo.chainSupply?.chainValue || 0;
                const currentHeight = blockchainInfo.blocks || 0;
                const difficulty = blockchainInfo.difficulty || 0;
                const bestBlock = blockchainInfo.bestblockhash ?
                    blockchainInfo.bestblockhash.substring(0, 16) + '...' + blockchainInfo.bestblockhash.substring(blockchainInfo.bestblockhash.length - 4) :
                    '---';

                let transparent = 0,
                    orchard = 0,
                    sapling = 0,
                    sprout = 0,
                    lockbox = 0,
                    ironwood = 0;
                if (blockchainInfo.valuePools && Array.isArray(blockchainInfo.valuePools)) {
                    blockchainInfo.valuePools.forEach(pool => {
                        const value = pool.chainValue || 0;
                        switch (pool.id) {
                            case 'transparent':
                                transparent = value;
                                break;
                            case 'orchard':
                                orchard = value;
                                break;
                            case 'sapling':
                                sapling = value;
                                break;
                            case 'sprout':
                                sprout = value;
                                break;
                            case 'lockbox':
                                lockbox = value;
                                break;
                            case 'ironwood':
                                ironwood = value;
                                break;
                        }
                    });
                }

                const poolsTotal = transparent + orchard + sapling + sprout + lockbox + ironwood;
                const shieldedTotal = orchard + sapling + sprout + ironwood;
                const shieldedPct = totalSupply > 0 ? (shieldedTotal / totalSupply) * 100 : 0;

                const upgrades = blockchainInfo.upgrades || {};
                const consensusTip = blockchainInfo.consensus?.chaintip || '';

                const blocksRemaining = Math.max(0, HALVING_BLOCK - currentHeight);
                const blocksSinceLastHalving = Math.max(0, currentHeight - 2726400);
                const totalBlocksInCycle = 1680000;
                const halvingProgress = totalBlocksInCycle > 0 ? (blocksSinceLastHalving / totalBlocksInCycle) * 100 : 0;
                const daysRemaining = BLOCKS_PER_DAY > 0 ? blocksRemaining / BLOCKS_PER_DAY : 0;

                let currentReward = '---';
                if (currentHeight >= 4406400) currentReward = '0.78125';
                else if (currentHeight >= 2726400) currentReward = '1.5625';
                else if (currentHeight >= 1046400) currentReward = '3.125';
                else if (currentHeight > 0) currentReward = '6.25';

                // Mempool
                let mempoolSize = null,
                    mempoolValue = null;
                try {
                    const mempoolTxids = await callRPC('getrawmempool') || [];
                    mempoolSize = mempoolTxids.length || 0;

                    let mempoolTotal = 0;
                    if (mempoolSize > 0) {
                        const sampleTxids = mempoolTxids.slice(0, 10);
                        let processed = 0;
                        for (const txid of sampleTxids) {
                            try {
                                const tx = await callRPC('getrawtransaction', [txid, 1]);
                                if (tx && tx.vout) {
                                    const txValue = tx.vout.reduce((sum, vout) => sum + (vout.value || 0), 0);
                                    mempoolTotal += txValue;
                                }
                                processed++;
                            } catch (e) {}
                        }
                        if (mempoolSize > 10 && processed > 0) {
                            const avgValue = mempoolTotal / processed;
                            mempoolTotal = mempoolTotal + (avgValue * (mempoolSize - 10));
                        }
                        mempoolValue = mempoolTotal;
                    } else {
                        mempoolValue = 0;
                    }
                } catch (e) {
                    // Mempool no disponible
                }

                renderStats({
                    price,
                    totalSupply,
                    currentHeight,
                    difficulty,
                    bestBlock,
                    transparent,
                    orchard,
                    sapling,
                    sprout,
                    lockbox,
                    ironwood,
                    poolsTotal,
                    shieldedTotal,
                    shieldedPct,
                    upgrades,
                    consensusTip,
                    blocksRemaining,
                    halvingProgress,
                    daysRemaining,
                    currentReward,
                    mempoolSize,
                    mempoolValue
                });

                statusMsg.innerHTML = 'Datos actualizados ' + new Date().toLocaleTimeString();

            } catch (e) {
                statusMsg.innerHTML = '[!] Error: ' + e.message;
                console.error(e);
            }
        }

        // ─── INIT ────────────────────────────────────────────────────────
        loadData();
        setInterval(loadData, 60000);
    </script>

</body>
</html>
